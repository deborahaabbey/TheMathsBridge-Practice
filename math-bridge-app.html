 t². The ball falls 45 m in 3 s. Find d when t = 2.", "o": ["30 m", "10 m", "20 m", "15 m"], "a": 2, "e": "d = 5t², so d = 5 × 4 = 20. (Altered from 44.1 m.)"}, {"q": "y is directly proportional to √x. When x = 9, y = 6. Find y when x = 25.", "o": ["25", "15", "12", "10"], "a": 3, "e": "y = 2√x, so y = 2 × 5 = 10."}, {"q": "y is inversely proportional to x³. When x = 2, y = 0.5. Find y in terms of x.", "o": ["y = 1/x³", "y = 4/x³", "y = 4x³", "y = 0.25/x³"], "a": 1, "e": "k = 0.5 × 8 = 4."}, {"q": "y is directly proportional to (x − 1)². When x = 3, y = 24. Find y when x = 6.", "o": ["60", "120", "180", "150"], "a": 3, "e": "k = 24 ÷ 4 = 6, so y = 6 × 25 = 150."}, {"q": "y is inversely proportional to √(1 + x). When x = 8, y = 2. Find y when x = 15.", "o": ["3", "1.5", "1", "4"], "a": 1, "e": "k = 2 × 3 = 6, so y = 6 ÷ 4 = 1.5."}, {"q": "y is inversely proportional to (x + 1)². When x = 1, y = 18. Find y when x = 0.5.", "o": ["32", "72", "8", "12"], "a": 0, "e": "k = 18 × 4 = 72, so y = 72 ÷ 2.25 = 32. (Altered from y = 50 when x = 0.2.)"}, {"q": "h is directly proportional to √p. h = 5.4 when p = 1.44. Find h when p = 2.89.", "o": ["8.1", "6.8", "7.65", "9.18"], "a": 2, "e": "√1.44 = 1.2, so k = 4.5. √2.89 = 1.7, so h = 7.65."}, {"q": "y is inversely proportional to x². When x = 2, y = 8. Find y in terms of x.", "o": ["y = 32/x²", "y = 16/x²", "y = 4/x²", "y = 32x²"], "a": 0, "e": "k = 8 × 4 = 32."}, {"q": "z is inversely proportional to (y − 2)². When y = 5, z = 9. Find z in terms of y.", "o": ["z = 9/(y − 2)²", "z = 27/(y − 2)²", "z = 81(y − 2)²", "z = 81/(y − 2)²"], "a": 3, "e": "k = 9 × 9 = 81."}, {"q": "y is directly proportional to the cube root of (x + 3). When x = 5, y = 2/3. Find y when x = 24.", "o": ["3", "2", "1/3", "1"], "a": 3, "e": "∛8 = 2, so k = 1/3. ∛27 = 3, so y = 1."}]}, "12": {"Indices and logarithms": [{"q": "Simplify x⁵ ÷ x².", "o": ["x³", "x⁷", "x²·⁵", "x¹⁰"], "a": 0, "e": "Subtract the powers: 5 − 2 = 3."}, {"q": "Solve 2ˣ = 32.", "o": ["4", "5", "6", "16"], "a": 1, "e": "32 = 2⁵, so x = 5."}, {"q": "Simplify log₂ 8 + log₂ 4.", "o": ["6", "12", "5", "32"], "a": 2, "e": "log₂ 8 = 3, log₂ 4 = 2, sum = 5."}, {"q": "Simplify x⁰.", "o": ["1", "0", "x", "Undefined"], "a": 0, "e": "Any non-zero value raised to the power 0 is 1."}, {"q": "Simplify x⁻².", "o": ["1/x²", "−2x", "1/x⁻²", "−x²"], "a": 0, "e": "A negative power means the reciprocal: x⁻² = 1/x²."}, {"q": "Solve log x = 2 (base 10).", "o": ["100", "20", "10", "1000"], "a": 0, "e": "log x = 2 means x = 10² = 100."}, {"q": "Simplify (2x)⁻¹.", "o": ["1/(2x)", "−2x", "2/x", "1/2x²"], "a": 0, "e": "A power of −1 means the reciprocal of the whole term."}, {"q": "Simplify log₅ 25.", "o": ["2", "5", "10", "25"], "a": 0, "e": "5² = 25, so log₅ 25 = 2."}, {"q": "Simplify x³ × x⁻¹.", "o": ["x²", "x⁴", "x⁻²", "x³"], "a": 0, "e": "Add the powers: 3 + (−1) = 2."}, {"q": "Solve log₄ 16 = x.", "o": ["2", "4", "8", "16"], "a": 0, "e": "4² = 16, so x = 2."}, {"q": "Simplify (x⁻¹)⁻¹.", "o": ["x", "x⁻¹", "1", "−x"], "a": 0, "e": "Taking the reciprocal twice returns the original value."}, {"q": "Simplify 2⁻³.", "o": ["1/8", "−6", "8", "−8"], "a": 0, "e": "2⁻³ = 1/2³ = 1/8."}, {"q": "Solve log x + log 2 = log 20 (base 10).", "o": ["10", "18", "22", "40"], "a": 0, "e": "log(2x) = log 20, so 2x = 20, x = 10."}, {"q": "Simplify x⁷ ÷ x⁴.", "o": ["x³", "x¹¹", "x²⁸", "x⁴"], "a": 0, "e": "Subtract the powers: 7 − 4 = 3."}, {"q": "Solve log₂ 32 = x.", "o": ["5", "4", "6", "16"], "a": 0, "e": "2⁵ = 32, so x = 5."}, {"q": "Simplify (x²)⁻¹.", "o": ["1/x²", "−x²", "x⁻¹", "2x⁻¹"], "a": 0, "e": "A power of −1 means the reciprocal: 1/x²."}, {"q": "Simplify 3⁻².", "o": ["1/9", "−6", "9", "−9"], "a": 0, "e": "3⁻² = 1/3² = 1/9."}, {"q": "Solve log x − log 4 = log 5 (base 10).", "o": ["20", "9", "1.25", "0.8"], "a": 0, "e": "log(x/4) = log 5, so x/4 = 5, x = 20."}], "Functions (domain, range, composite, inverse)": [{"q": "If f(x) = 2x + 1, find f(3).", "o": ["6", "7", "5", "4"], "a": 1, "e": "f(3) = 2(3) + 1 = 7."}, {"q": "If f(x) = x² and g(x) = x + 1, find f(g(2)).", "o": ["9", "5", "4", "8"], "a": 0, "e": "g(2) = 3, then f(3) = 9."}, {"q": "What is the inverse of f(x) = x − 4?", "o": ["f⁻¹(x) = x + 4", "f⁻¹(x) = 4 − x", "f⁻¹(x) = x − 4", "f⁻¹(x) = 4x"], "a": 0, "e": "Reverse the operation: add 4."}, {"q": "If f(x) = 3x − 2, find f(−1).", "o": ["−5", "−1", "5", "1"], "a": 0, "e": "3(−1) − 2 = −5."}, {"q": "If f(x) = x² − 1, find the values of x for which f(x) = 0.", "o": ["x = ±1", "x = 1 only", "x = −1 only", "x = 0"], "a": 0, "e": "x² = 1, so x = 1 or x = −1."}, {"q": "If f(x) = 2x and g(x) = x − 3, find g(f(2)).", "o": ["1", "4", "−2", "2"], "a": 0, "e": "f(2) = 4, then g(4) = 4 − 3 = 1."}, {"q": "Find the range of f(x) = x² for real x.", "o": ["f(x) ≥ 0", "f(x) > 0", "All real numbers", "f(x) ≤ 0"], "a": 0, "e": "Squaring any real number gives a non-negative result."}, {"q": "If f(x) = 1/x, what value is excluded from the domain?", "o": ["x = 0", "x = 1", "x = −1", "None"], "a": 0, "e": "Division by zero is undefined."}, {"q": "If f(x) = x² + 2x, find f(3).", "o": ["15", "11", "9", "6"], "a": 0, "e": "3² + 2(3) = 9 + 6 = 15."}, {"q": "If f(x) = 2x − 1 and f(a) = 9, find a.", "o": ["5", "4", "10", "8"], "a": 0, "e": "2a − 1 = 9, so a = 5."}, {"q": "If f(x) = x + 2 and g(x) = 2x, find f(g(3)).", "o": ["8", "6", "12", "10"], "a": 0, "e": "g(3) = 6, then f(6) = 8."}, {"q": "Which of these is a one-to-one function?", "o": ["f(x) = x + 1", "f(x) = x²", "f(x) = |x|", "f(x) = x² − 1 for all real x"], "a": 0, "e": "Each output of f(x) = x + 1 comes from exactly one input."}, {"q": "If f(x) = 3 − x, find f⁻¹(x).", "o": ["f⁻¹(x) = 3 − x", "f⁻¹(x) = x − 3", "f⁻¹(x) = x + 3", "f⁻¹(x) = −3 − x"], "a": 0, "e": "Swap x and y in y = 3 − x and solve for y: y = 3 − x."}, {"q": "If f(x) = x² − 3x, find f(4).", "o": ["4", "7", "28", "1"], "a": 0, "e": "4² − 3(4) = 16 − 12 = 4."}, {"q": "If f(x) = 5x + 2 and f(a) = 17, find a.", "o": ["3", "4", "15", "19"], "a": 0, "e": "5a = 15, so a = 3."}, {"q": "If f(x) = x − 1 and g(x) = x², find g(f(3)).", "o": ["4", "2", "8", "9"], "a": 0, "e": "f(3) = 2, then g(2) = 4."}, {"q": "A function maps every input to the same output. What type of function is it?", "o": ["Constant function", "Linear function", "Quadratic function", "Identity function"], "a": 0, "e": "Every input gives the same fixed output."}, {"q": "If f(x) = 2x + 5, find f⁻¹(x).", "o": ["f⁻¹(x) = (x − 5)/2", "f⁻¹(x) = (x + 5)/2", "f⁻¹(x) = 2x − 5", "f⁻¹(x) = (5 − x)/2"], "a": 0, "e": "Swap x and y, then solve for y: y = (x − 5)/2."}, {"q": "f(x) = 5x − 3 and g(x) = 10/(x − 2). Find gf(x).", "o": ["10/(5x − 5)", "10/(x − 5)", "2/(x − 1)", "5x − 23"], "a": 2, "e": "g(5x − 3) = 10/(5x − 5) = 2/(x − 1)."}, {"q": "g(x) = 10/(x − 2). Find g⁻¹(x).", "o": ["10/(x + 2)", "x/10 + 2", "10/x + 2", "(x − 2)/10"], "a": 2, "e": "Swap and rearrange: x = 10/y + 2."}, {"q": "f(x) = x² and g(x) = (x + 5)/2. Find g⁻¹(x).", "o": ["2x − 5", "2x + 5", "(x − 5)/2", "x/2 − 5"], "a": 0, "e": "y = (x + 5)/2 gives x = 2y − 5."}, {"q": "f(x) = x², g(x) = (x + 5)/2 and h(x) = 7x − 3. Solve gf(x) = hh⁻¹(63) for x > 0.", "o": ["13", "11", "9", "121"], "a": 1, "e": "hh⁻¹(63) = 63, so (x² + 5)/2 = 63, x² = 121."}, {"q": "g(x) = 2/x. Find g(1/2).", "o": ["1", "1/4", "4", "2"], "a": 2, "e": "2 ÷ 1/2 = 4."}, {"q": "f(x) = 10 − x. Find x when f(x) = 7.", "o": ["17", "7", "−3", "3"], "a": 3, "e": "10 − x = 7."}, {"q": "g(x) = 2/x and h(x) = 2ˣ. Find x when g(x) = h(3).", "o": ["4", "3", "1/4", "2/3"], "a": 2, "e": "h(3) = 8, so 2/x = 8."}, {"q": "j(x) = 5 − 2x. Find j⁻¹(x).", "o": ["(5 − x)/2", "(x − 5)/2", "5 − x/2", "(5 + x)/2"], "a": 0, "e": "x = (5 − y)/2."}, {"q": "f(x) = 2x − 1 and g(x) = 3x − 2. Find gf(2).", "o": ["4", "3", "7", "10"], "a": 2, "e": "f(2) = 3, g(3) = 7."}, {"q": "h(x) = 1/x and j(x) = 5ˣ. Find x when h(x) = j(−2).", "o": ["1/25", "−2", "25", "5"], "a": 2, "e": "j(−2) = 1/25, so x = 25."}, {"q": "j(x) = 5ˣ. Find x when j⁻¹(x) = 4.", "o": ["20", "1024", "625", "16"], "a": 2, "e": "x = j(4) = 5⁴."}, {"q": "f(x) = x² − 25 and g(x) = x + 4. Solve fg(x + 1) = gf(x).", "o": ["x = 2.1", "x = −21", "x = −2.1", "x = 0"], "a": 2, "e": "(x + 5)² − 25 = x² − 21 gives 10x = −21."}, {"q": "f(x) = 2^(x − 3). Find ff(6).", "o": ["8", "16", "64", "32"], "a": 3, "e": "f(6) = 8, f(8) = 2⁵."}, {"q": "f(x) = 2^(x − 3) and h(x) = 5/(x − 4). Find x when f(x) = h(84).", "o": ["1", "−4", "3", "−1"], "a": 3, "e": "h(84) = 1/16 = 2⁻⁴, so x − 3 = −4."}, {"q": "f(x) = 3 − 2x. Find ff(x).", "o": ["3 − 4x", "9 − 4x", "4x − 3", "−4x"], "a": 2, "e": "3 − 2(3 − 2x) = 4x − 3."}, {"q": "f(x) = 3 − 2x and g(x) = x² + 5. Solve g(x) = f(x) + 37.", "o": ["x = −5 or x = 7", "x = 5 or x = −7", "x = 5 only", "x = 7 or x = 5"], "a": 1, "e": "x² + 2x − 35 = 0, so (x − 5)(x + 7) = 0."}], "Calculus: differentiation and integration (university)": [{"q": "Differentiate x³.", "o": ["3x²", "x²", "3x", "x⁴/4"], "a": 0, "e": "Bring down the power, reduce it by 1."}, {"q": "Differentiate 5x² + 3x.", "o": ["10x + 3", "5x + 3", "10x", "10x² + 3"], "a": 0, "e": "5 × 2x = 10x and the derivative of 3x is 3."}, {"q": "∫ 2x dx = ?", "o": ["x² + c", "2x² + c", "x + c", "2 + c"], "a": 0, "e": "Raise the power by 1 and divide by it."}, {"q": "Differentiate x⁴.", "o": ["4x³", "x³", "4x⁵", "x⁴/4"], "a": 0, "e": "Bring down the power, reduce it by 1."}, {"q": "Differentiate 7x³ − 2x.", "o": ["21x² − 2", "21x²", "7x² − 2", "21x³ − 2x"], "a": 0, "e": "Differentiate each term: 21x² and −2."}, {"q": "Find dy/dx if y = 5x² + 3x − 1.", "o": ["10x + 3", "10x", "5x + 3", "10x² + 3"], "a": 0, "e": "Differentiate each term: 10x and 3; the constant disappears."}, {"q": "∫ 4x³ dx = ?", "o": ["x⁴ + c", "4x⁴ + c", "x⁴/4 + c", "12x² + c"], "a": 0, "e": "Raise the power by 1 and divide by the new power: 4x⁴/4 = x⁴."}, {"q": "∫ (3x² + 2) dx = ?", "o": ["x³ + 2x + c", "x³ + c", "3x³ + 2x + c", "x³ + 2x² + c"], "a": 0, "e": "Integrate each term separately."}, {"q": "Find the gradient of y = x² − 4x at x = 3.", "o": ["2", "6", "10", "−2"], "a": 0, "e": "dy/dx = 2x − 4, so at x = 3: 6 − 4 = 2."}, {"q": "Differentiate 1/x² (write as x⁻²).", "o": ["−2x⁻³", "2x⁻³", "−2x⁻¹", "x⁻³"], "a": 0, "e": "Bring down the power −2, reduce it by 1: −2x⁻³."}, {"q": "∫₀¹ 2x dx = ?", "o": ["1", "2", "0", "1/2"], "a": 0, "e": "Integrate to get x², then evaluate: 1² − 0² = 1."}]}, "13": {"Functions (domain, range, composite, inverse)": [{"q": "If f(x) = x² + 1, find f⁻¹ for x ≥ 0 at f(x) = 5.", "o": ["x = 2", "x = 4", "x = 5", "x = 3"], "a": 0, "e": "x² + 1 = 5, so x² = 4, x = 2."}, {"q": "What is the domain of f(x) = 1/(x − 2)?", "o": ["All x except 2", "All x except 0", "All x ≥ 2", "All real x"], "a": 0, "e": "Division by zero is undefined at x = 2."}, {"q": "If f(x) = √x, what is the domain?", "o": ["x ≥ 0", "All real x", "x > 0", "x ≤ 0"], "a": 0, "e": "A square root is only real for non-negative x."}, {"q": "Is f(x) = 1/x continuous at x = 0?", "o": ["No, it is undefined there", "Yes", "Only for x > 0", "Only for x < 0"], "a": 0, "e": "Division by zero means the function has no value at x = 0."}, {"q": "What is the range of f(x) = √x for x ≥ 0?", "o": ["f(x) ≥ 0", "All real numbers", "f(x) > 0", "f(x) ≤ 0"], "a": 0, "e": "A square root of a non-negative number is never negative."}, {"q": "Is f(x) = x² continuous everywhere?", "o": ["Yes", "No, undefined at x = 0", "Only for x > 0", "Only for x < 0"], "a": 0, "e": "Polynomials are continuous for all real x."}, {"q": "What is the domain of f(x) = √(x − 3)?", "o": ["x ≥ 3", "All real x", "x > 3", "x ≤ 3"], "a": 0, "e": "The expression under the root must be non-negative."}, {"q": "Is f(x) = 1/(x − 2) continuous at x = 2?", "o": ["No, undefined there", "Yes", "Only for x > 2", "Only for x < 2"], "a": 0, "e": "Division by zero means the function has no value at x = 2."}, {"q": "If f(x) = 2x² − 3, find f(0).", "o": ["−3", "0", "3", "2"], "a": 0, "e": "2(0)² − 3 = −3."}, {"q": "If f(x) = x³, find f(−2).", "o": ["−8", "8", "−6", "6"], "a": 0, "e": "(−2)³ = −8."}, {"q": "If f(x) = √(x + 1), what is the domain?", "o": ["x ≥ −1", "x ≥ 1", "All real x", "x ≤ −1"], "a": 0, "e": "The expression under the root must be non-negative: x + 1 ≥ 0."}, {"q": "If f: x → 3x − 5, find f⁻¹(x).", "o": ["(x + 5)/3", "(x − 5)/3", "3x + 5", "(5 − x)/3"], "a": 0, "e": "Swap x and y, then solve for y: y = (x + 5)/3."}, {"q": "If f(x) = x² + 1 and g(x) = x − 2, find (f∘g)(x).", "o": ["(x − 2)² + 1", "x² − 2 + 1", "x² + 1 − 2", "(x + 1)² − 2"], "a": 0, "e": "Substitute g(x) into f: f(x − 2) = (x − 2)² + 1."}, {"q": "A function f is called even if f(−x) equals:", "o": ["f(x)", "−f(x)", "0", "1/f(x)"], "a": 0, "e": "An even function is symmetric about the y-axis."}], "Sequences and series": [{"q": "Find the sum of the first 4 terms of 2, 4, 6, 8.", "o": ["10", "20", "24", "16"], "a": 1, "e": "2 + 4 + 6 + 8 = 20."}, {"q": "An arithmetic sequence has first term 3 and common difference 5. Find the 6th term.", "o": ["28", "23", "18", "33"], "a": 0, "e": "3 + 5(6 − 1) = 28."}, {"q": "Find the sum to infinity of 1 + 1/2 + 1/4 + ... (r = 1/2).", "o": ["2", "1", "∞", "1/2"], "a": 0, "e": "Sum = a / (1 − r) = 1 / (1/2) = 2."}, {"q": "Find the sum of the first 5 terms of 3, 6, 9, 12, 15.", "o": ["45", "42", "48", "36"], "a": 0, "e": "3 + 6 + 9 + 12 + 15 = 45."}, {"q": "An arithmetic sequence has first term 2 and 10th term 38. Find the common difference.", "o": ["4", "3", "5", "36"], "a": 0, "e": "38 = 2 + 9d, so d = 4."}, {"q": "Find the sum to infinity of 4 + 2 + 1 + ... (r = 1/2).", "o": ["8", "6", "4", "12"], "a": 0, "e": "Sum = a / (1 − r) = 4 / 0.5 = 8."}, {"q": "A geometric sequence has first term 3 and ratio 2. Find the 5th term.", "o": ["48", "24", "96", "16"], "a": 0, "e": "3 × 2⁴ = 48."}, {"q": "Find the sum of the first 6 terms of 1, 3, 9, 27, ... (ratio 3).", "o": ["364", "243", "728", "121"], "a": 0, "e": "Sum = 1 × (3⁶ − 1) / (3 − 1) = 364."}, {"q": "Find the sum of the first 10 terms of the arithmetic sequence with first term 1 and common difference 2.", "o": ["100", "90", "110", "55"], "a": 0, "e": "Sₙ = n/2 (2a + (n−1)d) = 5(2 + 18) = 100."}, {"q": "A geometric sequence has first term 5 and ratio 3. Find the sum of the first 4 terms.", "o": ["200", "180", "120", "240"], "a": 0, "e": "Sₙ = a(rⁿ − 1)/(r − 1) = 5(81 − 1)/2 = 200."}, {"q": "Find the sum to infinity of 9 + 3 + 1 + ... (r = 1/3).", "o": ["13.5", "12", "9", "18"], "a": 0, "e": "Sum = a/(1 − r) = 9/(2/3) = 13.5."}, {"q": "An arithmetic series has first term 4, last term 40, and 10 terms. Find the sum.", "o": ["220", "200", "440", "110"], "a": 0, "e": "Sₙ = n/2 (a + l) = 5 × 44 = 220."}, {"q": "For a geometric series to have a sum to infinity, |r| must be:", "o": ["Less than 1", "Greater than 1", "Equal to 1", "Any value"], "a": 0, "e": "The series only converges when |r| < 1."}, {"q": "Find the sum of the first 8 terms of the arithmetic sequence with first term 2 and common difference 3.", "o": ["100", "92", "108", "84"], "a": 0, "e": "Sₙ = n/2 (2a + (n−1)d) = 4(4 + 21) = 100."}, {"q": "A geometric sequence has first term 2 and ratio 5. Find the sum of the first 3 terms.", "o": ["62", "60", "50", "72"], "a": 0, "e": "2(1 + 5 + 25) = 62."}, {"q": "Find the sum to infinity of 16 + 8 + 4 + ... (r = 1/2).", "o": ["32", "24", "16", "48"], "a": 0, "e": "Sum = a/(1 − r) = 16/0.5 = 32."}, {"q": "An arithmetic series has first term 5, last term 50, and 10 terms. Find the sum.", "o": ["275", "250", "550", "137.5"], "a": 0, "e": "Sₙ = n/2 (a + l) = 5 × 55 = 275."}, {"q": "A geometric series has first term 3 and common ratio 1/3. Find the sum to infinity.", "o": ["4.5", "3", "9", "1.5"], "a": 0, "e": "Sum = 3/(1 − 1/3) = 4.5."}], "Matrices and vectors (university)": [{"q": "Find the determinant of the matrix with rows (1, 2) and (0, 3).", "o": ["3", "6", "−3", "1"], "a": 0, "e": "ad − bc = 1 × 3 − 2 × 0 = 3."}, {"q": "Find the inverse of the matrix with rows (2, 0) and (0, 4).", "o": ["Rows (1/2, 0) and (0, 1/4)", "Rows (4, 0) and (0, 2)", "Rows (1/2, 0) and (0, 4)", "Rows (2, 0) and (0, 1/4)"], "a": 0, "e": "For a diagonal matrix, invert each diagonal entry."}, {"q": "Find the determinant of the matrix with rows (3, 1) and (2, 4).", "o": ["10", "14", "12", "8"], "a": 0, "e": "ad − bc = 3 × 4 − 1 × 2 = 10."}, {"q": "Find the inverse of the matrix with rows (1, 0) and (0, 5).", "o": ["Rows (1, 0) and (0, 1/5)", "Rows (5, 0) and (0, 1)", "Rows (1, 0) and (0, 5)", "Rows (0, 1) and (1, 0)"], "a": 0, "e": "For a diagonal matrix, invert each diagonal entry."}, {"q": "Find the determinant of the matrix with rows (5, 2) and (1, 3).", "o": ["13", "17", "15", "11"], "a": 0, "e": "ad − bc = 5 × 3 − 2 × 1 = 13."}, {"q": "Find the inverse of the matrix with rows (3, 0) and (0, 2).", "o": ["Rows (1/3, 0) and (0, 1/2)", "Rows (3, 0) and (0, 2)", "Rows (2, 0) and (0, 3)", "Rows (1/2, 0) and (0, 1/3)"], "a": 0, "e": "For a diagonal matrix, invert each diagonal entry."}, {"q": "Find the determinant of the matrix with rows (4, 2) and (3, 1).", "o": ["−2", "2", "10", "−10"], "a": 0, "e": "ad − bc = 4 × 1 − 2 × 3 = −2."}, {"q": "Add the matrices with rows (1, 2)/(3, 4) and (5, 6)/(7, 8).", "o": ["Rows (6, 8) and (10, 12)", "Rows (5, 12) and (21, 32)", "Rows (6, 8) and (11, 12)", "Rows (4, 4) and (4, 4)"], "a": 0, "e": "Add corresponding entries."}, {"q": "Multiply the matrix with rows (2, 0)/(0, 2) by the matrix with rows (1, 3)/(4, 5).", "o": ["Rows (2, 6) and (8, 10)", "Rows (2, 3) and (4, 10)", "Rows (1, 3) and (4, 5)", "Rows (2, 0) and (0, 2)"], "a": 0, "e": "This diagonal matrix doubles every entry of the second matrix."}, {"q": "Find the vector a + b if a = (3, −1) and b = (−2, 5).", "o": ["(1, 4)", "(5, −6)", "(1, −4)", "(−1, 4)"], "a": 0, "e": "Add corresponding components: 3 + (−2) = 1, −1 + 5 = 4."}, {"q": "Find the magnitude of the vector (3, 4).", "o": ["5", "7", "12", "25"], "a": 0, "e": "√(3² + 4²) = √25 = 5."}, {"q": "If a = (2, 3), find −2a.", "o": ["(−4, −6)", "(4, 6)", "(−4, 6)", "(4, −6)"], "a": 0, "e": "Multiply each component by −2."}, {"q": "Find the vector AB if A = (1, 2) and B = (4, 6).", "o": ["(3, 4)", "(5, 8)", "(4, 6)", "(−3, −4)"], "a": 0, "e": "AB = B − A = (4 − 1, 6 − 2)."}, {"q": "The matrix with rows (1, 0) and (0, 1) is called the:", "o": ["Identity matrix", "Zero matrix", "Inverse matrix", "Transpose matrix"], "a": 0, "e": "This matrix leaves any matrix unchanged when multiplied."}], "Calculus: differentiation and integration (university)": [{"q": "∫ from 0 to 1 of 3x² dx = ?", "o": ["1", "3", "1/3", "0"], "a": 0, "e": "[x³] from 0 to 1 = 1."}, {"q": "lim as x → 0 of (sin x) / x = ?", "o": ["0", "1", "∞", "Undefined"], "a": 1, "e": "A standard limit."}, {"q": "d/dx of e^(2x) = ?", "o": ["e^(2x)", "2e^(2x)", "2x e^(2x)", "eˣ"], "a": 1, "e": "Chain rule: the derivative of 2x is 2."}, {"q": "lim as x → ∞ of 1/x = ?", "o": ["∞", "1", "0", "Undefined"], "a": 2, "e": "As x grows very large, 1/x approaches 0."}, {"q": "lim as x → 0 of (x²)/x = ?", "o": ["0", "1", "Undefined", "∞"], "a": 0, "e": "Simplify to x first, then let x → 0."}, {"q": "lim as x → 2 of (x² − 4)/(x − 2) = ?", "o": ["4", "2", "0", "Undefined"], "a": 0, "e": "Factorise to (x − 2)(x + 2)/(x − 2) = x + 2, then let x → 2."}, {"q": "lim as x → ∞ of (3x + 1)/x = ?", "o": ["3", "1", "0", "∞"], "a": 0, "e": "Divide every term by x: 3 + 1/x → 3 as x → ∞."}, {"q": "lim as x → 3 of (x² − 9)/(x − 3) = ?", "o": ["6", "3", "0", "Undefined"], "a": 0, "e": "Factorise to (x − 3)(x + 3)/(x − 3) = x + 3, then let x → 3."}, {"q": "lim as x → 0 of (2x)/x = ?", "o": ["2", "0", "1", "Undefined"], "a": 0, "e": "Simplify first: 2x/x = 2 for x ≠ 0."}, {"q": "lim as x → ∞ of (5x²)/(x² + 1) = ?", "o": ["5", "0", "1", "∞"], "a": 0, "e": "Divide every term by x²: 5/(1 + 1/x²) → 5 as x → ∞."}, {"q": "lim as x → 4 of (x² − 16)/(x − 4) = ?", "o": ["8", "4", "0", "Undefined"], "a": 0, "e": "Factorise to (x − 4)(x + 4)/(x − 4) = x + 4, then let x → 4."}, {"q": "lim as x → 0 of (5x)/x = ?", "o": ["5", "0", "1", "Undefined"], "a": 0, "e": "Simplify first: 5x/x = 5 for x ≠ 0."}, {"q": "lim as x → ∞ of (2x² + 1)/x² = ?", "o": ["2", "1", "0", "∞"], "a": 0, "e": "Divide every term by x²: 2 + 1/x² → 2 as x → ∞."}]}}}, {"id": "geo", "name": "Geometry", "lv": {"2": {"2D shapes and their properties": [{"q": "How many sides has a triangle?", "o": ["2", "3", "4", "5"], "a": 1, "e": "Tri means three."}, {"q": "How many corners has a rectangle?", "o": ["2", "3", "4", "6"], "a": 2, "e": "A rectangle has 4 corners."}, {"q": "Which shape has 4 equal sides and 4 right angles?", "o": ["Rectangle", "Triangle", "Square", "Circle"], "a": 2, "e": "A square has equal sides and right angles."}]}, "5": {"Angles (lines, triangles, polygons)": [{"q": "Angles on a straight line add up to:", "o": ["90°", "180°", "270°", "360°"], "a": 1, "e": "A straight line is 180°."}], "Perimeter and area": [{"q": "Area of a rectangle 6 cm by 4 cm?", "o": ["10 cm²", "20 cm²", "24 cm²", "48 cm²"], "a": 2, "e": "6 × 4 = 24 cm²."}, {"q": "Perimeter of a square with side 5 cm?", "o": ["10 cm", "20 cm", "25 cm", "15 cm"], "a": 1, "e": "4 × 5 = 20 cm."}]}, "6": {"2D shapes and their properties": [{"q": "What is the mathematical name for an angle less than 90°?", "o": ["Obtuse", "Reflex", "Right", "Acute"], "a": 3, "e": "Acute angles are less than 90°."}, {"q": "What is the name of a polygon with 5 sides?", "o": ["Hexagon", "Pentagon", "Octagon", "Heptagon"], "a": 1, "e": "Penta means five."}]}, "7": {"2D shapes and their properties": [{"q": "What is the name of a quadrilateral with exactly one pair of parallel sides?", "o": ["Parallelogram", "Kite", "Trapezium", "Rhombus"], "a": 2, "e": "A trapezium has exactly one pair of parallel sides."}], "Angles (lines, triangles, polygons)": [{"q": "Five equal angles a° meet at a point. Find a.", "o": ["36", "72", "60", "90"], "a": 1, "e": "Angles around a point add to 360°, so a = 360 ÷ 5 = 72."}]}, "8": {"Angles (lines, triangles, polygons)": [{"q": "An isosceles triangle has two equal base angles of 34°. Find the angle x at the top.", "o": ["34°", "146°", "68°", "112°"], "a": 3, "e": "180 − 34 − 34 = 112."}, {"q": "Two parallel lines are cut by a transversal. Two co-interior (allied) angles are shown and one is 132°. Find the other.", "o": ["48°", "132°", "42°", "58°"], "a": 0, "e": "Co-interior angles add to 180°: 180 − 132 = 48."}, {"q": "Two parallel lines are cut by a transversal. Angles in the same position at each crossing are equal. What are they called?", "o": ["Alternate", "Co-interior", "Corresponding", "Vertically opposite"], "a": 2, "e": "Angles in matching positions are corresponding angles."}, {"q": "Three angles meet at a point: 100°, y° and y°. Find y.", "o": ["80", "130", "100", "260"], "a": 1, "e": "360 − 100 = 260, then 260 ÷ 2 = 130."}, {"q": "Two angles of a triangle are 50° and 60°. Find the third.", "o": ["60°", "70°", "80°", "110°"], "a": 1, "e": "180 − 110 = 70°."}], "Surface area and volume": [{"q": "Volume of a cuboid 2 cm by 3 cm by 4 cm?", "o": ["9 cm³", "24 cm³", "12 cm³", "48 cm³"], "a": 1, "e": "2 × 3 × 4 = 24."}], "Circles (circle theorems, arcs, sectors)": [{"q": "Area of a circle with radius 3 cm (leave π)?", "o": ["6π cm²", "9π cm²", "3π cm²", "18π cm²"], "a": 1, "e": "πr² = π × 9 = 9π."}]}, "9": {"Angles (lines, triangles, polygons)": [{"q": "PQRS is a quadrilateral with angles 73° at R, 129° at Q and 75° at P. RS is extended to T. Find angle PST.", "o": ["83°", "97°", "107°", "103°"], "a": 1, "e": "Angles in a quadrilateral sum to 360°, so angle S = 83°. Then PST = 180° − 83° = 97°."}, {"q": "A triangle has angles 119°, 31° and d°. Find d and name the type of triangle.", "o": ["d = 30, isosceles", "d = 30, scalene", "d = 40, scalene", "d = 150, scalene"], "a": 1, "e": "d = 180 − 119 − 31 = 30. All three angles differ, so it is scalene."}, {"q": "Triangle ABC is isosceles with AB = AC and angle ABC = 32°. Find angle BAC.", "o": ["116°", "32°", "64°", "148°"], "a": 0, "e": "Angle ACB = 32°, so BAC = 180 − 64 = 116°."}, {"q": "In triangle ABC, AB = AC and angle BAC = 38°. BCD is a straight line. Find angle ACD.", "o": ["71°", "142°", "38°", "109°"], "a": 3, "e": "ACB = (180 − 38) ÷ 2 = 71°, so ACD = 180 − 71 = 109°."}, {"q": "In triangle ABC, AB = BC and ABD is a straight line. Angle CBD = 50°. Find angle ACB.", "o": ["50°", "65°", "25°", "130°"], "a": 2, "e": "Angle ABC = 130°, and the two base angles share the remaining 50°, so each is 25°."}, {"q": "PQ is a straight line. An angle of 126° lies on the line next to angle x inside the triangle. Find x.", "o": ["126°", "64°", "36°", "54°"], "a": 3, "e": "Angles on a straight line: 180 − 126."}, {"q": "A quadrilateral has angles 120°, 140°, 58° and a. Find a.", "o": ["42°", "62°", "38°", "52°"], "a": 0, "e": "Angles sum to 360°."}, {"q": "In triangle ABC, angle A = 50° and angle B = 60°. ACD is a straight line. Find the exterior angle at C.", "o": ["70°", "120°", "130°", "110°"], "a": 3, "e": "Exterior angle = sum of the two opposite interior angles."}, {"q": "PQR is isosceles with PQ = PR and angle R = 23°. Find angle P.", "o": ["23°", "157°", "67°", "134°"], "a": 3, "e": "Q = 23°, so P = 180 − 46."}, {"q": "In triangle ABC, the exterior angle at A is 50° (vertically opposite angle A) and angle C = 70°. Find angle B.", "o": ["60°", "50°", "70°", "40°"], "a": 0, "e": "A = 50°, so B = 180 − 120."}, {"q": "PQR is a straight line, SQ = SR and angle R = 50°. Find the angle between QP and QS.", "o": ["50°", "80°", "100°", "130°"], "a": 3, "e": "Angle SQR = 50°, so 180 − 50."}, {"q": "A triangle has interior angles 43° and 108°. Find the exterior angle next to the 43° angle.", "o": ["29°", "43°", "151°", "137°"], "a": 3, "e": "180 − 43."}, {"q": "Triangle ABC has AC = BC. Exterior angle ACD = 62°, BCD a straight line. Find angle x at B.", "o": ["31°", "62°", "59°", "124°"], "a": 0, "e": "Base angles are equal and share the exterior angle: 62 ÷ 2."}, {"q": "A quadrilateral has angles 119°, 105°, 78° and a fourth angle. The exterior angle at the fourth corner is x. Find x.", "o": ["58°", "78°", "122°", "102°"], "a": 2, "e": "Fourth angle = 360 − 302 = 58°, so x = 180 − 58."}, {"q": "ABD is isosceles with AD = BD. ABC is a straight line and angle ABD = 70°. Find angle ADB.", "o": ["70°", "40°", "110°", "20°"], "a": 1, "e": "Angle A = 70°, so D = 180 − 140."}, {"q": "A triangle has interior angles 65° and an exterior angle of 138° at the base. Find the reflex angle a at the top vertex.", "o": ["287°", "73°", "253°", "223°"], "a": 0, "e": "Top angle = 138 − 65 = 73°, and a = 360 − 73."}, {"q": "In a diagram, angles of 83° and 97° lie between the line DE and the lines DC and EF on the same side of DE. Are CD and EF parallel?", "o": ["Yes, they sum to 180°", "No, they are not equal", "Yes, they are equal", "No, they sum to 180°"], "a": 0, "e": "Co-interior angles sum to 180° when lines are parallel."}, {"q": "AB and CD are parallel. Alternate angles are 7x − 40 and 5x + 10. Find x.", "o": ["15", "30", "50", "25"], "a": 3, "e": "7x − 40 = 5x + 10, so 2x = 50."}, {"q": "Two parallel lines are cut by a transversal. One angle is 72°. What is the corresponding angle?", "o": ["108°", "18°", "72°", "144°"], "a": 2, "e": "Corresponding angles are equal."}]}, "10": {"Angles (lines, triangles, polygons)": [{"q": "Find the size of one interior angle of a regular 15-sided polygon.", "o": ["24°", "162°", "146°", "156°"], "a": 3, "e": "Exterior angle = 360 ÷ 15 = 24°, so interior = 180 − 24 = 156°."}, {"q": "One angle of a parallelogram is 64°. What are the other three angles?", "o": ["116°, 116°, 116°", "64°, 64°, 116°", "64°, 116°, 116°", "26°, 116°, 154°"], "a": 2, "e": "Opposite angles are equal, and angles on the same side add to 180°."}, {"q": "A quadrilateral has angles 4x°, (3x + 75)°, (87 − x)° and 90°. Find x.", "o": ["12", "18", "27", "36"], "a": 1, "e": "Sum = 360: 6x + 252 = 360, so 6x = 108 and x = 18."}, {"q": "In a trapezium, the two angles on the same slanted side between parallel sides are (97 − 3x)° and (69 + 5x)°. Find x.", "o": ["9", "7", "83", "14"], "a": 1, "e": "Co-interior angles add to 180°: 166 + 2x = 180, so x = 7."}, {"q": "Triangle ABC has angle A = 58° and angle B = 82°. It is reflected in BC. Find angle ACD where D is the image of A.", "o": ["40°", "80°", "100°", "160°"], "a": 1, "e": "Angle C = 40°. The reflection doubles it: 2 × 40° = 80°."}, {"q": "Sum of the interior angles of a hexagon?", "o": ["540°", "720°", "900°", "360°"], "a": 1, "e": "(6 − 2) × 180° = 720°."}], "Perimeter and area": [{"q": "The diagonal of a rectangle is 15 cm and its perimeter is 38 cm. Find its area.", "o": ["76 cm²", "136 cm²", "68 cm²", "60 cm²"], "a": 2, "e": "a + b = 19 and a² + b² = 225. (a + b)² = 361, so 2ab = 136 and ab = 68."}], "Circles (circle theorems, arcs, sectors)": [{"q": "Circumference of a circle of radius 7 cm (π = 22/7)?", "o": ["44 cm", "22 cm", "154 cm", "14 cm"], "a": 0, "e": "2 × 22/7 × 7 = 44."}], "Pythagoras' theorem": [{"q": "A right-angled triangle has legs 6 cm and 8 cm. Find the hypotenuse.", "o": ["10 cm", "14 cm", "12 cm", "100 cm"], "a": 0, "e": "36 + 64 = 100, and √100 = 10."}, {"q": "One leg of a right-angled triangle is ¾ of the other leg. The perimeter is 24 cm. Find the hypotenuse.", "o": ["8 cm", "12 cm", "10 cm", "6 cm"], "a": 2, "e": "Sides are 3k, 4k, 5k. Perimeter 12k = 24, so k = 2 and the hypotenuse is 10."}]}, "11": {"Congruence and similarity": [{"q": "In triangle ABC, D lies on AC with angle BDC = angle ABC. AC = 10 cm, BC = 8 cm and BD = 6 cm. Triangles BDC and ABC are similar. Find AB.", "o": ["4.8 cm", "7.5 cm", "6 cm", "10.5 cm"], "a": 1, "e": "BC/AC = BD/AB, so 8/10 = 6/AB and AB = 7.5."}, {"q": "Three similar shapes have heights in the ratio small : medium : large = 1 : 5 : 8. The medium is shaded, the small is a hole in it, and the large is the outer shape. Find shaded area : unshaded area.", "o": ["24 : 39", "1 : 1", "5 : 8", "3 : 5"], "a": 3, "e": "Areas 1 : 25 : 64. Shaded = 24, unshaded = 39 + 1 = 40, so 24 : 40 = 3 : 5."}], "Coordinate geometry": [{"q": "Find the gradient of y = 4x − 5.", "o": ["4", "−5", "5", "−4"], "a": 0, "e": "In y = mx + c the gradient is m = 4."}, {"q": "Find the midpoint of (2, 4) and (6, 8).", "o": ["(4, 6)", "(8, 12)", "(2, 4)", "(3, 5)"], "a": 0, "e": "Average the x's and y's: ((2+6)/2, (4+8)/2) = (4, 6)."}, {"q": "A line has gradient 3 and passes through (0, 2). Find its equation.", "o": ["y = 3x + 2", "y = 2x + 3", "y = 3x − 2", "y = x + 3"], "a": 0, "e": "y = mx + c with m = 3, c = 2."}, {"q": "Find the distance between (1, 1) and (4, 5).", "o": ["5", "7", "25", "4"], "a": 0, "e": "√((4−1)² + (5−1)²) = √(9 + 16) = 5."}, {"q": "Find the equation of a line parallel to y = 2x + 3 passing through (0, −1).", "o": ["y = 2x − 1", "y = 2x + 1", "y = −2x − 1", "y = 2x + 3"], "a": 0, "e": "Parallel lines share the same gradient, 2."}, {"q": "Two lines are perpendicular if the product of their gradients is:", "o": ["−1", "1", "0", "Undefined"], "a": 0, "e": "This is the perpendicular gradient rule."}, {"q": "Find the gradient of the line joining (2, 3) and (2, 8).", "o": ["Undefined", "0", "1", "5"], "a": 0, "e": "Both points share x = 2, so the line is vertical."}, {"q": "A line has equation 2y = 4x + 6. Find its gradient.", "o": ["2", "4", "6", "3"], "a": 0, "e": "Divide by 2: y = 2x + 3, so the gradient is 2."}, {"q": "Find the midpoint of (−2, 3) and (6, −1).", "o": ["(2, 1)", "(4, 1)", "(2, 2)", "(4, 2)"], "a": 0, "e": "Average the x's and y's: ((−2+6)/2, (3−1)/2) = (2, 1)."}, {"q": "Find the gradient of the line joining (0, 0) and (5, 10).", "o": ["2", "0.5", "5", "10"], "a": 0, "e": "10 ÷ 5 = 2."}, {"q": "A line passes through (1, 4) with gradient −2. Find its equation.", "o": ["y = −2x + 6", "y = −2x + 2", "y = 2x + 6", "y = −2x − 6"], "a": 0, "e": "y − 4 = −2(x − 1), so y = −2x + 6."}, {"q": "Find the length of the line from (0, 0) to (6, 8).", "o": ["10", "14", "48", "100"], "a": 0, "e": "√(36 + 64) = √100 = 10."}, {"q": "Which line is perpendicular to y = (1/3)x + 2?", "o": ["y = −3x + 1", "y = (1/3)x + 5", "y = 3x + 1", "y = −(1/3)x + 1"], "a": 0, "e": "Perpendicular gradients multiply to −1: (1/3) × −3 = −1."}, {"q": "Find the midpoint of (0, 0) and (10, 6).", "o": ["(5, 3)", "(10, 6)", "(5, 6)", "(10, 3)"], "a": 0, "e": "Average the coordinates: (5, 3)."}, {"q": "Find the gradient of the line joining (3, 2) and (7, 10).", "o": ["2", "4", "8", "0.5"], "a": 0, "e": "(10 − 2) ÷ (7 − 3) = 2."}, {"q": "A line passes through (2, −1) with gradient 4. Find its equation.", "o": ["y = 4x − 9", "y = 4x − 7", "y = 4x + 9", "y = −4x − 9"], "a": 0, "e": "y − (−1) = 4(x − 2), so y = 4x − 9."}, {"q": "Find the length of the line from (2, 3) to (7, 15).", "o": ["13", "17", "60", "25"], "a": 0, "e": "√(5² + 12²) = √169 = 13."}, {"q": "Which line is parallel to y = 5x − 2?", "o": ["y = 5x + 3", "y = −5x + 3", "y = (1/5)x − 2", "y = 5 − x"], "a": 0, "e": "Parallel lines share the same gradient, 5."}, {"q": "A is (3, 2) and B is (−1, 10). Find the midpoint of AB.", "o": ["(2, 8)", "(4, 12)", "(1, 6)", "(1, 4)"], "a": 2, "e": "Average the coordinates: (3 + −1)/2 = 1 and (2 + 10)/2 = 6."}, {"q": "A is (3, 2) and B is (−1, 10). Find the equation of the perpendicular bisector of AB.", "o": ["2y = x + 11", "y = −2x + 8", "y = 2x + 4", "2y = x + 12"], "a": 0, "e": "Gradient of AB = −2, so the perpendicular gradient is ½. It passes through (1, 6): y − 6 = ½(x − 1), giving 2y = x + 11."}]}, "12": {"2D shapes and their properties": [{"q": "Distance between (0, 0) and (3, 4)?", "o": ["7", "5", "25", "1"], "a": 1, "e": "√(9 + 16) = 5."}, {"q": "Gradient of the line through (1, 2) and (3, 8)?", "o": ["2", "3", "6", "4"], "a": 1, "e": "(8 − 2) ÷ (3 − 1) = 3."}], "Circles (circle theorems, arcs, sectors)": [{"q": "Equation of a circle with centre the origin and radius 5?", "o": ["x² + y² = 5", "x² + y² = 25", "x + y = 25", "x² − y² = 25"], "a": 1, "e": "x² + y² = r² = 25."}]}, "13": {"Vectors": [{"q": "l₁ passes through (5, 1, 6) and (2, 2, 1). Which is a vector equation of l₁?", "o": ["r = (5, 1, 6) + λ(3, −1, 5)", "r = (5, 1, 6) + λ(7, 3, 7)", "r = (2, 2, 1) + λ(3, 1, 5)", "r = (5, 1, 6) + λ(−3, 1, 5)"], "a": 0, "e": "Direction = (5, 1, 6) − (2, 2, 1) = (3, −1, 5)."}, {"q": "A = (3, 2, 9) and B = (−5, 11, 6). Find AB.", "o": ["(−8, 9, −3)", "(8, −9, 3)", "(−2, 13, 15)", "(−8, 9, 3)"], "a": 0, "e": "AB = b − a."}, {"q": "AB = (−8, 9, −3) and AC = (1, −2, −17). Find AB · AC.", "o": ["−25", "−8", "−79", "25"], "a": 3, "e": "−8 − 18 + 51 = 25."}, {"q": "A = (2, 5, 9) and B = (6, 0, 10). Find the direction vector AB.", "o": ["(8, 5, 19)", "(−4, 5, −1)", "(4, −5, 1)", "(4, 5, 1)"], "a": 2, "e": "b − a."}, {"q": "Show l₁ with direction (4, −5, 1) is perpendicular to l₂ with direction (2, 1, −3). What is their dot product?", "o": ["10", "−1", "0", "16"], "a": 2, "e": "8 − 5 − 3 = 0."}, {"q": "A = (1, 7, 5) and B = (5, 1, −5). Find the position vector of the midpoint of AB.", "o": ["(6, 8, 0)", "(2, −3, −5)", "(3, 4, 0)", "(4, −6, −10)"], "a": 2, "e": "Average the coordinates."}, {"q": "M and N are midpoints of OA and OB, with OM = a and ON = b. Express MN in terms of a and b.", "o": ["a − b", "b − a", "a + b", "2b − 2a"], "a": 1, "e": "MN = ON − OM. Since AB = 2b − 2a, MN is parallel to AB and half its length."}]}}}, {"id": "trig", "name": "Trigonometry", "lv": {"9": {"Pythagoras' theorem": [{"q": "In a right triangle, legs are 3 and 4. Find the hypotenuse.", "o": ["5", "6", "7", "12"], "a": 0, "e": "3² + 4² = 25, so the hypotenuse is √25 = 5."}, {"q": "A right triangle has hypotenuse 13 and one leg 5. Find the other leg.", "o": ["8", "9", "12", "18"], "a": 2, "e": "13² − 5² = 144, so the other leg is √144 = 12."}, {"q": "A right triangle has legs 6 and 8. Find the hypotenuse.", "o": ["10", "12", "14", "48"], "a": 0, "e": "6² + 8² = 100, so the hypotenuse is 10."}, {"q": "Pythagoras' theorem states that for a right triangle with legs a, b and hypotenuse c:", "o": ["a² + b² = c²", "a + b = c", "a² − b² = c²", "ab = c²"], "a": 0, "e": "The sum of the squares of the two legs equals the square of the hypotenuse."}, {"q": "A square has a diagonal of 10 cm. Using Pythagoras, find the side length to the nearest whole number (√50 ≈ 7.07).", "o": ["5 cm", "7 cm", "8 cm", "10 cm"], "a": 1, "e": "Each side satisfies 2s² = 100, so s = √50 ≈ 7 cm."}, {"q": "A ladder 10 m long leans against a wall, reaching 8 m up. Find the distance from the wall's base to the ladder's foot.", "o": ["4 m", "6 m", "8 m", "18 m"], "a": 1, "e": "10² − 8² = 36, so the distance is √36 = 6 m."}, {"q": "Which set of numbers forms a Pythagorean triple?", "o": ["3, 4, 5", "2, 3, 4", "5, 6, 7", "1, 2, 3"], "a": 0, "e": "3² + 4² = 5², so these satisfy Pythagoras' theorem."}, {"q": "A rectangle has length 12 cm and width 5 cm. Find the length of its diagonal.", "o": ["13 cm", "15 cm", "17 cm", "7 cm"], "a": 0, "e": "12² + 5² = 169, so the diagonal is √169 = 13 cm."}, {"q": "A right triangle has legs 9 and 12. Find the hypotenuse.", "o": ["15", "18", "21", "108"], "a": 0, "e": "9² + 12² = 225, so the hypotenuse is 15."}, {"q": "Points A(0, 0) and B(6, 8) are joined. Using Pythagoras, find the distance AB.", "o": ["10", "14", "48", "100"], "a": 0, "e": "6² + 8² = 100, so AB = √100 = 10."}, {"q": "A right triangle has legs 5 and 12. Find the hypotenuse.", "o": ["13", "17", "60", "10"], "a": 0, "e": "5² + 12² = 169, so the hypotenuse is 13."}, {"q": "A right triangle has hypotenuse 10 and one leg 6. Find the other leg.", "o": ["4", "8", "14", "16"], "a": 1, "e": "10² − 6² = 64, so the other leg is √64 = 8."}, {"q": "Is a triangle with sides 7, 24, 25 right-angled?", "o": ["Yes, 7² + 24² = 25²", "No", "Cannot tell", "Only if it's isosceles"], "a": 0, "e": "49 + 576 = 625 = 25², so it satisfies Pythagoras' theorem."}, {"q": "A right triangle has legs 8 and 15. Find the hypotenuse.", "o": ["17", "19", "23", "120"], "a": 0, "e": "8² + 15² = 289, so the hypotenuse is 17."}, {"q": "A TV screen is 24 cm wide and 18 cm tall. Find the diagonal length.", "o": ["30 cm", "32 cm", "28 cm", "42 cm"], "a": 0, "e": "24² + 18² = 900, so the diagonal is √900 = 30 cm."}]}, "10": {"Trigonometric ratios (SOH CAH TOA)": [{"q": "A right triangle has opposite side 3 and hypotenuse 5. Find sin θ.", "o": ["3/5", "5/3", "4/5", "3/4"], "a": 0, "e": "sin = opposite ÷ hypotenuse."}, {"q": "In a right-angled triangle the hypotenuse is 20 cm and it makes a 60° angle with one leg. How long is that leg?", "o": ["10 cm", "10√3 cm", "20 cm", "5 cm"], "a": 0, "e": "Leg = 20 × cos 60° = 20 × ½ = 10."}, {"q": "In a right triangle, opposite = 3 and hypotenuse = 5. Find sin θ.", "o": ["3/5", "5/3", "4/5", "3/4"], "a": 0, "e": "sin = opposite ÷ hypotenuse."}, {"q": "In a right triangle, adjacent = 4 and hypotenuse = 5. Find cos θ.", "o": ["4/5", "5/4", "3/5", "3/4"], "a": 0, "e": "cos = adjacent ÷ hypotenuse."}, {"q": "In a right triangle, opposite = 5 and adjacent = 12. Find tan θ.", "o": ["5/12", "12/5", "5/13", "12/13"], "a": 0, "e": "tan = opposite ÷ adjacent."}, {"q": "A right triangle has adjacent = 6 and hypotenuse = 10. Find the opposite side.", "o": ["6", "8", "10", "4"], "a": 1, "e": "This is a 6-8-10 triangle, so the opposite side is 8."}, {"q": "Which ratio is SOH?", "o": ["sin = opp/hyp", "cos = adj/hyp", "tan = opp/adj", "sin = adj/hyp"], "a": 0, "e": "SOH stands for Sine = Opposite over Hypotenuse."}, {"q": "In a right triangle, hyp = 13, opp = 5. Find the adjacent side.", "o": ["12", "8", "13", "18"], "a": 0, "e": "This is a 5-12-13 triangle, so the adjacent side is 12."}, {"q": "For a 3-4-5 right triangle, if sin θ = 3/5 (opposite/hypotenuse), find cos θ.", "o": ["4/5", "3/5", "1", "3/4"], "a": 0, "e": "The adjacent side is 4, so cos θ = 4/5."}, {"q": "A ladder leans against a wall making angle θ with the ground. Which ratio gives the height up the wall over the ladder's length?", "o": ["sin θ", "cos θ", "tan θ", "1/sin θ"], "a": 0, "e": "Height is the opposite side, and the ladder is the hypotenuse."}, {"q": "In a right triangle, hypotenuse = 10, adjacent = 6. Find cos θ.", "o": ["3/5", "5/3", "4/5", "3/4"], "a": 0, "e": "cos = adjacent ÷ hypotenuse = 6/10 = 3/5."}, {"q": "A right triangle has opposite = 8, hypotenuse = 17. Find sin θ.", "o": ["8/17", "17/8", "15/17", "8/15"], "a": 0, "e": "sin = opposite ÷ hypotenuse."}, {"q": "In a right triangle, if tan θ = 1, what must be true of the two legs?", "o": ["They are equal", "Opposite is double adjacent", "Adjacent is zero", "Opposite is zero"], "a": 0, "e": "tan θ = opposite ÷ adjacent, so this ratio is 1 only when the legs are equal."}, {"q": "A right triangle has adjacent = 9 and opposite = 12. Find tan θ.", "o": ["4/3", "3/4", "5/4", "4/5"], "a": 0, "e": "tan θ = 12/9, which simplifies to 4/3."}, {"q": "CAH stands for:", "o": ["cos = adj/hyp", "cos = opp/hyp", "cos = opp/adj", "cos = hyp/adj"], "a": 0, "e": "CAH stands for Cosine = Adjacent over Hypotenuse."}, {"q": "A right triangle has opposite = 8, hypotenuse = 17. Find cos θ (using the 8-15-17 triple).", "o": ["15/17", "8/17", "8/15", "17/15"], "a": 0, "e": "The adjacent side is 15, so cos θ = 15/17."}, {"q": "A right triangle has adjacent = 9, opposite = 40, hypotenuse = 41. Find tan θ.", "o": ["40/9", "9/40", "41/9", "9/41"], "a": 0, "e": "tan θ = opposite ÷ adjacent."}, {"q": "If tan θ = 1, which angle could θ be?", "o": ["45°", "30°", "60°", "90°"], "a": 0, "e": "At 45°, the opposite and adjacent sides are equal."}, {"q": "A right triangle has hypotenuse = 25, adjacent = 7. Find the opposite side (7-24-25 triple).", "o": ["24", "18", "20", "22"], "a": 0, "e": "This is a 7-24-25 triangle, so the opposite side is 24."}, {"q": "Which ratio uses only the adjacent and opposite sides?", "o": ["sin", "cos", "tan", "None"], "a": 2, "e": "tan = opposite ÷ adjacent."}, {"q": "In the right triangle shown, find sin θ.", "o": ["3/5", "4/5", "3/4", "4/3"], "a": 0, "e": "Opposite = 3, hypotenuse = 5, so sin θ = 3/5.", "svg": "<svg class=\"diagram\" viewBox=\"0 0 220 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30,110 170,110 170,30\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\"/><rect x=\"155\" y=\"95\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/><text x=\"95\" y=\"128\" font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">4</text><text x=\"188\" y=\"72\" font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">3</text><text x=\"85\" y=\"78\" font-size=\"12\" fill=\"var(--accent)\" text-anchor=\"middle\">5</text><path d=\"M50,110 A20,20 0 0,1 45,93\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"55\" y=\"95\" font-size=\"12\" fill=\"var(--accent)\">θ</text></svg>"}, {"q": "In the right triangle shown, find cos θ.", "o": ["12/13", "5/13", "12/5", "5/12"], "a": 0, "e": "Adjacent = 12, hypotenuse = 13, so cos θ = 12/13.", "svg": "<svg class=\"diagram\" viewBox=\"0 0 220 140\" xmlns=\"http://www.w3.org/2000/svg\"><polygon points=\"30,110 170,110 170,30\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"2\"/><rect x=\"155\" y=\"95\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"var(--ink)\" stroke-width=\"1.5\"/><text x=\"95\" y=\"128\" font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">12</text><text x=\"190\" y=\"72\" font-size=\"12\" fill=\"var(--ink)\" text-anchor=\"middle\">5</text><text x=\"80\" y=\"78\" font-size=\"12\" fill=\"var(--accent)\" text-anchor=\"middle\">13</text><path d=\"M50,110 A20,20 0 0,1 45,93\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"55\" y=\"95\" font-size=\"12\" fill=\"var(--accent)\">θ</text></svg>"}, {"q": "In a right-angled triangle the hypotenuse is 10 cm and the side opposite angle θ is 6 cm. Find sin θ.", "o": ["5/3", "4/5", "3/5", "3/4"], "a": 2, "e": "sin θ = opposite ÷ hypotenuse = 6/10 = 3/5."}, {"q": "Triangle ABC is right-angled at A, with AB = 8 cm and BC = 11 cm. Find the exact length of AC.", "o": ["√185 cm", "√57 cm", "3 cm", "19 cm"], "a": 1, "e": "AC² = 11² − 8² = 121 − 64 = 57, so AC = √57."}, {"q": "Triangle ABC is right-angled at A, with AB = 8 cm and BC = 11 cm. Angle ABC = x°. Write cos x as a fraction.", "o": ["11/8", "√57/11", "√57/8", "8/11"], "a": 3, "e": "cos x = adjacent ÷ hypotenuse = AB ÷ BC = 8/11."}, {"q": "In a right-angled triangle the hypotenuse is 10 cm and the side next to angle x° is 5 cm. Find x.", "o": ["30°", "60°", "45°", "50°"], "a": 1, "e": "cos x = 5/10 = 1/2, so x = 60°."}, {"q": "Triangle ABC is right-angled at A. BC = 8 cm and angle ABC = 60°. Find AB.", "o": ["4√3 cm", "4 cm", "8√3 cm", "16 cm"], "a": 1, "e": "AB = 8 cos 60° = 8 × 1/2 = 4."}, {"q": "In a right-angled triangle, the side opposite a 30° angle is 6 cm. Find the exact length of the side next to the 30° angle.", "o": ["2√3 cm", "12 cm", "6√3 cm", "3√3 cm"], "a": 2, "e": "tan 30° = 6/x, so x = 6 ÷ (1/√3) = 6√3."}, {"q": "A ladder GH leans against a vertical wall HF on level ground. GF = 1.5 m and HF = 2 m. Find the length of the ladder.", "o": ["3.5 m", "1.75 m", "0.5 m", "2.5 m"], "a": 3, "e": "GH² = 1.5² + 2² = 2.25 + 4 = 6.25, so GH = 2.5. (Numbers changed from 1.5 and 4 so the root is exact.)"}, {"q": "In triangle PQR, PQ = 12 cm and angle QPR = 30°. Find the shortest distance from Q to the line PR.", "o": ["6√3 cm", "12 cm", "6 cm", "3 cm"], "a": 2, "e": "The shortest distance is the perpendicular: 12 sin 30° = 6."}, {"q": "Triangles PQS and RQT are right-angled at Q, with PQR and SQT straight lines. PS = 16 cm, angle SPQ = 30°, ST = 4 cm and QR = 4 cm. Find angle QTR.", "o": ["45°", "30°", "60°", "75°"], "a": 0, "e": "SQ = 16 sin 30° = 8, so QT = 8 − 4 = 4. tan QTR = QR ÷ QT = 4/4 = 1, so QTR = 45°."}, {"q": "A right-angled triangle has sides 5 cm, 12 cm and 13 cm. Find tan of the smaller angle.", "o": ["12/5", "5/13", "5/12", "12/13"], "a": 2, "e": "The smaller angle is opposite the 5 cm side: tan = 5/12."}, {"q": "sin θ = 3/5 and θ is acute. Find tan θ.", "o": ["4/3", "4/5", "5/3", "3/4"], "a": 3, "e": "Draw a 3, 4, 5 triangle: opposite 3, adjacent 4, so tan θ = 3/4."}, {"q": "A right-angled isosceles triangle has two equal sides of 5 cm. Find the exact length of the hypotenuse.", "o": ["10 cm", "5√2 cm", "√10 cm", "25 cm"], "a": 1, "e": "Hypotenuse² = 25 + 25 = 50, so it is √50 = 5√2."}, {"q": "In triangle ABC, angle CAB = 45° and AC = 8√2 cm. Find the shortest distance from C to AB.", "o": ["8√2 cm", "4√2 cm", "16 cm", "8 cm"], "a": 3, "e": "Shortest distance = AC sin 45° = 8√2 × √2/2 = 8."}], "Special angles (30°, 45°, 60°)": [{"q": "sin 30° = ?", "o": ["1/2", "√3/2", "1", "1/√2"], "a": 0, "e": "A standard exact value to memorise."}, {"q": "tan 45° = ?", "o": ["0", "1", "√3", "1/2"], "a": 1, "e": "In a 45° right triangle both legs are equal."}, {"q": "cos 60° = ?", "o": ["1/2", "√3/2", "1", "0"], "a": 0, "e": "This is a standard exact value."}, {"q": "tan 60° = ?", "o": ["√3", "1", "1/√3", "√3/2"], "a": 0, "e": "This is a standard exact value."}, {"q": "sin 45° = ?", "o": ["1/2", "√2/2", "√3/2", "1"], "a": 1, "e": "This is a standard exact value."}, {"q": "cos 30° = ?", "o": ["1/2", "√3/2", "1", "√2/2"], "a": 1, "e": "This is a standard exact value."}, {"q": "sin 60° = ?", "o": ["1/2", "√3/2", "1", "√2/2"], "a": 1, "e": "This is a standard exact value."}, {"q": "cos 45° = ?", "o": ["1/2", "√2/2", "√3/2", "1"], "a": 1, "e": "This is a standard exact value."}, {"q": "sin 30° + cos 60° = ?", "o": ["1", "1/2", "3/2", "√3"], "a": 0, "e": "1/2 + 1/2 = 1."}, {"q": "tan 30° = ?", "o": ["1/√3", "√3", "1", "1/2"], "a": 0, "e": "This is a standard exact value."}, {"q": "cos 90° = ?", "o": ["0", "1", "−1", "undefined"], "a": 0, "e": "At 90°, cosine is 0."}, {"q": "sin 90° − cos 0° = ?", "o": ["0", "1", "2", "−1"], "a": 0, "e": "1 − 1 = 0."}, {"q": "Which angle has sin θ = cos θ?", "o": ["45°", "30°", "60°", "90°"], "a": 0, "e": "At 45°, sine and cosine are equal."}, {"q": "sin 90° − sin 0° = ?", "o": ["0", "1", "−1", "2"], "a": 1, "e": "1 − 0 = 1."}, {"q": "cos 30° × 2 = ?", "o": ["1", "√3", "2", "√3/2"], "a": 1, "e": "2 × (√3/2) = √3."}, {"q": "Write down the value of cos 90°.", "o": ["0", "1", "−1", "1/2"], "a": 0, "e": "The cosine curve crosses zero at 90°."}, {"q": "Write down the exact value of tan 60°.", "o": ["1/√3", "1", "√3", "√3/2"], "a": 2, "e": "tan 60° = sin 60° ÷ cos 60° = (√3/2) ÷ (1/2) = √3."}, {"q": "Write down the exact value of sin 60°.", "o": ["1/2", "1/√2", "√3/2", "√3"], "a": 2, "e": "Special angle: sin 60° = √3/2."}, {"q": "Write down the exact value of tan 45°.", "o": ["1", "0", "√3", "1/√3"], "a": 0, "e": "In a right-angled isosceles triangle, opposite = adjacent."}, {"q": "Write down the exact value of tan 30°.", "o": ["√3", "1/2", "√3/2", "1/√3"], "a": 3, "e": "Special angle: tan 30° = 1/√3."}, {"q": "Work out the exact value of cos 30° × tan 60°.", "o": ["√3/2", "3/2", "3", "1/2"], "a": 1, "e": "(√3/2) × √3 = 3/2."}, {"q": "Work out the exact value of sin 45° × cos 45°.", "o": ["1", "√2", "1/√2", "1/2"], "a": 3, "e": "(1/√2) × (1/√2) = 1/2."}, {"q": "Work out the exact value of sin 60° ÷ cos 60°.", "o": ["1/√3", "√3/4", "1/2", "√3"], "a": 3, "e": "(√3/2) ÷ (1/2) = √3."}, {"q": "Write down the exact value of sin 150°.", "o": ["−1/2", "√3/2", "1/2", "−√3/2"], "a": 2, "e": "sin 150° = sin (180° − 150°) = sin 30° = 1/2."}, {"q": "An equilateral triangle has side 4 cm. Find its exact height.", "o": ["4√3 cm", "2√3 cm", "2√2 cm", "2 cm"], "a": 1, "e": "Height = 4 sin 60° = 4 × √3/2 = 2√3. (Or Pythagoras: √(16 − 4).)"}], "Angles of elevation and depression": [{"q": "Brian's kite flies on 60 m of string at an angle of elevation of 30°. How high is the kite above his hand?", "o": ["30√3 m", "60 m", "120 m", "30 m"], "a": 3, "e": "Height = 60 × sin 30° = 60 × ½ = 30."}, {"q": "From a plane 1200 m above the ground, the angle of depression of a building is 30°. Find the straight-line distance from the plane to the building.", "o": ["600 m", "2400 m", "1200√3 m", "1200 m"], "a": 1, "e": "sin 30° = 1200 ÷ d, so d = 1200 ÷ ½ = 2400."}, {"q": "From a point 12 m from the base of a flagpole, the angle of elevation of the top is 60°. How tall is the flagpole?", "o": ["4√3 m", "6 m", "24 m", "12√3 m"], "a": 3, "e": "Height = 12 × tan 60° = 12√3."}, {"q": "A plane is 300 m high. The angles of depression of two ships in line with it are 45° and 30°. How far apart are the ships?", "o": ["300(√3 − 1) m", "300(√3 + 1) m", "300 m", "300√3 m"], "a": 0, "e": "Distances: 300 ÷ tan 45° = 300 and 300 ÷ tan 30° = 300√3. The difference is 300(√3 − 1)."}, {"q": "A kite is on 100 ft of string at 30° elevation. How high is it and how far is the person from the spot below it?", "o": ["50 ft high, 50√3 ft away", "50√3 ft high, 50 ft away", "50 ft high, 50 ft away", "100 ft high, 50 ft away"], "a": 0, "e": "Height = 100 sin 30° = 50. Distance = 100 cos 30° = 50√3."}, {"q": "From the top of a 40 m cliff, the angle of depression of an object at sea level is 30°. How far is it from the base of the cliff?", "o": ["40√3 m", "20√3 m", "(40√3)/3 m", "80 m"], "a": 0, "e": "Distance = 40 ÷ tan 30° = 40√3."}, {"q": "A plane takes off 50√3 m from a building 50 m tall. What constant angle of elevation just clears the top?", "o": ["45°", "30°", "60°", "15°"], "a": 1, "e": "tan θ = 50 ÷ 50√3 = 1/√3, so θ = 30°."}, {"q": "A 10 m ladder reaches the top of a 5 m wall. What angle does the ladder make with the ground?", "o": ["45°", "60°", "30°", "15°"], "a": 2, "e": "sin θ = 5 ÷ 10 = ½, so θ = 30°."}, {"q": "A tree casts an angle of elevation of 60° from a point 10 m away. Using tan 60° = √3, find the tree's height.", "o": ["10√3 m", "10/√3 m", "20 m", "10 m"], "a": 0, "e": "Height = 10 × tan 60° = 10√3 m."}, {"q": "From the top of a 30 m cliff, a boat is seen with angle of depression 30°. Find the horizontal distance to the boat (tan 30° ≈ 0.577).", "o": ["17.3 m", "30 m", "52 m", "15 m"], "a": 2, "e": "Distance = height ÷ tan 30° = 30 ÷ 0.577 ≈ 52 m."}, {"q": "An observer 50 m from a tower sees its top at an angle of elevation of 45°. Find the tower's height.", "o": ["25 m", "50 m", "70.7 m", "100 m"], "a": 1, "e": "At 45°, tan 45° = 1, so the height equals the distance."}, {"q": "A kite string makes a 40° angle with the ground. If the string is 20 m long, which expression gives the kite's height?", "o": ["20 sin 40°", "20 cos 40°", "20 tan 40°", "20/sin 40°"], "a": 0, "e": "The string is the hypotenuse, and the height is opposite the angle."}, {"q": "The angle of depression from a lighthouse to a boat equals the angle of ___ from the boat to the lighthouse.", "o": ["elevation", "depression", "reflection", "inclination"], "a": 0, "e": "These are alternate angles between parallel horizontal lines."}, {"q": "A ramp rises 2 m over a horizontal distance of 10 m. Find the angle of elevation to the nearest degree, given tan⁻¹(0.2) ≈ 11°.", "o": ["9°", "11°", "20°", "Cannot find"], "a": 1, "e": "tan θ = 2/10 = 0.2, so θ ≈ 11°."}, {"q": "A plane is flying at a height of 2000 m. The angle of depression to an airport is 20°. Which ratio gives the horizontal distance?", "o": ["2000/tan 20°", "2000 × tan 20°", "2000 × sin 20°", "2000/sin 20°"], "a": 0, "e": "The height is opposite the angle, and distance is adjacent: tan 20° = 2000/distance."}, {"q": "A tower casts an angle of elevation of 50° from 15 m away. Which expression gives its height?", "o": ["15 tan 50°", "15 sin 50°", "15 cos 50°", "15/tan 50°"], "a": 0, "e": "Height is opposite the angle; 15 m is adjacent, so tan 50° = height/15."}, {"q": "If the angle of elevation increases, and the distance from the object stays the same, the height of the object:", "o": ["Increases", "Decreases", "Stays the same", "Cannot be determined"], "a": 0, "e": "A larger angle with the same base distance means a taller opposite side."}, {"q": "A person stands 40 m from a building and the angle of elevation to the top is 35°. Which ratio is used to find the height?", "o": ["tan 35° = height/40", "sin 35° = height/40", "cos 35° = height/40", "height = 40/35"], "a": 0, "e": "Height is opposite the angle, 40 m is adjacent."}, {"q": "From a boat, the angle of elevation to a lighthouse 50 m tall is 25°. Which expression gives the distance from the boat to the lighthouse base?", "o": ["50/tan 25°", "50 × tan 25°", "50 × sin 25°", "50 × cos 25°"], "a": 0, "e": "tan 25° = 50/distance, so distance = 50/tan 25°."}, {"q": "An observer stands 40 m from the base of a tower and sees the top at an angle of elevation of 35°. Which calculation finds the tower's height?", "o": ["40 × tan 35°", "40 × sin 35°", "40 ÷ tan 35°", "40 × cos 35°"], "a": 0, "e": "Height = distance × tan(angle of elevation).", "svg": "<svg class=\"diagram\" viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"20\" y1=\"130\" x2=\"220\" y2=\"130\" stroke=\"var(--mute)\" stroke-width=\"1.5\"/><rect x=\"170\" y=\"30\" width=\"20\" height=\"100\" fill=\"var(--river)\" stroke=\"var(--ink)\"/><line x1=\"30\" y1=\"130\" x2=\"180\" y2=\"30\" stroke=\"var(--accent)\" stroke-width=\"2\"/><path d=\"M55,130 A25,25 0 0,1 46,112\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/><text x=\"58\" y=\"118\" font-size=\"12\" fill=\"var(--accent)\">35°</text><text x=\"30\" y=\"145\" font-size=\"11\" fill=\"var(--ink)\">Observer</text><text x=\"160\" y=\"145\" font-size=\"11\" fill=\"var(--ink)\">40 m</text><text x=\"195\" y=\"85\" font-size=\"11\" fill=\"var(--ink)\">Tower</text></svg>"}, {"q": "Two vertical poles stand on level ground 10 m apart. The shorter is 2 m tall and the taller is 12 m tall. Find the angle of elevation of the top of the taller pole from the top of the shorter pole.", "o": ["30°", "45°", "60°", "50°"], "a": 1, "e": "Height difference = 10 m and distance = 10 m. tan θ = 1, so θ = 45°. (Numbers changed from 1.5, 12.6 and 33.)"}, {"q": "From a point 20 m from the foot of a tower, the angle of elevation of the top is 45°. Find the height of the tower.", "o": ["10 m", "20 m", "20√2 m", "40 m"], "a": 1, "e": "tan 45° = h/20 = 1, so h = 20."}, {"q": "From the top of a 10 m cliff, the angle of depression of a boat is 30°. Find the exact distance of the boat from the foot of the cliff.", "o": ["10√3 m", "10/√3 m", "20 m", "5 m"], "a": 0, "e": "tan 30° = 10/d, so d = 10 ÷ (1/√3) = 10√3."}, {"q": "The angle of elevation of the top of a 15 m tree from a point on the ground is 60°. Find the exact distance from the point to the foot of the tree.", "o": ["15√3 m", "5√3 m", "15 m", "7.5 m"], "a": 1, "e": "tan 60° = 15/d, so d = 15/√3 = 5√3."}, {"q": "A kite on a taut 40 m string makes an angle of 30° with level ground. How high is the kite above the ground?", "o": ["20√3 m", "20 m", "40√3 m", "40 m"], "a": 1, "e": "Height = 40 sin 30° = 20."}, {"q": "The angle of elevation of A from B is 30°. What is the angle of depression of B from A?", "o": ["30°", "60°", "150°", "90°"], "a": 0, "e": "Alternate angles are equal, so the angle of depression is also 30°."}], "Area of a triangle using trigonometry": [{"q": "In triangle STU, ST = 8 cm, SU = 9 cm and angle TSU = 30°. Find the area.", "o": ["36 cm²", "72 cm²", "9 cm²", "18 cm²"], "a": 3, "e": "Area = ½ × 8 × 9 × sin 30° = 36 × 1/2 = 18. (Angle changed from 50°.)"}, {"q": "In triangle ABC, AB = 6 cm, BC = 8 cm and angle ABC = 150°. Find the area.", "o": ["24 cm²", "12 cm²", "12√3 cm²", "6 cm²"], "a": 1, "e": "Area = ½ × 6 × 8 × sin 150° = 24 × 1/2 = 12."}, {"q": "In triangle ABC, AB = 6 cm, BC = 4 cm and angle ABC = 60°. Find the exact area.", "o": ["6√3 cm²", "12√3 cm²", "12 cm²", "6 cm²"], "a": 0, "e": "Area = ½ × 6 × 4 × sin 60° = 12 × √3/2 = 6√3."}], "Bearings and trigonometry": [{"q": "W is 100 m north of V and 100 m east of V. Find the bearing of V from W.", "o": ["045°", "135°", "225°", "315°"], "a": 2, "e": "V is south-west of W. The bearing of W from V is 045°, so add 180°: 225°. (Changed from 120 m and 50 m.)"}, {"q": "Three towns A, B and C are the same distance from each other. The bearing of C from A is 104°, and B lies to the south. Find the bearing of B from C.", "o": ["164°", "284°", "44°", "224°"], "a": 3, "e": "The bearing of A from C is 104° + 180° = 284°. Angle ACB = 60°, so the bearing of B from C is 284° − 60° = 224°."}, {"q": "C is due east of B. H lies south of line BC with angle BCH = 25°. Find the bearing of H from C.", "o": ["205°", "245°", "335°", "115°"], "a": 1, "e": "The bearing of B from C is 270°. H is a further 25° towards the south, so 270° − 25° = 245°."}, {"q": "C is due east of B, and H lies south of BC. Angle BCH = 25° and angle BHC = 55°. Find angle CBH.", "o": ["80°", "90°", "100°", "110°"], "a": 2, "e": "Angles in a triangle sum to 180°: 180 − 25 − 55 = 100."}, {"q": "The bearing of B from A is 060°. Find the bearing of A from B.", "o": ["120°", "300°", "240°", "060°"], "a": 2, "e": "Back bearing = 060° + 180° = 240°."}, {"q": "A ship sails 10 km on a bearing of 090° and then 10 km on a bearing of 180°. Find its exact distance from the start.", "o": ["10√2 km", "20 km", "10 km", "√20 km"], "a": 0, "e": "The two legs are at right angles. Distance = √(10² + 10²) = 10√2."}, {"q": "A ship sails 10 km on a bearing of 090° and then 10 km on a bearing of 180°. Find the bearing of the ship from its starting point.", "o": ["045°", "225°", "090°", "135°"], "a": 3, "e": "It ends up the same distance east and south, so it is south-east of the start: 135°."}, {"q": "A plane flies 100 km on a bearing of 030°. How far north of its start is it?", "o": ["50 km", "100√3 km", "50/√3 km", "50√3 km"], "a": 3, "e": "North distance = 100 cos 30° = 100 × √3/2 = 50√3."}]}, "11": {"Sine rule and cosine rule": [{"q": "Which rule is used to find a side when given 2 angles and a side (AAS)?", "o": ["Sine rule", "Cosine rule", "Pythagoras", "Area formula"], "a": 0, "e": "The sine rule relates sides to the sines of their opposite angles."}, {"q": "Which rule is used when given 2 sides and the included angle (SAS)?", "o": ["Sine rule", "Cosine rule", "Pythagoras", "Area formula"], "a": 1, "e": "The cosine rule is needed when there is no angle opposite a known side."}, {"q": "In triangle ABC, a/sin A = b/sin B = c/sin C is known as the:", "o": ["Sine rule", "Cosine rule", "Law of angles", "Area rule"], "a": 0, "e": "This relationship is the sine rule."}, {"q": "In triangle ABC, a = 7, A = 40°, B = 60°. Using the sine rule, find b to the nearest whole number (sin 40° ≈ 0.643, sin 60° ≈ 0.866).", "o": ["9", "10", "11", "12"], "a": 0, "e": "b = a × sin B / sin A = 7 × 0.866 / 0.643 ≈ 9."}, {"q": "The cosine rule states a² = b² + c² − 2bc cos A. If b = 5, c = 8, A = 60°, find a² (cos 60° = 0.5).", "o": ["49", "64", "129", "9"], "a": 0, "e": "25 + 64 − 2(5)(8)(0.5) = 89 − 40 = 49."}, {"q": "In triangle ABC, a = 6, b = 8, c = 10. Using the cosine rule, find cos C.", "o": ["0", "0.5", "1", "−0.5"], "a": 0, "e": "cos C = (36 + 64 − 100) ÷ (2 × 6 × 8) = 0 ÷ 96 = 0."}, {"q": "The area of a triangle using two sides and the included angle is given by:", "o": ["½ab sin C", "½ab cos C", "½(a + b) sin C", "ab sin C"], "a": 0, "e": "Area = ½ab sin C."}, {"q": "Find the area of a triangle with sides 6 cm and 10 cm and included angle 30° (sin 30° = 0.5).", "o": ["15 cm²", "30 cm²", "60 cm²", "10 cm²"], "a": 0, "e": "Area = ½ × 6 × 10 × 0.5 = 15 cm²."}, {"q": "In triangle ABC, A = 50°, B = 70°. Find angle C.", "o": ["50°", "60°", "70°", "130°"], "a": 1, "e": "Angles in a triangle sum to 180°: 180 − 120 = 60°."}, {"q": "The sine rule can also be used to find an angle when given two sides and a non-included angle. This situation is sometimes called the:", "o": ["Ambiguous case", "Right-angle case", "Cosine case", "Area case"], "a": 0, "e": "There can be two possible triangles in this situation."}, {"q": "In triangle ABC, a = 10, b = 14, C = 50°. Using the cosine rule, which expression gives c²?", "o": ["10² + 14² − 2(10)(14)cos 50°", "10² + 14² + 2(10)(14)cos 50°", "10² − 14² − 2(10)(14)cos 50°", "(10 + 14)² − cos 50°"], "a": 0, "e": "This matches the standard cosine rule c² = a² + b² − 2ab cos C."}, {"q": "In triangle PQR, p = 8, P = 35°, Q = 75°. Which rule would you use to find q?", "o": ["Sine rule", "Cosine rule", "Pythagoras", "Tangent rule"], "a": 0, "e": "Two angles and a side (AAS) call for the sine rule."}, {"q": "The cosine rule can be rearranged to find an angle: cos A = ?", "o": ["(b² + c² − a²)/(2bc)", "(a² + b² − c²)/(2ab)", "(b² + c² + a²)/(2bc)", "a²/(2bc)"], "a": 0, "e": "Rearranging a² = b² + c² − 2bc cos A gives this formula."}, {"q": "In triangle ABC, a = 5, b = 5, c = 5. What type of triangle is this, and what is angle A?", "o": ["Equilateral, 60°", "Isosceles, 45°", "Scalene, 90°", "Right-angled, 30°"], "a": 0, "e": "All sides equal means all angles equal 60°."}, {"q": "Find the area of a triangle with sides 8 cm and 5 cm and included angle 90° (sin 90° = 1).", "o": ["20 cm²", "40 cm²", "13 cm²", "9 cm²"], "a": 0, "e": "Area = ½ × 8 × 5 × 1 = 20 cm²."}, {"q": "In triangle ABC, a = 10, b = 14, C = 50°. Which rule finds c?", "o": ["Cosine rule", "Sine rule", "Pythagoras", "Area formula"], "a": 0, "e": "Two sides and the included angle call for the cosine rule."}, {"q": "In triangle ABC, A = 30°, a = 5, b = 8. Which rule finds angle B?", "o": ["Sine rule", "Cosine rule", "Pythagoras", "None"], "a": 0, "e": "A side with its opposite angle plus another side calls for the sine rule."}, {"q": "In triangle ABC, a = 9, b = 9, c = 9. Find angle A.", "o": ["60°", "90°", "45°", "30°"], "a": 0, "e": "An equilateral triangle has all angles equal to 60°."}, {"q": "Using the cosine rule, cos A = ?", "o": ["(b² + c² − a²)/(2bc)", "(a² + b² − c²)/(2ab)", "(b² + c² + a²)/(2bc)", "a²/(b² + c²)"], "a": 0, "e": "This is the cosine rule rearranged to find an angle."}, {"q": "A triangle has sides a = 5, b = 7, and angle C = 90°. Find c using the cosine rule (cos 90° = 0).", "o": ["√74", "12", "2", "√24"], "a": 0, "e": "c² = 25 + 49 − 0 = 74, so c = √74."}, {"q": "In triangle ABC, BC = 10 cm, angle A = 30° and angle B = 45°. Find AC.", "o": ["5√2 cm", "20 cm", "10√2 cm", "10√3 cm"], "a": 2, "e": "AC ÷ sin 45° = 10 ÷ sin 30°, so AC = 10 × (√2/2) ÷ (1/2) = 10√2."}, {"q": "In triangle BCD, angle DBC = 42° and angle BDC = 26°. Find angle BCD.", "o": ["68°", "112°", "78°", "102°"], "a": 1, "e": "Angles in a triangle sum to 180°: 180 − 42 − 26 = 112."}, {"q": "In triangle BCD, BD = 6√2 cm, angle BCD = 45° and angle DBC = 30°. Find CD.", "o": ["6 cm", "6√2 cm", "12 cm", "3 cm"], "a": 0, "e": "CD ÷ sin 30° = 6√2 ÷ sin 45°, so CD = 6√2 × (1/2) ÷ (√2/2) = 6."}, {"q": "In triangle ABD, AB = 8 cm, AD = 5 cm and angle DAB = 60°. Find BD.", "o": ["√89 cm", "9 cm", "√129 cm", "7 cm"], "a": 3, "e": "BD² = 8² + 5² − 2(8)(5) cos 60° = 89 − 40 = 49, so BD = 7. (Numbers changed from 10.4 and 6.5.)"}, {"q": "In triangle ABC, AB = 4 cm, AC = 6 cm and angle A = 60°. Find the exact length of BC.", "o": ["2√19 cm", "2√7 cm", "10 cm", "5 cm"], "a": 1, "e": "BC² = 16 + 36 − 2(4)(6)(1/2) = 52 − 24 = 28, so BC = √28 = 2√7."}, {"q": "A triangle has sides 3 cm, 5 cm and 7 cm. Find its largest angle.", "o": ["120°", "60°", "90°", "150°"], "a": 0, "e": "cos θ = (3² + 5² − 7²) ÷ (2 × 3 × 5) = −15/30 = −1/2, so θ = 120°."}, {"q": "In triangle ABC, BC = 4 cm, AC = 4√2 cm and angle A = 30°. Find the acute angle B.", "o": ["45°", "30°", "60°", "90°"], "a": 0, "e": "sin B ÷ 4√2 = sin 30° ÷ 4, so sin B = 4√2 × (1/2) ÷ 4 = √2/2, giving B = 45°."}, {"q": "ABCD is a kite with AD = DC = 5 cm and AB = BC. Angle BAD = 30° and angle ABD = 30°. Find the perimeter of ABCD.", "o": ["10 + 10√3 cm", "10 + 5√3 cm", "20 cm", "20 + 10√3 cm"], "a": 0, "e": "Angle ADB = 120°. AB ÷ sin 120° = 5 ÷ sin 30°, so AB = 5√3. Perimeter = 5 + 5 + 5√3 + 5√3."}, {"q": "You know two sides of a triangle and the angle between them. Which rule finds the third side?", "o": ["Sine rule", "Area rule", "Pythagoras' theorem only", "Cosine rule"], "a": 3, "e": "Two sides and the included angle gives the cosine rule: a² = b² + c² − 2bc cos A."}], "Bearings": [{"q": "A bearing is always measured:", "o": ["Clockwise from North", "Anticlockwise from North", "Clockwise from East", "From the nearest cardinal point"], "a": 0, "e": "Bearings are measured clockwise starting from North."}, {"q": "A ship sails on a bearing of 060°. In which general direction is it heading?", "o": ["North-East", "North-West", "South-East", "South-West"], "a": 0, "e": "060° is between North (000°) and East (090°)."}, {"q": "A bearing of 090° points:", "o": ["East", "North", "South", "West"], "a": 0, "e": "A quarter turn clockwise from North reaches East."}, {"q": "A bearing of 180° points:", "o": ["South", "North", "East", "West"], "a": 0, "e": "A half turn clockwise from North reaches South."}, {"q": "If a town is on a bearing of 070° from you, what bearing are you from the town?", "o": ["250°", "110°", "290°", "070°"], "a": 0, "e": "The back bearing is found by adding 180°: 70° + 180° = 250°."}, {"q": "A bearing must always be written using how many digits?", "o": ["3", "2", "1", "4"], "a": 0, "e": "Bearings use three figures, e.g. 045° or 090°."}, {"q": "A plane flies on a bearing of 045° for 100 km. Which expression gives the northward distance travelled?", "o": ["100 cos 45°", "100 sin 45°", "100 tan 45°", "100/cos 45°"], "a": 0, "e": "The northward component uses cosine of the bearing angle from North."}, {"q": "A bearing of 270° points:", "o": ["West", "East", "North", "South"], "a": 0, "e": "Three-quarters of a turn clockwise from North reaches West."}], "Special angles (30°, 45°, 60°)": [{"q": "Two right-angled triangles share a side. The first has a vertical side n opposite a 30° angle, and its hypotenuse is the shared side. In the second triangle the shared side is the side next to a 30° angle, and x is its hypotenuse. Find x in terms of n.", "o": ["2n", "4n√3", "4n/√3", "2n/√3"], "a": 2, "e": "Shared side = n ÷ sin 30° = 2n. Then x = 2n ÷ cos 30° = 2n ÷ (√3/2) = 4n/√3."}, {"q": "Triangles ABE and BCD are right-angled at B, with A, B, C in a straight line and E, D, B in a straight line. AC = 17 cm, AE = 18 cm, BD = 6 cm and angle EAB = 60°. Find CD.", "o": ["8 cm", "11 cm", "10 cm", "√145 cm"], "a": 2, "e": "AB = 18 cos 60° = 9, so BC = 17 − 9 = 8. CD = √(8² + 6²) = 10."}, {"q": "Triangles ABE and BCD are right-angled at B, with A, B, C in a straight line and E, D, B in a straight line. AC = 17 cm, AE = 18 cm, BD = 6 cm and angle EAB = 60°. Find the perimeter of ACDE.", "o": ["45 + 9√3 cm", "39 + 3√3 cm", "39 + 9√3 cm", "33 + 9√3 cm"], "a": 2, "e": "BE = 18 sin 60° = 9√3, so DE = 9√3 − 6. CD = 10. Perimeter = 17 + 10 + (9√3 − 6) + 18 = 39 + 9√3."}], "Area of a triangle using trigonometry": [{"q": "A triangle has two sides of 10 cm and 6 cm and an area of 15 cm². Find the acute angle between them.", "o": ["30°", "45°", "60°", "15°"], "a": 0, "e": "15 = ½ × 10 × 6 × sin θ = 30 sin θ, so sin θ = 1/2 and θ = 30°."}, {"q": "A triangle has sides 4√2 cm and 5 cm with an included angle of 45°. Find its area.", "o": ["20 cm²", "5√2 cm²", "10 cm²", "10√2 cm²"], "a": 2, "e": "Area = ½ × 4√2 × 5 × sin 45° = 10√2 × √2/2 = 10."}, {"q": "An equilateral triangle has sides of 4 cm. Find its exact area.", "o": ["8√3 cm²", "8 cm²", "4√3 cm²", "16 cm²"], "a": 2, "e": "Area = ½ × 4 × 4 × sin 60° = 8 × √3/2 = 4√3."}], "Trigonometric graphs": [{"q": "The graph of y = cos x for 0° ≤ x ≤ 360° has a minimum point. What are its coordinates?", "o": ["(180°, −1)", "(90°, −1)", "(180°, 0)", "(270°, −1)"], "a": 0, "e": "cos 180° = −1, the lowest value."}, {"q": "What is the maximum value of y = 3 sin x + 1?", "o": ["3", "1", "4", "2"], "a": 2, "e": "The maximum of sin x is 1, so 3(1) + 1 = 4."}, {"q": "What is the period of y = sin 2x?", "o": ["360°", "180°", "90°", "720°"], "a": 1, "e": "The graph repeats twice as fast as sin x: 360° ÷ 2 = 180°."}, {"q": "For 0° ≤ x ≤ 180°, the graph of y = tan x has a vertical asymptote at which value of x?", "o": ["0°", "180°", "45°", "90°"], "a": 3, "e": "tan x = sin x ÷ cos x is undefined where cos x = 0, which is x = 90°."}, {"q": "The graph of y = sin x crosses the x-axis at 0°, 180° and which other value up to 360°?", "o": ["90°", "270°", "360°", "540°"], "a": 2, "e": "sin x = 0 at multiples of 180°."}, {"q": "How many times does the graph of y = cos x meet the line y = 1/2 for 0° ≤ x ≤ 360°?", "o": ["1", "3", "4", "2"], "a": 3, "e": "cos x = 1/2 at x = 60° and x = 300°."}, {"q": "What is the value of y = −cos x when x = 0°?", "o": ["0", "1", "−2", "−1"], "a": 3, "e": "cos 0° = 1, so −cos 0° = −1."}, {"q": "Which graph has an amplitude of 2?", "o": ["y = sin 2x", "y = sin x + 2", "y = 2 sin x", "y = tan 2x"], "a": 2, "e": "The number in front of sin x stretches the graph vertically."}], "Trigonometric equations": [{"q": "Solve 2 sin x − 1 = 0 for 0° ≤ x ≤ 360°.", "o": ["x = 30° or 330°", "x = 60° or 120°", "x = 30° or 210°", "x = 30° or 150°"], "a": 3, "e": "sin x = 1/2, so x = 30° or 180° − 30° = 150°."}, {"q": "Solve tan x = −1/√3 for 0° ≤ x ≤ 360°.", "o": ["x = 30° or 210°", "x = 150° or 330°", "x = 120° or 300°", "x = 150° or 210°"], "a": 1, "e": "tan is negative in quadrants 2 and 4. The basic angle is 30°, so x = 180° − 30° and 360° − 30°."}, {"q": "Solve tan x + √3 = 0 for 0° ≤ x ≤ 360°.", "o": ["x = 60° or 240°", "x = 60° or 120°", "x = 120° or 300°", "x = 150° or 330°"], "a": 2, "e": "tan x = −√3. The basic angle is 60°, so x = 180° − 60° and 360° − 60°."}, {"q": "Solve 2 + 4 cos x = 0 for 0° ≤ x ≤ 360°.", "o": ["x = 60° or 300°", "x = 30° or 330°", "x = 120° or 240°", "x = 150° or 210°"], "a": 2, "e": "cos x = −1/2. The basic angle is 60°. (Changed from 2 + 5 cos x, which needed a calculator.)"}, {"q": "Solve 3 tan x + 5 = 8 for 0° ≤ x ≤ 360°.", "o": ["x = 135° or 315°", "x = 45° or 225°", "x = 45° or 135°", "x = 45° or 315°"], "a": 1, "e": "tan x = 1, so x = 45° or 45° + 180° = 225°. (Changed from 3 tan x + 5 = 1.)"}, {"q": "Solve tan x + 1 = 0 for 0° ≤ x ≤ 360°.", "o": ["x = 135° or 315°", "x = 45° or 225°", "x = 45° or 135°", "x = 135° or 225°"], "a": 0, "e": "tan x = −1. The basic angle is 45°, so x = 180° − 45° and 360° − 45°. (Changed from tan x + 2 = 0.)"}, {"q": "Solve 8 sin x + 6 = 2 for 0° ≤ x ≤ 360°.", "o": ["x = 210° or 330°", "x = 30° or 150°", "x = 120° or 240°", "x = 240° or 300°"], "a": 0, "e": "sin x = −1/2. The basic angle is 30°, so x = 180° + 30° and 360° − 30°. (Changed from 8 sin x + 6 = 1.)"}, {"q": "cos x° = 1/√2 and x is a reflex angle. Find x.", "o": ["45°", "225°", "315°", "135°"], "a": 2, "e": "Cosine is positive in quadrants 1 and 4. The reflex solution is 360° − 45° = 315°."}, {"q": "Solve 2 cos x − √3 = 0 for 0° ≤ x ≤ 360°.", "o": ["x = 30° or 330°", "x = 60° or 300°", "x = 30° or 150°", "x = 150° or 210°"], "a": 0, "e": "cos x = √3/2, so x = 30° or 360° − 30° = 330°."}, {"q": "Solve sin x = −√3/2 for 0° ≤ x ≤ 360°.", "o": ["x = 60° or 120°", "x = 210° or 330°", "x = 240° or 300°", "x = 120° or 240°"], "a": 2, "e": "The basic angle is 60°. Sine is negative in quadrants 3 and 4: 180° + 60° and 360° − 60°."}], "3D trigonometry": [{"q": "A cuboid ABCDEFGH has AE = 12 cm, EH = 3 cm and AG = 13 cm, where A is above E and G is on the base EFGH. Find EF.", "o": ["16 cm", "5 cm", "√10 cm", "4 cm"], "a": 3, "e": "AG² = AE² + EH² + EF², so 169 = 144 + 9 + EF², giving EF² = 16. (Numbers changed from 6.4, 5.1 and 13.)"}, {"q": "A cuboid has base EFGH with EF = 4 cm and EH = 3 cm, and a vertical edge AE = 12 cm. The line AG joins A to the opposite corner G of the base. Find tan of the angle between AG and the base.", "o": ["5/12", "12/13", "12/5", "5/13"], "a": 2, "e": "EG = √(4² + 3²) = 5. tan θ = AE ÷ EG = 12/5."}, {"q": "A cube has side 4 cm. Find the exact length of its space diagonal.", "o": ["4√2 cm", "12 cm", "16 cm", "4√3 cm"], "a": 3, "e": "Diagonal = √(4² + 4² + 4²) = √48 = 4√3."}, {"q": "A cube has side a. A space diagonal makes an angle θ with the base. Find tan θ exactly.", "o": ["1", "1/√2", "√2", "1/√3"], "a": 1, "e": "The base diagonal is a√2 and the height is a, ren do 5 symbols show?", "o": ["7", "25", "5", "10"], "a": 3, "e": "5 × 2 = 10."}, {"q": "A tally mark |||| represents how many?", "o": ["3", "4", "5", "6"], "a": 1, "e": "Four single strokes represent 4."}, {"q": "In a pictogram, one symbol = 5 books. How many books does 3 symbols represent?", "o": ["8", "10", "15", "20"], "a": 2, "e": "3 × 5 = 15."}, {"q": "A tally chart shows |||| |||| || for a colour. How many is this?", "o": ["10", "11", "12", "13"], "a": 2, "e": "Two full bundles of 5 plus 2 more: 5 + 5 + 2 = 12."}, {"q": "In a frequency table, what does the 'frequency' column show?", "o": ["The item name", "How many times something occurs", "The order items appear", "The total of all items"], "a": 1, "e": "Frequency counts how often each item appears."}, {"q": "A pictogram uses a half symbol to represent:", "o": ["Half the value of one symbol", "Zero", "Double the value", "An error"], "a": 0, "e": "A half symbol stands for half of what a full symbol represents."}, {"q": "Which is best for showing categories with pictures representing quantities?", "o": ["Pictogram", "Line graph", "Scatter graph", "Histogram"], "a": 0, "e": "A pictogram uses repeated pictures to show quantities."}, {"q": "A tally chart shows |||| for one category. How many is this?", "o": ["3", "4", "5", "6"], "a": 1, "e": "Four single strokes represent 4."}, {"q": "In a pictogram, one symbol = 2 cars. How many cars does 6 symbols show?", "o": ["8", "10", "12", "14"], "a": 2, "e": "6 × 2 = 12."}, {"q": "A frequency table lists how many students chose each sport. What does the total of the frequency column equal?", "o": ["The number of sports", "The total number of students", "The most popular sport", "Zero"], "a": 1, "e": "Adding every frequency gives the total number of students."}, {"q": "Which is used to record data using strokes grouped in fives?", "o": ["Tally chart", "Pie chart", "Line graph", "Scatter graph"], "a": 0, "e": "A tally chart groups strokes in fives for easy counting."}, {"q": "A tally chart uses a diagonal line through four strokes to represent:", "o": ["A group of 5", "A group of 4", "Zero", "10"], "a": 0, "e": "The diagonal stroke completes a bundle of 5."}, {"q": "If a pictogram symbol represents 4 units and a bar shows 2.5 symbols, how many units does it represent?", "o": ["10", "8", "12", "6"], "a": 0, "e": "2.5 × 4 = 10."}, {"q": "Which of these is best suited to a tally chart?", "o": ["Counting how many students prefer each fruit", "Showing change over a year", "Showing exact percentages", "Predicting future trends"], "a": 0, "e": "A tally chart is ideal for counting occurrences of categories."}, {"q": "A frequency table's row with the highest frequency shows the:", "o": ["Most common item", "Least common item", "Average item", "Total of all items"], "a": 0, "e": "The highest frequency marks the most commonly occurring item."}, {"q": "A pictogram uses one symbol = 3 pets. If a row shows 4 symbols, how many pets does this represent?", "o": ["7", "12", "15", "9"], "a": 1, "e": "4 × 3 = 12."}, {"q": "Which data collection method records data as marks grouped in fives?", "o": ["Tally marks", "Pie chart", "Line graph", "Histogram"], "a": 0, "e": "Tally marks are bundled in fives for quick counting."}, {"q": "A tally chart shows |||| |||| |||| | for red cars. How many red cars is this?", "o": ["15", "16", "14", "20"], "a": 1, "e": "Three bundles of 5 plus 1 more: 5 + 5 + 5 + 1 = 16."}, {"q": "In a frequency table for favourite colours, what does each row represent?", "o": ["A different colour and its count", "The total colours", "The order of colours", "Nothing useful"], "a": 0, "e": "Each row lists one category and how many chose it."}, {"q": "A pictogram key shows: one symbol = 2 apples. How many apples do 5 symbols represent?", "o": ["7", "10", "12", "5"], "a": 1, "e": "5 × 2 = 10."}, {"q": "A pictogram key shows one symbol = 10 students. A row has 3.5 symbols. How many students?", "o": ["30", "35", "40", "45"], "a": 1, "e": "3.5 ward section means temperature is:", "o": ["Rising quickly", "Falling quickly", "Staying the same", "Unknown"], "a": 0, "e": "A steep upward slope shows a rapid increase."}, {"q": "A pie chart sector of 270° represents what fraction of the data?", "o": ["3/4", "1/2", "1/4", "1/3"], "a": 0, "e": "270° is three-quarters of the full 360° circle."}, {"q": "Which graph type is NOT suitable for showing continuous change over time?", "o": ["Pie chart", "Line graph", "Both are suitable", "Neither is suitable"], "a": 0, "e": "A pie chart shows proportions at a single point, not change over time."}, {"q": "A bar chart compares sales across 4 shops. Which feature lets you compare them quickly?", "o": ["The height of each bar", "The color of each bar", "The order of the shops", "The chart's title"], "a": 0, "e": "Bar height directly represents the value being compared."}, {"q": "A bar chart has bars of height 10, 25, 15, 30. What is the tallest bar's value?", "o": ["10", "25", "15", "30"], "a": 3, "e": "30 is the highest value shown."}, {"q": "A pie chart is divided into 4 equal sectors. What angle does each sector have?", "o": ["90°", "45°", "180°", "60°"], "a": 0, "e": "360° ÷ 4 = 90°."}, {"q": "On a line graph, a flat (horizontal) section means the value is:", "o": ["Staying the same", "Increasing", "Decreasing", "Unknown"], "a": 0, "e": "No change in height means no change in value."}, {"q": "A pie chart sector of 120° represents what fraction of the total?", "o": ["1/3", "1/4", "1/2", "2/3"], "a": 0, "e": "120° is a third of the full 360° circle."}, {"q": "Which type of chart would best show how a school's student population changed over 5 years?", "o": ["Line graph", "Pie chart", "Pictogram", "Tally chart"], "a": 0, "e": "A line graph is ideal for tracking change over time."}, {"q": "A pie chart sector of 36° represents what fraction of the data?", "o": ["1/10", "1/4", "1/5", "1/36"], "a": 0, "e": "36° is a tenth of the full 360° circle."}, {"q": "Which axis on a bar char
