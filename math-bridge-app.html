independent, so P(both red) = P(A red) × P(B red). So P(B red) = (1/3) ÷ (2/3) = 1/2."}, {"q": "Stephan picks a sweet from bag A and Jen picks one from bag B. The probability that Stephan picks red is 2/3 and the probability that both pick red is 1/3. Find the probability that both pick yellow.", "o": ["1/6", "1/3", "1/2", "5/6"], "a": 0, "e": "P(Stephan yellow) = 1/3 and P(Jen yellow) = 1/2, so 1/3 × 1/2 = 1/6."}]}, "11": {"Permutations and combinations": [{"q": "In how many ways can the letters of CAT be arranged?", "o": ["3", "12", "9", "6"], "a": 3, "e": "3! = 6."}, {"q": "Work out 5!", "o": ["25", "20", "60", "120"], "a": 3, "e": "5 × 4 × 3 × 2 × 1 = 120."}, {"q": "Work out ⁵C₂.", "o": ["20", "25", "5", "10"], "a": 3, "e": "(5 × 4) ÷ 2 = 10."}, {"q": "Work out ⁵P₂.", "o": ["10", "7", "25", "20"], "a": 3, "e": "5 × 4 = 20."}, {"q": "How many ways can 4 people be arranged in a line?", "o": ["4", "16", "24", "256"], "a": 2, "e": "4! = 4 × 3 × 2 × 1 = 24."}, {"q": "Evaluate ⁵P₂ (permutations of 5 things taken 2 at a time).", "o": ["10", "20", "25", "120"], "a": 1, "e": "5 × 4 = 20."}, {"q": "Evaluate ⁶C₂ (combinations of 6 things taken 2 at a time).", "o": ["15", "30", "12", "36"], "a": 0, "e": "6!/(2!4!) = 15."}, {"q": "How many different 3-letter codes can be made from 5 distinct letters, no repetition?", "o": ["15", "20", "60", "125"], "a": 2, "e": "5 × 4 × 3 = 60."}, {"q": "In how many ways can a committee of 3 be chosen from 8 people?", "o": ["24", "56", "168", "336"], "a": 1, "e": "⁸C₃ = 56."}, {"q": "Evaluate 4!.", "o": ["4", "12", "24", "16"], "a": 2, "e": "4 × 3 × 2 × 1 = 24."}, {"q": "How many ways can 3 books be arranged on a shelf, chosen from a set of 5 books?", "o": ["15", "20", "60", "125"], "a": 2, "e": "⁵P₃ = 5 × 4 × 3 = 60."}, {"q": "A code uses 2 different letters chosen from the 26-letter alphabet. How many codes are possible?", "o": ["650", "676", "26", "52"], "a": 0, "e": "26 × 25 = 650, since the letters must be different."}]}}}];

try{best=JSON.parse(localStorage.getItem("mbBest3")||"{}")||{}}catch(e){best={}}
try{D=JSON.parse(localStorage.getItem("mbDaily"))||D}catch(e){}
function save(){try{localStorage.setItem("mbBest3",JSON.stringify(best))}catch(e){}}
var ME=null;
try{ME=JSON.parse(localStorage.getItem("mbUser")||"null")}catch(e){}
function saveMe(){try{localStorage.setItem("mbUser",JSON.stringify(ME))}catch(e){}}
function mergeScores(scores){
 Object.keys(scores||{}).forEach(function(k){best[k]=Math.max(best[k]||0,scores[k].best)});
 save();
}
function pullCloud(){
 if(!ME||!window.mbFire)return;
 window.mbFire.login(ME.name,ME.pin).then(function(r){if(r&&r.ok){mergeScores(r.data.scores);if(app.querySelector(".loginbar"))home();}});
}
function loginBar(){
 if(!ME)return '<div class="loginbar"><span>Not logged in — scores stay on this device only.</span><button class="linklike" id="lgBtn">Log in</button></div>';
 return '<div class="loginbar"><span>Logged in as <b>'+esc(ME.name)+'</b></span><button class="linklike" id="lgOut">Log out</button></div>';
}
function wireLoginBar(){
 var b=document.getElementById("lgBtn"); if(b)b.onclick=showLogin;
 var o=document.getElementById("lgOut"); if(o)o.onclick=function(){ME=null;saveMe();home()};
}
function showLogin(){
 var wrap=document.createElement("div");
 wrap.className="overlay";
 wrap.innerHTML='<div class="modal"><h2>Log in to save your progress</h2><p class="sub">Use the same name and PIN next time to pick up where you left off, even on a different device.</p><input id="lgName" placeholder="Your name" maxlength="40"><input id="lgPin" placeholder="4-digit PIN" maxlength="4" inputmode="numeric" pattern="[0-9]*"><div id="lgErr" class="sub" style="color:var(--bad)"></div><button class="btn" id="lgGo">Log in / Sign up</button><button class="btn alt" id="lgCancel">Cancel</button></div>';
 document.body.appendChild(wrap);
 document.getElementById("lgCancel").onclick=function(){wrap.remove()};
 document.getElementById("lgGo").onclick=function(){
  var name=document.getElementById("lgName").value.trim();
  var pin=document.getElementById("lgPin").value.trim();
  var err=document.getElementById("lgErr");
  if(!name){err.textContent="Please enter your name.";return}
  if(!/^[0-9]{4}$/.test(pin)){err.textContent="PIN must be exactly 4 digits.";return}
  if(!window.mbFire){err.textContent="Still loading, please try again in a moment.";return}
  err.textContent="Logging in...";
  window.mbFire.login(name,pin).then(function(r){
   if(r&&r.ok){
    ME={name:r.data.name,pin:pin}; saveMe();
    mergeScores(r.data.scores);
    wrap.remove(); home();
   } else { err.textContent="Something went wrong. Please try again."; }
  }).catch(function(){err.textContent="Connection problem. Please try again."});
 };
}
if(ME)pullCloud();
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function today(){return new Date().toISOString().slice(0,10)}
function yest(){return new Date(Date.now()-864e5).toISOString().slice(0,10)}
function shuf(a){return a.slice().sort(function(){return Math.random()-.5})}
function lvls(t){return Object.keys(t.lv).map(Number)}
function planks(b,n){var p="";for(var k=0;k<n;k++)p+='<i class="pl'+(k<b?" on":"")+'"></i>';return '<span class="planks" aria-label="Best score '+b+' of '+n+'">'+p+'</span>'}
function footer(){return '<a class="btn" target="_blank" rel="noopener" href="https://wa.me/233541540029?text='+encodeURIComponent("Hello, I would like to enquire about Math Bridge tuition.")+'">Enquire about tuition on WhatsApp</a><a class="btn alt" target="_blank" rel="noopener" href="https://deborahaabbey.github.io/TheMathsBridge/">Read the Math Bridge editions</a>'}
function bridge(n,built){
 var w=220/n,s='<svg class="bridge" viewBox="0 0 300 90" role="img" aria-label="Bridge with '+built+' of '+n+' planks built"><rect x="0" y="58" width="300" height="32" fill="var(--river)"/><rect x="0" y="40" width="40" height="50" rx="4" fill="var(--ink)"/><rect x="260" y="40" width="40" height="50" rx="4" fill="var(--ink)"/>';
 for(var i=0;i<n;i++){var x=40+i*w+2,on=i<built;
  s+='<rect x="'+x+'" y="40" width="'+(w-4)+'" height="9" rx="3" '+(on?'fill="var(--accent)"':'fill="none" stroke="var(--mute)" stroke-dasharray="4 4"')+'/>';
  if(on)s+='<rect x="'+(x+6)+'" y="49" width="3" height="14" fill="var(--accent)"/><rect x="'+(x+w-13)+'" y="49" width="3" height="14" fill="var(--accent)"/>'}
 return s+'</svg>'}
function dailyCard(){var live=D.last===today()||D.last===yest();return '<button class="topic" data-d="1" style="border:2px solid var(--accent)"><div class="row"><b>Daily challenge</b><span class="count">'+(live&&D.streak>0?D.streak+"-day streak":"Start a streak")+'</span></div><div class="count">'+(D.last===today()?"Done today. Come back tomorrow.":"One new question every day.")+'</div></button>'}
function home(){
 var h='<h1>The Math Bridge</h1>'+loginBar()+'<p class="sub">No calculator needed. Choose a topic, then your grade.</p>'+dailyCard();
 T.forEach(function(t,i){var L=lvls(t);if(!L.length)return;h+='<button class="topic" data-t="'+i+'"><div class="row"><b>'+esc(t.name)+'</b><span class="count">'+LN[L[0]].replace(/ \(.*\)/,"")+' to '+LN[L[L.length-1]].replace(/ \(.*\)/,"")+'</span></div></button>'});
 app.innerHTML=h+footer();
 wireLoginBar();
 app.querySelectorAll(".topic").forEach(function(b){b.onclick=function(){if(b.dataset.d)startDaily();else topic(+b.dataset.t)}})}
function isSub(v){return !Array.isArray(v)}
function topic(i){
 var t=T[i],h='<button class="back" id="bk">All topics</button><h1>'+esc(t.name)+'</h1><p class="sub">Choose your grade. No calculator.</p>';
 lvls(t).forEach(function(l){var v=t.lv[l],sub=isSub(v);
  h+='<button class="topic" data-l="'+l+'"><div class="row"><b>'+LN[l]+'</b>'+(sub?'<span class="count">'+Object.keys(v).length+' subtopics</span>':planks(best[t.id+l]||0,3))+'</div></button>'});
 app.innerHTML=h;document.getElementById("bk").onclick=home;
 app.querySelectorAll(".topic").forEach(function(b){b.onclick=function(){grade(i,+b.dataset.l)}})}
function grade(i,l){
 var t=T[i],v=t.lv[l];
 if(!isSub(v))return start(i,l);
 var h='<button class="back" id="bk">'+esc(t.name)+'</button><h1>'+esc(t.name)+'</h1><p class="sub">'+LN[l]+'. Choose a subtopic.</p>';
 Object.keys(v).forEach(function(sk){h+='<button class="topic" data-s="'+esc(sk)+'"><div class="row"><b>'+esc(sk)+'</b>'+planks(best[t.id+l+sk]||0,3)+'</div></button>'});
 app.innerHTML=h;document.getElementById("bk").onclick=function(){topic(i)};
 app.querySelectorAll(".topic").forEach(function(b){b.onclick=function(){start(i,l,b.dataset.s)}})}
function start(i,l,sk){var t=T[i],src=sk?t.lv[l][sk]:t.lv[l];st={i:i,l:l,sk:sk,t:{id:t.id+l+(sk||""),name:t.name+(sk?" — "+sk:""),qs:shuf(src).slice(0,10)},n:0,score:0};quiz()}
function startDaily(){var all=[];T.forEach(function(t){lvls(t).forEach(function(l){var v=t.lv[l];(Array.isArray(v)?[v]:Object.keys(v).map(function(k){return v[k]})).forEach(function(a){a.forEach(function(q){all.push(q)})})})});
 st={daily:true,t:{name:"Daily challenge",qs:[all[Math.floor(Date.now()/864e5)%all.length]]},n:0,score:0};quiz()}
function quiz(){
 var t=st.t,q=t.qs[st.n],lab=st.daily?"Daily challenge":t.name+", "+LN[st.l];
 app.innerHTML='<button class="back" id="bk">Back</button><div class="count">'+esc(lab)+', question '+(st.n+1)+' of '+t.qs.length+'</div>'+bridge(t.qs.length,st.score)+'<h2 class="q">'+esc(q.q)+'</h2>'+(q.svg||'')+'<div>'+q.o.map(function(o,i){return '<button class="opt" data-i="'+i+'">'+esc(o)+'</button>'}).join("")+'</div><div id="fb"></div>';
 document.getElementById("bk").onclick=function(){st.daily?home():(st.sk?grade(st.i,st.l):topic(st.i))};
 app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){answer(+b.dataset.i)}})}
function answer(i){
 var q=st.t.qs[st.n],ok=i===q.a,last=st.n===st.t.qs.length-1;if(ok)st.score++;
 app.querySelectorAll(".opt").forEach(function(b,k){b.disabled=true;if(k===q.a)b.classList.add("ok");else if(k===i)b.classList.add("bad")});
 document.getElementById("fb").innerHTML='<div class="fb"><b>'+(ok?"Correct. Plank added.":"Not quite.")+'</b><br>'+esc(q.e)+'</div><button class="btn" id="nx">'+(last?"See result":"Next question")+'</button>';
 app.querySelector(".bridge").outerHTML=bridge(st.t.qs.length,st.score);
 document.getElementById("nx").focus();
 document.getElementById("nx").onclick=function(){if(last)result();else{st.n++;quiz()}}}
function result(){
 var t=st.t,n=t.qs.length;
 if(st.daily){var d=today();if(D.last!==d){D.streak=D.last===yest()?D.streak+1:1;D.last=d;try{localStorage.setItem("mbDaily",JSON.stringify(D))}catch(e){}}
  app.innerHTML=bridge(1,st.score)+'<h2>'+(st.score?"Correct. Plank added.":"Not this time.")+'</h2><p class="sub">'+D.streak+'-day streak. Come back tomorrow for a new question.</p><button class="btn" id="hm">All topics</button>'+footer();
  document.getElementById("hm").onclick=home;return}
 if(st.score>(best[t.id]||0)){best[t.id]=st.score;save()}
 if(ME&&window.mbFire)window.mbFire.saveScore(ME.name,ME.pin,t.id,st.score,n);
 var L=lvls(T[st.i]),nx=st.sk?null:L.filter(function(x){return x>st.l})[0],full=st.score===n;
 app.innerHTML=bridge(n,st.score)+'<p class="big">'+st.score+' / '+n+'</p><h2>'+(full?"Bridge complete!":"Your bridge is "+st.score+" of "+n+" planks")+'</h2><p class="sub">'+(full?"Ready for the next grade.":"Try again to fill the missing planks.")+'</p>'+(full&&nx?'<button class="btn" id="nl">Next grade: '+LN[nx]+'</button>':'')+'<button class="btn'+(full&&nx?' alt':'')+'" id="ag">Try again</button><button class="btn alt" id="hm">'+(st.sk?"Back to subtopics":"Back to grades")+'</button>'+footer();
 document.getElementById("ag").onclick=function(){start(st.i,st.l,st.sk)};
 document.getElementById("hm").onclick=function(){st.sk?grade(st.i,st.l):topic(st.i)};
 if(document.getElementById("nl"))document.getElementById("nl").onclick=function(){start(st.i,nx)}}
home();
</script>
</body>
</html>
