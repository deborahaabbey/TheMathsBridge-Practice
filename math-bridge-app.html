<style>
:root{--bg:#F5F8FA;--card:#fff;--ink:#14213D;--mute:#5B6B80;--line:#D9E2EA;--accent:#F2A541;--ok:#1F8A70;--bad:#C8434E;--river:#BFDCE5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--card:#16233A;--ink:#EAF0F7;--mute:#9AABC0;--line:#263652;--river:#1E3A55;--ok:#3CC3A0;--bad:#EE6B76}}
:root[data-theme="dark"]{--bg:#0E1626;--card:#16233A;--ink:#EAF0F7;--mute:#9AABC0;--line:#263652;--river:#1E3A55;--ok:#3CC3A0;--bad:#EE6B76}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1,h2{font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;margin:0;letter-spacing:-.01em}
h1{font-size:30px;font-weight:800}h2{font-size:22px;font-weight:600;line-height:1.25}
.sub{color:var(--mute);margin:4px 0 20px}
.topic{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;color:var(--ink);font:inherit;cursor:pointer}
.topic:focus-visible,.opt:focus-visible,.btn:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.topic b{font-family:"Bricolage Grotesque",sans-serif;font-size:18px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.planks{display:flex;gap:4px}.pl{width:14px;height:8px;border-radius:2px;background:var(--line)}.pl.on{background:var(--accent)}
.back{background:none;border:0;color:var(--mute);font:inherit;font-weight:700;padding:8px 0;cursor:pointer}
.bridge{width:100%;height:auto;display:block;margin:8px 0 16px}
.q{margin:0 0 16px}
.diagram{width:100%;max-width:340px;margin:0 auto 16px;display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--card))}
.fb{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--card);border-left:5px solid var(--accent)}
.btn{display:block;text-align:center;text-decoration:none;background:var(--accent);color:#14213D;border:0;border-radius:12px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
.btn.alt{background:transparent;border:2px solid var(--line);color:var(--ink)}
.count{color:var(--mute);font-size:14px;font-weight:600}
.big{font-size:44px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;margin:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal{background:var(--card);border-radius:14px;padding:20px;max-width:340px;width:100%}
.modal input{width:100%;padding:11px;margin:8px 0;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.loginbar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.linklike{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;cursor:pointer;padding:0}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBWWoRsLQutDczMpwpFTyohjoEy7Vm8eLw",
  authDomain: "the-math-bridge.firebaseapp.com",
  projectId: "the-math-bridge",
  storageBucket: "the-math-bridge.firebasestorage.app",
  messagingSenderId: "573451675139",
  appId: "1:573451675139:web:2a702c50b3396997dd5036"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
function slug(name){return name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"")||"student";}
window.mbFire = {
  async login(name, pin){
    const id = slug(name)+"_"+pin;
    const ref = doc(db,"students",id);
    const snap = await getDoc(ref);
    if(snap.exists()) return {ok:true, data:snap.data()};
    const data = {name:name.trim(), pin:pin, created:new Date().toISOString(), scores:{}};
    await setDoc(ref, data);
    return {ok:true, data};
  },
  async saveScore(name, pin, key, score, total){
    const id = slug(name)+"_"+pin;
    const ref = doc(db,"students",id);
    let data;
    try{ const snap = await getDoc(ref); data = snap.exists()? snap.data() : {name:name, pin:pin, created:new Date().toISOString(), scores:{}}; }
    catch(e){ data = {name:name, pin:pin, created:new Date().toISOString(), scores:{}}; }
    if(!data.scores) data.scores = {};
    const prev = data.scores[key];
    const d = new Date().toISOString().slice(0,10);
    if(!prev || score > prev.best){ data.scores[key] = {best:score, total:total, last:score, date:d}; }
    else { data.scores[key].last = score; data.scores[key].date = d; }
    try{ await setDoc(ref, data, {merge:true}); }catch(e){}
    return data;
  }
};
window.mbFireReady = true;
</script>

 "6√5", "5√5"], "a": 3, "e": "3√5 + 2√5 = 5√5."}, {"q": "Simplify fully √75 + √48.", "o": ["√123", "9√6", "9√3", "20√3"], "a": 2, "e": "5√3 + 4√3 = 9√3."}, {"q": "Simplify fully √72 − √18.", "o": ["√54", "3", "9√2", "3√2"], "a": 3, "e": "6√2 − 3√2 = 3√2."}, {"q": "Simplify fully 2√27 − √12.", "o": ["2√3", "8√3", "4√3", "√15"], "a": 2, "e": "2√27 = 6√3 and √12 = 2√3, so 6√3 − 2√3 = 4√3."}, {"q": "Simplify fully √20 + √45 + √80.", "o": ["9√10", "6√5", "√145", "9√5"], "a": 3, "e": "2√5 + 3√5 + 4√5 = 9√5."}, {"q": "Write √3 + √75 in the form a√3, where a is an integer.", "o": ["5√3", "15√3", "√78", "6√3"], "a": 3, "e": "√75 = 5√3, so √3 + 5√3 = 6√3."}, {"q": "Write √200 + √8 in the form k√2.", "o": ["10√2", "16√2", "√208", "12√2"], "a": 3, "e": "√200 = 10√2 and √8 = 2√2."}, {"q": "Tilly says that √3 + √12 = √15. Which statement is correct?", "o": ["She is wrong: √3 + √12 = 3√3", "She is correct", "She is wrong: √3 + √12 = 6", "She is wrong: √3 + √12 = 5√3"], "a": 0, "e": "√12 = 2√3, so √3 + √12 = √3 + 2√3 = 3√3. Roots can only be added when the number under the root is the same."}, {"q": "A rectangle measures 4√3 cm by √3 cm. Find its perimeter.", "o": ["5√3 cm", "20√3 cm", "10√3 cm", "10 cm"], "a": 2, "e": "Perimeter = 2(4√3 + √3) = 2 × 5√3 = 10√3."}, {"q": "A rectangle measures 4√3 cm by √3 cm. Find its area.", "o": ["4 cm²", "12 cm²", "12√3 cm²", "5 cm²"], "a": 1, "e": "Area = 4√3 × √3 = 4 × 3 = 12."}, {"q": "Write √6 × √15 in the form a√10, where a is an integer.", "o": ["9√10", "3√10", "3√6", "6√10"], "a": 1, "e": "√6 × √15 = √90 = √9 × √10 = 3√10."}, {"q": "Write √12 + √27 in the form a√3, where a is an integer.", "o": ["√39", "6√3", "13√3", "5√3"], "a": 3, "e": "2√3 + 3√3 = 5√3."}, {"q": "Evaluate √3 × √48.", "o": ["√51", "4√3", "12", "144"], "a": 2, "e": "√3 × √48 = √144 = 12."}, {"q": "Evaluate (3 + √5)(3 − √5).", "o": ["14", "4", "9", "4 + 6√5"], "a": 1, "e": "Difference of two squares: 9 − 5 = 4."}, {"q": "Expand and simplify (2 + √7)².", "o": ["11", "9 + 4√7", "11 + 4√7", "11 + 2√7"], "a": 2, "e": "4 + 4√7 + 7 = 11 + 4√7."}, {"q": "Expand and simplify (√5 + √2)².", "o": ["7", "7 + √10", "7 + 4√10", "7 + 2√10"], "a": 3, "e": "5 + 2√10 + 2 = 7 + 2√10."}, {"q": "Expand and simplify (4 − √3)².", "o": ["13 − 8√3", "19 + 8√3", "13", "19 − 8√3"], "a": 3, "e": "16 − 8√3 + 3 = 19 − 8√3."}, {"q": "Expand and simplify (2 + √3)(5 + √3).", "o": ["10 + 3√3", "13 + 10√3", "13 + 7√6", "13 + 7√3"], "a": 3, "e": "10 + 2√3 + 5√3 + 3 = 13 + 7√3."}, {"q": "Expand and simplify (3 + √8)(2 + √2), giving your answer in the form a + b√2.", "o": ["6 + 7√2", "10 + 5√2", "16 + 7√2", "10 + 7√2"], "a": 3, "e": "6 + 3√2 + 2√8 + √16 = 6 + 3√2 + 4√2 + 4 = 10 + 7√2."}, {"q": "Given that a = √2 and b = √18, work out (a + b)².", "o": ["20", "16", "32", "4√2"], "a": 2, "e": "b = 3√2, so a + b = 4√2 and (4√2)² = 16 × 2 = 32."}, {"q": "Work out (√3 + 2√12)².", "o": ["15", "27", "39", "75"], "a": 3, "e": "2√12 = 4√3, so the bracket is 5√3 and (5√3)² = 25 × 3 = 75."}, {"q": "A square has sides of 12 cm. The midpoints of its sides are joined to make a second square, and the process is repeated to make a third square. Find the area of the third square.", "o": ["72 cm²", "18 cm²", "36 cm²", "24 cm²"], "a": 2, "e": "Each new square has half the area of the one before: 144 → 72 → 36."}, {"q": "Simplify √63 − 14/√7.", "o": ["5√7", "√7", "7", "3√7"], "a": 1, "e": "√63 = 3√7 and 14/√7 = 14√7/7 = 2√7, so 3√7 − 2√7 = √7."}, {"q": "A box has height √3 m, width √10 m and length 12/√2 m. Find its volume, giving your answer in the form a√15.", "o": ["6√15 m³", "12√15 m³", "12√30 m³", "12√5 m³"], "a": 1, "e": "√3 × √10 × 12/√2 = 12 × √30/√2 = 12√15."}, {"q": "Simplify fully √3y × √3y × √3y.", "o": ["3√3 y³", "3y³", "9√3 y³", "√3 y³"], "a": 0, "e": "(√3)³ = 3√3 and y × y × y = y³."}, {"q": "Simplify √2y + √2y + √2y + √2y.", "o": ["8y", "4√8 y", "√8 y", "4√2 y"], "a": 3, "e": "Four lots of √2y give 4√2y."}, {"q": "Evaluate 20/√5.", "o": ["20√5", "4√5", "4/√5", "5√4"], "a": 1, "e": "Multiply top and bottom by √5: 20√5/5 = 4√5."}, {"q": "Express √72 in the form a√b, where a and b are integers and a > 1.", "o": ["12√2", "36√2", "6√2", "6√3"], "a": 2, "e": "√72 = √36 × √2 = 6√2."}, {"q": "Express √162 in the form a√b, where a and b are integers and b is as small as possible.", "o": ["9√3", "27√2", "9√2", "18√2"], "a": 2, "e": "√162 = √81 × √2 = 9√2."}, {"q": "Express √18 + √98 in the form a√b, where a and b are integers.", "o": ["√116", "10√4", "10√2", "7√2"], "a": 2, "e": "3√2 + 7√2 = 10√2."}, {"q": "Express √45 + √125 in the form a√b, where a and b are integers.", "o": ["√170", "8√25", "15√5", "8√5"], "a": 3, "e": "3√5 + 5√5 = 8√5."}, {"q": "Express √27 + √147 in the form a√b, where a and b are integers.", "o": ["√174", "3√3", "10√9", "10√3"], "a": 3, "e": "3√3 + 7√3 = 10√3."}, {"q": "Simplify 20/√8.", "o": ["10√2", "5/√2", "20√2", "5√2"], "a": 3, "e": "20/√8 = 20/(2√2) = 10/√2 = 10√2/2 = 5√2."}, {"q": "Simplify 18/√12.", "o": ["9√3", "6√3", "3/√3", "3√3"], "a": 3, "e": "√12 = 2√3, so 18/(2√3) = 9/√3 = 9√3/3 = 3√3."}, {"q": "Simplify 20/√5 − √45.", "o": ["5√5", "4√5", "√5", "−√5"], "a": 2, "e": "20/√5 = 4√5 and √45 = 3√5, so 4√5 − 3√5 = √5."}, {"q": "Simplify 18/√3 − √27.", "o": ["9√3", "6√3", "−3√3", "3√3"], "a": 3, "e": "18/√3 = 6√3 and √27 = 3√3, so 6√3 − 3√3 = 3√3."}, {"q": "Simplify 16/√2 − √8.", "o": ["6√2", "8√2", "14√2", "6"], "a": 0, "e": "16/√2 = 8√2 and √8 = 2√2, so 8√2 − 2√2 = 6√2."}, {"q": "Expand and simplify (5 − √12)². Give your answer in the form a − b√3.", "o": ["37 − 20√3", "13 − 20√3", "37 + 20√3", "37 − 10√3"], "a": 0, "e": "(5 − √12)² = 25 − 10√12 + 12 = 37 − 20√3, because √12 = 2√3."}, {"q": "Expand and simplify (4 + √18)². Give your answer in the form a + b√2.", "o": ["34 + 8√2", "34 + 24√2", "16 + 24√2", "34 + 12√2"], "a": 1, "e": "(4 + √18)² = 16 + 8√18 + 18 = 34 + 24√2, because √18 = 3√2."}, {"q": "Expand and simplify (4 + 3√5)².", "o": ["61 + 24√5", "16 + 45√5", "61 + 12√5", "25 + 24√5"], "a": 0, "e": "16 + 24√5 + 45 = 61 + 24√5."}, {"q": "Expand and simplify (3 + 2√18)(4 − 3√2). Give your answer in the form a + b√2.", "o": ["24 + 15√2", "−24 − 15√2", "−24 + 15√2", "−24 + 9√2"], "a": 2, "e": "2√18 = 6√2. (3 + 6√2)(4 − 3√2) = 12 − 9√2 + 24√2 − 36 = −24 + 15√2."}, {"q": "Expand and simplify (5 + √32)(2 − √2). Give your answer in the form a + b√2.", "o": ["10 + 3√2", "2 + 13√2", "18 − 3√2", "2 + 3√2"], "a": 3, "e": "√32 = 4√2. (5 + 4√2)(2 − √2) = 10 − 5√2 + 8√2 − 8 = 2 + 3√2."}, {"q": "Expand and simplify (4 − √8)(5 − √2). Give your answer in the form a + b√2.", "o": ["24 − 14√2", "16 − 14√2", "24 − 6√2", "24 + 14√2"], "a": 0, "e": "√8 = 2√2. (4 − 2√2)(5 − √2) = 20 − 4√2 − 10√2 + 4 = 24 − 14√2."}, {"q": "Expand and simplify (2 + 3√2)(5 − √2).", "o": ["10 + 13√2", "4 + 17√2", "16 + 13√2", "4 + 13√2"], "a": 3, "e": "10 − 2√2 + 15√2 − 6 = 4 + 13√2."}, {"q": "Expand and simplify (6 − √12)(2 + √3). Give your answer in the form a + b√3.", "o": ["18 + 2√3", "6 + 10√3", "12 + 2√3", "6 + 2√3"], "a": 3, "e": "√12 = 2√3. (6 − 2√3)(2 + √3) = 12 + 6√3 − 4√3 − 6 = 6 + 2√3."}, {"q": "Rationalise the denominator and simplify (12 + 4√2)/√2.", "o": ["12 + 4√2", "6√2 + 2", "4 + 12√2", "4 + 6√2"], "a": 3, "e": "Multiply top and bottom by √2: (12√2 + 8)/2 = 6√2 + 4."}, {"q": "Rationalise the denominator and simplify (√8 + 6)/√2. Give your answer in the form p + q√2.", "o": ["2 + 3√2", "8 + 3√2", "2 + 6√2", "√4 + 3"], "a": 0, "e": "(√8 + 6)/√2 = √4 + 6/√2 = 2 + 3√2."}, {"q": "Rationalise the denominator and simplify (√18 + 10)/√2. Give your answer in the form p + q√2.", "o": ["9 + 5√2", "3 + 10√2", "13√2", "3 + 5√2"], "a": 3, "e": "√18/√2 = 3 and 10/√2 = 5√2."}, {"q": "Rationalise the denominator and simplify (√50 + 8)/√2. Give your answer in the form p + q√2.", "o": ["25 + 4√2", "5 + 8√2", "5 + 4√2", "9√2"], "a": 2, "e": "√50/√2 = 5 and 8/√2 = 4√2."}, {"q": "Work out (6 − √5)(6 + √5) ÷ √31.", "o": ["31", "√(31/31)", "√31", "6 − √5"], "a": 2, "e": "The top is 36 − 5 = 31, and 31/√31 = √31."}, {"q": "Work out (7 − √3)(7 + √3) ÷ √46.", "o": ["46", "√23", "2√23", "√46"], "a": 3, "e": "The top is 49 − 3 = 46, and 46/√46 = √46."}, {"q": "Given that c is a prime number, rationalise the denominator of (2c − √c)/√c and simplify.", "o": ["2√c + 1", "2√c − 1", "2c − 1", "2 − √c"], "a": 1, "e": "Divide each term by √c: 2c/√c = 2√c and √c/√c = 1."}], "Rounding, estimation and bounds": [{"q": "Write √17, 4, 4.5 and ∛63 in order, smallest first.", "o": ["4, ∛63, √17, 4.5", "∛63, √17, 4, 4.5", "∛63, 4, √17, 4.5", "4, √17, ∛63, 4.5"], "a": 2, "e": "4³ = 64, so ∛63 is just under 4. √16 = 4, so √17 is just over 4."}, {"q": "A speed is 60 km/h to the nearest 10 km/h, travelled for exactly 2 hours. Find the upper bound of distance.", "o": ["120 km", "125 km", "130 km", "135 km"], "a": 2, "e": "The upper bound speed is 65 km/h, and 65 × 2 = 130."}, {"q": "A mass is 3.2 kg to the nearest 0.1 kg. Find the upper bound.", "o": ["3.15 kg", "3.25 kg", "3.2 kg", "3.3 kg"], "a": 1, "e": "Half of 0.1 kg is 0.05 kg, so 3.2 + 0.05."}, {"q": "Round 0.004982 to 2 significant figures.", "o": ["0.0049", "0.0050", "0.005", "0.0048"], "a": 1, "e": "The first two significant figures are 4 and 9; the next digit, 8, rounds 49 up to 50."}, {"q": "A rectangle has sides 5 cm and 3 cm, each to the nearest cm. Find the lower bound of its area.", "o": ["11.25 cm²", "15 cm²", "10.5 cm²", "12.25 cm²"], "a": 0, "e": "Lower bounds are 4.5 cm and 2.5 cm: 4.5 × 2.5 = 11.25."}, {"q": "Round 2.0456 to 3 significant figures.", "o": ["2.05", "2.04", "2.046", "2.1"], "a": 0, "e": "The first 3 significant figures are 2, 0, 4; the next digit, 5, rounds the 4 up."}, {"q": "A journey of 100 km (to the nearest 10 km) takes 2 hours (to the nearest hour). Find the upper bound of average speed.", "o": ["60 km/h", "65 km/h", "70 km/h", "75 km/h"], "a": 2, "e": "Upper bound distance is 105 km, lower bound time is 1.5 h, so 105 ÷ 1.5 = 70."}, {"q": "A square has a side of 7 cm, measured to the nearest cm. Find the upper bound of its area.", "o": ["49 cm²", "56.25 cm²", "52 cm²", "57 cm²"], "a": 1, "e": "Upper bound side is 7.5 cm, so 7.5² = 56.25."}]}, "11": {"Indices and standard form": [{"q": "Evaluate 36^½.", "o": ["18", "12", "6", "1/6"], "a": 2, "e": "A power of ½ means square root."}, {"q": "Evaluate 5⁻².", "o": ["−25", "−10", "1/10", "1/25"], "a": 3, "e": "A negative power means reciprocal: 1/5² = 1/25."}, {"q": "Evaluate (8/27)^(−2/3).", "o": ["4/9", "−4/9", "−9/4", "9/4"], "a": 3, "e": "Flip the fraction to remove the minus: (27/8)^(2/3). Cube root gives 3/2; squaring gives 9/4."}, {"q": "Evaluate 27^(1/3).", "o": ["3", "9", "81", "1/3"], "a": 0, "e": "A power of 1/3 means cube root: ∛27 = 3."}, {"q": "Evaluate 16^(3/4).", "o": ["8", "12", "24", "64"], "a": 0, "e": "16^(1/4) = 2, then 2³ = 8."}, {"q": "Evaluate 4⁻¹ + 2⁻¹.", "o": ["1/4", "3/4", "3/2", "1"], "a": 1, "e": "1/4 + 1/2 = 3/4."}, {"q": "Simplify (x^(1/2))⁴.", "o": ["x²", "x⁴", "x^(1/8)", "x^(9/2)"], "a": 0, "e": "Multiply the powers: 1/2 × 4 = 2."}, {"q": "Evaluate (1/8)^(−2/3).", "o": ["4", "1/4", "8", "2"], "a": 0, "e": "Flip the fraction to remove the minus: 8^(2/3) = 4."}], "Surds": [{"q": "Write (5 + 2√3)² in the form a + b√3.", "o": ["25 + 12√3", "29 + 20√3", "37 + 20√3", "37 + 12√3"], "a": 2, "e": "25 + 20√3 + 12 = 37 + 20√3."}, {"q": "(2√3 − 3√2)² = p + q√6. Find p and q.", "o": ["p = 30, q = −12", "p = 12, q = −30", "p = 30, q = 12", "p = 30, q = −6"], "a": 0, "e": "12 + 18 − 12√6."}, {"q": "Expand and simplify (2 − √5)(1 − 3√5).", "o": ["−13 − 7√5", "17 + 7√5", "2 − 3√5", "17 − 7√5"], "a": 3, "e": "2 − 6√5 − √5 + 15 = 17 − 7√5."}, {"q": "Expand and simplify (5 − √2)(1 + 3√2).", "o": ["−1 + 14√2", "11 + 14√2", "−1 − 14√2", "5 + 3√2"], "a": 0, "e": "5 + 15√2 − √2 − 6 = −1 + 14√2."}, {"q": "Rationalise 6/√10.", "o": ["3√10/5", "3√10/10", "√10/6", "6√10"], "a": 0, "e": "6√10/10 = 3√10/5."}, {"q": "Rationalise 9/√3.", "o": ["3√3", "√3", "9√3", "27√3"], "a": 0, "e": "9√3/3 = 3√3."}, {"q": "Rationalise 1/(√2 + 1).", "o": ["(√2 − 1)/3", "1 − √2", "√2 − 1", "√2 + 1"], "a": 2, "e": "Rationalise: multiply top and bottom by the conjugate, then simplify."}, {"q": "Rationalise 2/(√5 + 1).", "o": ["(√5 − 1)/3", "(√5 + 1)/2", "(√5 − 1)/2", "√5 − 1"], "a": 2, "e": "2(√5 − 1)/4."}, {"q": "Rationalise 2/(3 − √5).", "o": ["(3 − √5)/2", "(3 + √5)/7", "(3 + √5)/2", "3 + √5"], "a": 2, "e": "2(3 + √5)/4."}, {"q": "Rationalise 3/(√5 − 2).", "o": ["3√5 + 6", "√5 + 2", "(3√5 + 6)/9", "3√5 − 6"], "a": 0, "e": "The denominator becomes 5 − 4 = 1."}, {"q": "Rationalise 5/(2 + √3).", "o": ["2 − √3", "10 + 5√3", "10 − √3", "10 − 5√3"], "a": 3, "e": "The denominator becomes 4 − 3 = 1."}, {"q": "Rationalise 12/(√7 − √3).", "o": ["3√7 + 3√3", "12√7 + 12√3", "√7 + √3", "3√7 − 3√3"], "a": 0, "e": "The denominator becomes 7 − 3 = 4."}, {"q": "Rationalise 3/(2√2 − 1).", "o": ["(6√2 + 3)/9", "(6√2 + 3)/7", "(6√2 − 3)/7", "6√2 + 3"], "a": 1, "e": "The denominator becomes 8 − 1 = 7."}, {"q": "Rationalise √5/(√5 − 1).", "o": ["(5 + √5)/4", "5 + √5", "(5 − √5)/4", "(√5 + 1)/4"], "a": 0, "e": "√5(√5 + 1)/4."}, {"q": "Rationalise 1/(√7 + √6).", "o": ["√7 − √6", "√6 − √7", "√7 + √6", "√7 − √6 + 1"], "a": 0, "e": "The denominator becomes 7 − 6 = 1."}, {"q": "Work out 1/(√9+√8) + 1/(√8+√7) + 1/(√7+√6) + 1/(√6+√5) + 1/(√5+√4).", "o": ["3 − 2√2", "√5 − 2", "5", "1"], "a": 3, "e": "Each term becomes a difference of square roots, and the middle terms cancel: √9 − √4 = 1."}, {"q": "Rationalise 7/√7.", "o": ["√7", "7√7", "7", "1/√7"], "a": 0, "e": "7/√7 = 7√7/7 = √7."}, {"q": "Simplify (√6)².", "o": ["6", "36", "√6", "12"], "a": 0, "e": "Squaring a square root returns the original number."}, {"q": "Expand and simplify (√5 + 2)(√5 − 2).", "o": ["1", "9", "5 − 4", "√5"], "a": 0, "e": "5 − 4 = 1."}, {"q": "Write (3 − √2)² in the form a + b√2.", "o": ["11 − 6√2", "7 − 6√2", "11 + 6√2", "7 + 6√2"], "a": 0, "e": "9 − 6√2 + 2 = 11 − 6√2."}, {"q": "Rationalise 4/(√5 + √3).", "o": ["2(√5 − √3)", "2(√5 + √3)", "4(√5 − √3)", "(√5 − √3)/2"], "a": 0, "e": "The denominator becomes 5 − 3 = 2, so 4(√5 − √3)/2 = 2(√5 − √3)."}, {"q": "Rationalise the denominator of 14/√7.", "o": ["14√7", "2√7", "√7", "7√2"], "a": 1, "e": "14√7/7 = 2√7."}, {"q": "Rationalise the denominator of 18/(5√2).", "o": ["18√2/5", "9√2/10", "18/5", "9√2/5"], "a": 3, "e": "Multiply top and bottom by √2: 18√2/10 = 9√2/5."}, {"q": "Rationalise the denominator of 21/(2√3).", "o": ["7√3/2", "21√3/2", "21/2", "7√3/6"], "a": 0, "e": "Multiply top and bottom by √3: 21√3/6 = 7√3/2."}, {"q": "Rationalise the denominator of 1/(2 + √3).", "o": ["2 − √3", "2 + √3", "(2 − √3)/7", "1 − √3"], "a": 0, "e": "Multiply by (2 − √3)/(2 − √3). The denominator becomes 4 − 3 = 1."}, {"q": "Rationalise the denominator of 10/(3 − √5).", "o": ["15 + 5√5", "(15 − 5√5)/2", "(15 + 5√5)/4", "(15 + 5√5)/2"], "a": 3, "e": "Multiply by (3 + √5): the denominator is 9 − 5 = 4, so 10(3 + √5)/4 = (15 + 5√5)/2."}, {"q": "Rationalise the denominator of 8/(√7 − √3).", "o": ["8√7 + 8√3", "2√7 − 2√3", "2√7 + 2√3", "√7 + √3"], "a": 2, "e": "Multiply by (√7 + √3): the denominator is 7 − 3 = 4, so 8(√7 + √3)/4 = 2√7 + 2√3."}, {"q": "Show that 12/(√13 − 1) can be written as a + b√13. Find a and b.", "o": ["a = 12, b = 1", "a = 1, b = 1", "a = 1, b = 12", "a = 6, b = 1"], "a": 1, "e": "Multiply by (√13 + 1): the denominator is 13 − 1 = 12, so the result is √13 + 1."}, {"q": "Write 6/(3 − √3) in the form a + b√3.", "o": ["3 − √3", "6 + √3", "1 + √3", "3 + √3"], "a": 3, "e": "Multiply by (3 + √3): the denominator is 9 − 3 = 6, so 6(3 + √3)/6 = 3 + √3."}, {"q": "Write 12/(1/√3 + √3) in the form a√3.", "o": ["4√3", "12√3", "√3", "3√3"], "a": 3, "e": "1/√3 + √3 = 4/√3, so 12 ÷ (4/√3) = 12√3/4 = 3√3."}, {"q": "Write (√2 − 1)/(2√2 + 3) in the form a + b√2, where a and b are integers.", "o": ["a = 7, b = −5", "a = −7, b = −5", "a = 5, b = −7", "a = −7, b = 5"], "a": 3, "e": "Multiply by (2√2 − 3): the numerator is 7 − 5√2 and the denominator is 8 − 9 = −1, so the result is −7 + 5√2."}, {"q": "Write 2√3/(1 + √3) + 6/√3 in the form a + b√3.", "o": ["3 + √3", "3 + 2√3", "3 − √3", "6 + √3"], "a": 0, "e": "2√3/(1 + √3) = 2√3(√3 − 1)/2 = 3 − √3, and 6/√3 = 2√3. Sum: 3 + √3."}, {"q": "Write 6/(1/√2 + √2) in the form a√2.", "o": ["6√2", "2√2", "3√2", "√2"], "a": 1, "e": "1/√2 + √2 = 3/√2, so 6 ÷ (3/√2) = 6√2/3 = 2√2."}, {"q": "(10 − √18)/√2 = a + b√2, where a and b are integers. Find a and b.", "o": ["a = 5, b = −3", "a = 3, b = 5", "a = −3, b = −5", "a = −3, b = 5"], "a": 3, "e": "10/√2 = 5√2 and √18/√2 = 3, so the result is 5√2 − 3."}, {"q": "(2 + c√3)² = d + 12√3, where c and d are integers. Find c and d.", "o": ["c = 3, d = 31", "c = 3, d = 4", "c = 6, d = 40", "c = 12, d = 31"], "a": 0, "e": "(2 + c√3)² = 4 + 4c√3 + 3c². So 4c = 12, giving c = 3, and d = 4 + 27 = 31."}, {"q": "√500 − 3√x = 4√5. Find the value of x.", "o": ["2√5", "10", "20", "180"], "a": 2, "e": "√500 = 10√5, so 3√x = 6√5, giving √x = 2√5 and x = 20."}, {"q": "√(1 23/25) + √27 = a√3/b, where a and b are integers with no common factor. Find a and b.", "o": ["a = 19, b = 5", "a = 4, b = 5", "a = 19, b = 25", "a = 15, b = 5"], "a": 0, "e": "√(48/25) = 4√3/5 and √27 = 3√3 = 15√3/5. The sum is 19√3/5."}, {"q": "Write 6/√3 − √(1 1/3) in the form a√3.", "o": ["2√3/3", "4√3", "8√3/3", "4√3/3"], "a": 3, "e": "6/√3 = 2√3 and √(4/3) = 2/√3 = 2√3/3, so 2√3 − 2√3/3 = 4√3/3."}, {"q": "c = 8/(2√y) and d = 3/√y. Work out cd.", "o": ["24/y", "12/y", "12/√y", "24/(2y)"], "a": 1, "e": "c = 4/√y, so cd = (4 × 3)/(√y × √y) = 12/y."}, {"q": "y = 3√10/5. Work out y³.", "o": ["54√10/25", "27√10/5", "54√10/125", "270√10"], "a": 0, "e": "(3√10)³ = 27 × 10√10 = 270√10, and 5³ = 125. So y³ = 270√10/125 = 54√10/25."}, {"q": "Show that (√5 + √45)/√2 can be written as √k, where k is an integer. Find k.", "o": ["20", "10", "40", "50"], "a": 2, "e": "√45 = 3√5, so the top is 4√5. (4√5)/√2 = √(16 × 5/2) = √40."}, {"q": "Show that (√2 + √8)/√3 can be written as √k, where k is an integer. Find k.", "o": ["6", "3", "18", "2"], "a": 0, "e": "√8 = 2√2, so the top is 3√2. 3√2/√3 = √(9 × 2/3) = √6."}, {"q": "Show that (√3 + √27)/√2 can be written as √k, where k is an integer. Find k.", "o": ["24", "12", "16", "48"], "a": 0, "e": "√27 = 3√3, so the top is 4√3. 4√3/√2 = √(16 × 3/2) = √24."}, {"q": "(2 + 3√2)² = p + q/√8, where p and q are integers. Find q.", "o": ["24", "48", "12", "96"], "a": 1, "e": "(2 + 3√2)² = 22 + 12√2. Now 12√2 = q/√8, so q = 12√2 × 2√2 = 48."}, {"q": "(4 − √x)² = y − 16√3, where x and y are positive integers. Find x and y.", "o": ["x = 12, y = 40", "x = 12, y = 28", "x = 48, y = 64", "x = 3, y = 19"], "a": 1, "e": "(4 − √x)² = 16 − 8√x + x. So 8√x = 16√3, √x = 2√3 and x = 12. Then y = 16 + 12 = 28."}, {"q": "(6 + √a)(3 + √a) = 23 + k√a, where a and k are positive integers. Find a and k.", "o": ["a = 23, k = 9", "a = 5, k = 18", "a = 5, k = 9", "a = 18, k = 9"], "a": 2, "e": "Expanding: 18 + 9√a + a. So 18 + a = 23, giving a = 5, and k = 9."}, {"q": "(√a + √(18a))² = 38 + b√2, where a and b are positive integers. Find a and b.", "o": ["a = 2, b = 6", "a = 19, b = 12", "a = 2, b = 12", "a = 4, b = 12"], "a": 2, "e": "Expanding: a + 18a + 2a√18 = 19a + 6a√2. So 19a = 38, giving a = 2, and b = 6 × 2 = 12."}, {"q": "(a + √b)² = 28 + 10√b, where a is an integer and b is prime. Find a and b.", "o": ["a = 5, b = 28", "a = 3, b = 5", "a = 5, b = 3", "a = 10, b = 3"], "a": 2, "e": "Expanding: a² + b + 2a√b. So 2a = 10, giving a = 5. Then 25 + b = 28, so b = 3."}, {"q": "A trapezium ABCD has AB parallel to DC, with right angles at B and C. AB = 2 cm, BC = √3 cm and DC = k cm. Its area is 6√6 cm². Find k in the form a√b − c.", "o": ["6√2 − 2", "12√2 + 2", "12√2 − 2", "12√6 − 2"], "a": 2, "e": "Area = ½(2 + k)√3 = 6√6, so 2 + k = 12√6/√3 = 12√2. Therefore k = 12√2 − 2."}, {"q": "Rationalise the denominator and simplify 20/(3 + √5).", "o": ["15 + 5√5", "(15 − 5√5)/2", "15 − 5√5", "5 − 5√5"], "a": 2, "e": "Multiply by (3 − √5): the denominator is 9 − 5 = 4. So 20(3 − √5)/4 = ."}, {"q": "Solve 3x + y = 11, x − y = 1. Find x.", "o": ["3", "4", "2", "11"], "a": 0, "e": "Adding the equations: 4x = 12, so x = 3."}, {"q": "Solve 2x − y = 4, x + y = 5. Find y.", "o": ["2", "3", "4", "1"], "a": 0, "e": "Adding the equations: 3x = 9, x = 3, so y = 5 − 3 = 2."}, {"q": "Which pair of simultaneous equations has no solution?", "o": ["x + y = 5 and x + y = 8", "x + y = 5 and x − y = 1", "2x + y = 5 and x − y = 1", "x = 2 and y = 3"], "a": 0, "e": "Same gradient, different intercept: the lines are parallel and never meet."}, {"q": "Solve y = x + 1, 2x + y = 10. Find x.", "o": ["3", "9", "1", "4"], "a": 0, "e": "2x + x + 1 = 10, so 3x = 9, x = 3."}, {"q": "Solve 4x + y = 10, y = 2. Find x.", "o": ["2", "8", "4", "3"], "a": 0, "e": "4x = 8, so x = 2."}, {"q": "Solve x − 2y = 1, x + 2y = 9. Find x.", "o": ["5", "4", "2", "9"], "a": 0, "e": "Adding the equations: 2x = 10, x = 5."}, {"q": "Solve 3x − 2y = 4, x = 2y. Find y.", "o": ["1", "2", "4", "0.5"], "a": 0, "e": "3(2y) − 2y = 4, so 4y = 4, y = 1."}, {"q": "Which method suits x = 3y + 1 and 2x + y = 9 best?", "o": ["Substitution", "Elimination", "Graphing only", "Trial and error"], "a": 0, "e": "x is already expressed in terms of y, so substitute directly."}, {"q": "Solve x + y = 10, x − y = 2. Find y.", "o": ["4", "6", "2", "8"], "a": 0, "e": "Adding: 2x = 12, x = 6, so y = 4."}, {"q": "Solve 2x + 3y = 13, y = 1. Find x.", "o": ["5", "10", "6", "4"], "a": 0, "e": "2x + 3 = 13, so 2x = 10, x = 5."}, {"q": "Solve x + 3y = 11, x − y = 3. Find x.", "o": ["5", "2", "8", "3"], "a": 0, "e": "Subtracting: 4y = 8, y = 2, so x = 3 + 2 = 5."}, {"q": "Solve 5x − y = 7, y = 3x − 1. Find x.", "o": ["3", "2", "1", "4"], "a": 0, "e": "5x − (3x − 1) = 7, so 2x + 1 = 7, x = 3."}, {"q": "Two simultaneous linear equations have gradients −2 and 3. How many solutions do they have?", "o": ["Exactly one", "None", "Infinitely many", "Two"], "a": 0, "e": "Different gradients mean the lines cross at one point."}, {"q": "Solve 3x + 2y = 16, x = 2y. Find y.", "o": ["2", "4", "8", "1"], "a": 0, "e": "3(2y) + 2y = 16, so 8y = 16, y = 2."}, {"q": "Solve the simultaneous equations 4x + 3y = 18 and x − 3y = 7.", "o": ["x = −2/3, y = 5", "x = −5, y = −2/3", "x = 5, y = 2/3", "x = 5, y = −2/3"], "a": 3, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations x − 3y = −23 and 5x + 2y = 4.", "o": ["x = 7, y = −2", "x = 2, y = 7", "x = −2, y = −7", "x = −2, y = 7"], "a": 3, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 2x + 5y = −10 and 2x − y = 8.", "o": ["x = −3, y = 5/2", "x = 5/2, y = −3", "x = −5/2, y = −3", "x = 5/2, y = 3"], "a": 1, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 4x + 2y = 10 and 5x + 3y = 12.", "o": ["x = −1, y = 3", "x = −3, y = −1", "x = 3, y = 1", "x = 3, y = −1"], "a": 3, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 2x + 5y = 4 and 7x − 5y = −1.", "o": ["x = 2/3, y = 1/3", "x = −1/3, y = 2/3", "x = 1/3, y = −2/3", "x = 1/3, y = 2/3"], "a": 3, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 3x − 2y = 7 and 7x + 2y = 13.", "o": ["x = −1/2, y = 2", "x = −2, y = −1/2", "x = 2, y = −1/2", "x = 2, y = 1/2"], "a": 2, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 2x − 3y = 4 and 4x − y = 13.", "o": ["x = 1, y = 7/2", "x = −7/2, y = 1", "x = 7/2, y = −1", "x = 7/2, y = 1"], "a": 3, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 3x + y = 15 and 5x + 2y = 24.", "o": ["x = −3, y = 6", "x = −6, y = −3", "x = 6, y = −3", "x = 6, y = 3"], "a": 2, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 3x − y = −4 and 2x − 3y = 9.", "o": ["x = −5, y = −3", "x = −3, y = −5", "x = 3, y = −5", "x = −3, y = 5"], "a": 1, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 6x + 5y = 4.5 and 3x − 2y = 9.", "o": ["x = 2, y = −3/2", "x = −3/2, y = 2", "x = −2, y = −3/2", "x = 2, y = 3/2"], "a": 0, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations x + 5y = 5 and 3x − y = 9.", "o": ["x = 3/8, y = 25/8", "x = −25/8, y = 3/8", "x = 25/8, y = −3/8", "x = 25/8, y = 3/8"], "a": 3, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 4x − 3y = 11 and 10x + 2y = −1.", "o": ["x = −3, y = 1/2", "x = −1/2, y = −3", "x = 1/2, y = −3", "x = 1/2, y = 3"], "a": 2, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "Solve the simultaneous equations 2x + 3y = 4 and 3x + 2y = 11.", "o": ["x = −2, y = 5", "x = −5, y = −2", "x = 5, y = −2", "x = 5, y = 2"], "a": 2, "e": "Eliminate one letter by making its coefficients match, then substitute back to find the other."}, {"q": "x + y = 14 and x − y = 4. Find x and y.", "o": ["x = 5, y = 9", "x = 9, y = 5", "x = 10, y = 4", "x = 8, y = 6"], "a": 1, "e": "Add: 2x = 18."}, {"q": "2x + 3y = 21 and 2x − 3y = 3. Find x and y.", "o": ["x = 3, y = 6", "x = 9, y = 1", "x = 6, y = 3", "x = 6, y = 4"], "a": 2, "e": "Add: 4x = 24."}, {"q": "x + 3y = 23 and 2x + y = 16. Find x and y.", "o": ["x = 6, y = 5", "x = 8, y = 0", "x = 5, y = 6", "x = 4, y = 8"], "a": 2, "e": "x = 23 − 3y gives 46 − 5y = 16, so y = 6."}, {"q": "2x + y = 18 and x + 3y = 19. Find x and y.", "o": ["x = 4, y = 7", "x = 8, y = 2", "x = 6, y = 6", "x = 7, y = 4"], "a": 3, "e": "x = 19 − 3y gives 38 − 5y = 18, so y = 4."}, {"q": "3x + 2y = 23 and 2x + 3y = 22. Find x and y.", "o": ["x = 4, y = 5", "x = 3, y = 7", "x = 5, y = 4", "x = 7, y = 1"], "a": 2, "e": "Add: 5x + 5y = 45. Subtract: x − y = 1."}, {"q": "4x + 3y = 33 and 3x + 5y = 33. Find x and y.", "o": ["x = 3, y = 7", "x = 3, y = 6", "x = 7, y = 5/3", "x = 6, y = 3"], "a": 3, "e": "20x + 15y = 165 and 9x + 15y = 99, so 11x = 66."}, {"q": "y = x + 2 and 3x + y = 22. Find x and y.", "o": ["x = 5, y = 7", "x = 7, y = 5", "x = 6, y = 8", "x = 4, y = 6"], "a": 0, "e": "4x + 2 = 22."}, {"q": "The sum of two numbers is 29. Twice the first minus the second is 4. Find the numbers.", "o": ["12 and 17", "10 and 19", "9 and 20", "11 and 18"], "a": 3, "e": "3 × first = 33."}, {"q": "A man is 4 times as old as his son. In 5 years he will be 3 times as old. Find their ages now.", "o": ["Man 40, son 10", "Man 36, son 9", "Man 44, son 11", "Man 32, son 8"], "a": 0, "e": "4s + 5 = 3(s + 5), so s = 10."}, {"q": "A rectangle has perimeter 54 cm. Its length is 3 cm more than twice its width. Find the width and length.", "o": ["8 cm and 19 cm", "9 cm and 18 cm", "10 cm and 17 cm", "8 cm and 18 cm"], "a": 0, "e": "2(3w + 3) = 54, so w = 8."}], "Proportion and variation (direct, inverse, joint)": [{"q": "y is directly proportional to x. When x = 4, y = t. Find x in terms of t when y = 2.", "o": ["t/8", "2t", "t/2", "8/t"], "a": 3, "e": "y = kx, so k = t/4. Then 2 = (t/4)x, so x = 8/t."}, {"q": "y is inversely proportional to (x + 1)². When x = 3, y = 2. Find y when x = 9.", "o": ["16/25", "8/25", "2/25", "4/5"], "a": 1, "e": "2 = k/16, so k = 32. Then y = 32/100 = 8/25."}, {"q": "y is directly proportional to x. When x = 4, y = 20. Find y when x = 7.", "o": ["28", "35", "24", "40"], "a": 1, "e": "k = 20 ÷ 4 = 5, so y = 5 × 7 = 35."}, {"q": "y varies inversely with x. When x = 3, y = 12. Find y when x = 6.", "o": ["6", "24", "4", "18"], "a": 0, "e": "k = 3 × 12 = 36, so y = 36 ÷ 6 = 6."}, {"q": "p is directly proportional to q². When q = 2, p = 12. Find p when q = 5.", "o": ["30", "60", "75", "150"], "a": 2, "e": "k = 12 ÷ 4 = 3, so p = 3 × 25 = 75."}, {"q": "If y ∝ x and y = 15 when x = 3, find x when y = 35.", "o": ["5", "7", "9", "12"], "a": 1, "e": "k = 15 ÷ 3 = 5, so x = 35 ÷ 5 = 7."}, {"q": "m varies inversely with n. If m = 8 when n = 5, find m when n = 10.", "o": ["4", "16", "2", "20"], "a": 0, "e": "k = 8 × 5 = 40, so m = 40 ÷ 10 = 4."}, {"q": "a is directly proportional to b. If a = 18 when b = 6, find the constant of proportionality.", "o": ["3", "12", "24", "1/3"], "a": 0, "e": "k = 18 ÷ 6 = 3."}, {"q": "z varies jointly as x and y. When x = 2 and y = 3, z = 24. Find z when x = 4 and y = 1.", "o": ["8", "16", "32", "48"], "a": 1, "e": "k = 24 ÷ 6 = 4, so z = 4 × 4 × 1 = 16."}, {"q": "y is inversely proportional to x². When x = 2, y = 5. Find y when x = 4.", "o": ["1.25", "2.5", "10", "20"], "a": 0, "e": "k = 5 × 4 = 20, so y = 20 ÷ 16 = 1.25."}, {"q": "y ∝ 1/x. When x = 5, y = 4. Find y when x = 10.", "o": ["2", "8", "20", "0.5"], "a": 0, "e": "k = 5 × 4 = 20, so y = 20 ÷ 10 = 2."}, {"q": "A car's speed and travel time for a fixed distance are inversely proportional. At 60 km/h it takes 3 h. Find the time at 90 km/h.", "o": ["1.5 h", "2 h", "4.5 h", "2.5 h"], "a": 1, "e": "Distance = 60 × 3 = 180 km, so time = 180 ÷ 90 = 2 h."}, {"q": "p is directly proportional to q. If p = 24 when q = 8, find q when p = 45.", "o": ["12", "15", "18", "20"], "a": 1, "e": "k = 24 ÷ 8 = 3, so q = 45 ÷ 3 = 15."}, {"q": "y is proportional to x³. When x = 2, y = 40. Find y when x = 3.", "o": ["60", "90", "120", "135"], "a": 3, "e": "k = 40 ÷ 8 = 5, so y = 5 × 27 = 135."}, {"q": "Which graph shape represents y directly proportional to x?", "o": ["A straight line through the origin", "A straight line not through the origin", "A curve approaching the axes", "A parabola"], "a": 0, "e": "Direct proportion always passes through the origin."}, {"q": "w varies inversely with t². When t = 2, w = 9. Find w when t = 3.", "o": ["4", "6", "16", "36"], "a": 0, "e": "k = 9 × 4 = 36, so w = 36 ÷ 9 = 4."}], "Sequences and series": [{"q": "Find the next term: 3, 7, 11, 15, ?", "o": ["17", "18", "19", "21"], "a": 2, "e": "The pattern adds 4 each time: 15 + 4 = 19."}, {"q": "Find the nth term of 2, 5, 8, 11, ...", "o": ["3n − 1", "3n + 1", "2n + 3", "n + 3"], "a": 0, "e": "The sequence increases by 3, starting near 2: 3(1) − 1 = 2."}, {"q": "Find the 10th term of the sequence with nth term 4n − 1.", "o": ["39", "40", "41", "36"], "a": 0, "e": "4(10) − 1 = 39."}, {"q": "Find the next term: 2, 6, 18, 54, ?", "o": ["162", "108", "216", "72"], "a": 0, "e": "Each term is multiplied by 3: 54 × 3 = 162."}, {"q": "Find the nth term of 5, 9, 13, 17, ...", "o": ["4n + 1", "4n − 1", "5n", "4n + 5"], "a": 0, "e": "The sequence rises by 4 each time; at n = 1, 4(1) + 1 = 5."}, {"q": "Find the 8th term of the sequence with nth term 3n − 2.", "o": ["22", "24", "21", "26"], "a": 0, "e": "3(8) − 2 = 22."}, {"q": "A sequence has nth term n² + 1. Find the 4th term.", "o": ["17", "16", "9", "5"], "a": 0, "e": "4² + 1 = 17."}, {"q": "Find the common difference of 20, 15, 10, 5, ...", "o": ["−5", "5", "−10", "15"], "a": 0, "e": "Each term decreases by 5."}, {"q": "Find the next term: 1, 4, 9, 16, ?", "o": ["25", "20", "24", "36"], "a": 0, "e": "These are square numbers: 5² = 25."}, {"q": "Find the nth term of 7, 10, 13, 16, ...", "o": ["3n + 4", "3n + 7", "4n + 3", "3n + 3"], "a": 0, "e": "The sequence rises by 3; at n = 1, 3(1) + 4 = 7."}, {"q": "Find the 12th term of the sequence with nth term 2n + 3.", "o": ["27", "25", "29", "24"], "a": 0, "e": "2(12) + 3 = 27."}, {"q": "A sequence starts at 100 and decreases by 8 each time. Find the 5th term.", "o": ["68", "76", "60", "92"], "a": 0, "e": "100 − 8(4) = 68."}, {"q": "Find the common ratio of 5, 10, 20, 40, ...", "o": ["2", "5", "10", "0.5"], "a": 0, "e": "Each term is doubled: 10 ÷ 5 = 2."}, {"q": "Find the next term: 100, 90, 80, 70, ?", "o": ["65", "60", "50", "55"], "a": 1, "e": "Each term decreases by 10."}, {"q": "Find the nth term of 4, 8, 12, 16, ...", "o": ["4n", "4n + 4", "n + 4", "4n − 4"], "a": 0, "e": "The sequence rises by 4; at n = 1, 4(1) = 4."}, {"q": "Find the 15th term of the sequence with nth term 5n − 3.", "o": ["72", "75", "70", "68"], "a": 0, "e": "5(15) − 3 = 72."}, {"q": "A sequence begins at 50 and increases by 6 each time. Find the 6th term.", "o": ["80", "74", "86", "56"], "a": 0, "e": "50 + 6(5) = 80."}, {"q": "Find the common ratio of 81, 27, 9, 3, ...", "o": ["1/3", "3", "9", "1/9"], "a": 0, "e": "Each term is divided by 3: 27 ÷ 81 = 1/3."}]}, "11": {"Simplifying, expanding and factorising": [{"q": "Simplify (5x − x²)/(25 − x²).", "o": ["x/(5 − x)", "x/(x − 5)", "1/5", "x/(5 + x)"], "a": 3, "e": "x(5 − x)/((5 − x)(5 + x)); cancel (5 − x)."}, {"q": "Simplify (2x² − 5x − 12)/(3x² − 12x).", "o": ["(2x − 3)/(3x)", "(2x + 3)/3", "2x/3", "(2x + 3)/(3x)"], "a": 3, "e": "(2x + 3)(x − 4)/(3x(x − 4)); cancel (x − 4)."}, {"q": "Simplify (x² − 5x)/(2x² − 50).", "o": ["x/(2(x + 5))", "x/(2(x − 5))", "x/(x + 5)", "x/(2x + 5)"], "a": 0, "e": "x(x − 5)/(2(x − 5)(x + 5)); cancel (x − 5)."}, {"q": "Simplify (x² − 25)/(x² − 17x + 60).", "o": ["(x + 5)/(x − 12)", "(x − 5)/(x − 12)", "(x + 5)/(x + 12)", "(x + 5)/(17x − 60)"], "a": 0, "e": "(x − 5)(x + 5)/((x − 5)(x − 12)); cancel (x − 5)."}, {"q": "Simplify (ux − 2u − x + 2)/(u² − 1).", "o": ["(x − 2)/(u − 1)", "(x − 2)/(u + 1)", "(x + 2)/(u + 1)", "(2 − x)/(u + 1)"], "a": 1, "e": "Top = (x − 2)(u − 1); bottom = (u − 1)(u + 1)."}, {"q": "Simplify (2x² + x − 15)/(ax + 3a − 2bx − 6b).", "o": ["(2x − 5)/(a − 2b)", "(2x + 5)/(a − 2b)", "(2x − 5)/(a + 2b)", "(x − 5)/(a − 2b)"], "a": 0, "e": "Top = (2x − 5)(x + 3); bottom = (x + 3)(a − 2b)."}, {"q": "Factorise 6x² + 7x − 20.", "o": ["(3x + 4)(2x − 5)", "(3x − 4)(2x + 5)", "(6x − 4)(x + 5)", "(3x − 5)(2x + 4)"], "a": 1, "e": "6x² + 15x − 8x − 20 gives 7x in the middle."}, {"q": "Simplify (2x − 1)(x + 3).", "o": ["2x² + 5x − 3", "2x² + 5x + 3", "2x² − 5x − 3", "2x² + x − 3"], "a": 0, "e": "2x² + 6x − x − 3 = 2x² + 5x − 3."}, {"q": "Factorise 2x² + 8x.", "o": ["2x(x + 4)", "2x(x + 8)", "x(2x + 8)", "4x(x + 2)"], "a": 0, "e": "Take out the common factor 2x."}, {"q": "Simplify (x + 1)² − (x − 1)².", "o": ["4x", "2x", "4", "0"], "a": 0, "e": "Expand both: (x² + 2x + 1) − (x² − 2x + 1) = 4x."}, {"q": "Factorise 3x² − 12.", "o": ["3(x − 2)(x + 2)", "3(x + 2)²", "(3x − 2)(x + 2)", "3(x² − 4x)"], "a": 0, "e": "Take out 3 first: 3(x² − 4), then factorise the difference of squares."}, {"q": "Simplify (3x)² − (2x)².", "o": ["5x²", "x²", "9x² − 4x²", "13x²"], "a": 0, "e": "9x² − 4x² = 5x²."}], "Quadratic equations and expressions": [{"q": "Solve x² − 5x + 6 = 0.", "o": ["x = 2 or 3", "x = −2 or −3", "x = 1 or 6", "x = 5 or 1"], "a": 0, "e": "(x − 2)(x − 3) = 0."}, {"q": "Factorise x² − 9.", "o": ["(x − 3)(x + 3)", "(x − 9)(x + 1)", "(x − 3)²", "x(x − 9)"], "a": 0, "e": "This is a difference of two squares."}, {"q": "The quadratic formula for ax² + bx + c = 0 gives x = ?", "o": ["(−b ± √(b² − 4ac)) / 2a", "(b ± √(b² + 4ac)) / 2a", "−b / 2a", "(−b ± √(b² − 4ac)) / a"], "a": 0, "e": "This is the standard quadratic formula."}, {"q": "Solve x² − 4 = 0.", "o": ["x = ±2", "x = 2 only", "x = ±4", "x = 4 only"], "a": 0, "e": "x² = 4, so x = 2 or x = −2."}, {"q": "Solve x² + 3x = 0.", "o": ["x = 0 or −3", "x = 0 or 3", "x = 3 only", "x = −3 only"], "a": 0, "e": "Factorise: x(x + 3) = 0."}, {"q": "Factorise x² − 7x + 12.", "o": ["(x − 3)(x − 4)", "(x + 3)(x + 4)", "(x − 2)(x − 6)", "(x − 1)(x − 12)"], "a": 0, "e": "3 × 4 = 12 and 3 + 4 = 7."}, {"q": "The discriminant of ax² + bx + c = 0 is:", "o": ["b² − 4ac", "b² + 4ac", "4ac − b²", "−b² − 4ac"], "a": 0, "e": "This tells you the number of real roots."}, {"q": "If the discriminant is negative, the quadratic has:", "o": ["No real roots", "Two real roots", "One repeated root", "Infinite roots"], "a": 0, "e": "A negative discriminant means the roots are not real."}, {"q": "Solve x² = 49.", "o": ["x = ±7", "x = 7 only", "x = ±14", "x = 49"], "a": 0, "e": "x² = 49 means x = 7 or x = −7."}, {"q": "Factorise x² + 2x − 15.", "o": ["(x + 5)(x − 3)", "(x − 5)(x + 3)", "(x + 15)(x − 1)", "(x − 15)(x + 1)"], "a": 0, "e": "5 × −3 = −15 and 5 + (−3) = 2."}, {"q": "Solve x² − 10x + 25 = 0.", "o": ["x = 5 (repeated)", "x = ±5", "x = 10", "x = 25"], "a": 0, "e": "(x − 5)² = 0, so x = 5 is a repeated root."}, {"q": "The sum of the roots of x² − 6x + 8 = 0 is:", "o": ["6", "8", "−6", "−8"], "a": 0, "e": "Sum of roots = −b/a = 6."}, {"q": "The product of the roots of x² + 4x − 12 = 0 is:", "o": ["−12", "4", "−4", "12"], "a": 0, "e": "Product of roots = c/a = −12."}, {"q": "Solve x² = 100.", "o": ["x = ±10", "x = 10 only", "x = ±50", "x = 100"], "a": 0, "e": "x² = 100 means x = 10 or x = −10."}, {"q": "Factorise x² − x − 6.", "o": ["(x − 3)(x + 2)", "(x + 3)(x − 2)", "(x − 6)(x + 1)", "(x + 6)(x − 1)"], "a": 0, "e": "−3 × 2 = −6 and −3 + 2 = −1."}, {"q": "Solve x² + 6x + 9 = 0.", "o": ["x = −3 (repeated)", "x = ±3", "x = 6", "x = 9"], "a": 0, "e": "(x + 3)² = 0, so x = −3 is a repeated root."}, {"q": "For x² − 8x + 15 = 0, find the sum of the roots.", "o": ["8", "15", "−8", "−15"], "a": 0, "e": "Sum of roots = −b/a = 8."}, {"q": "For x² + 5x − 6 = 0, find the product of the roots.", "o": ["−6", "5", "6", "−5"], "a": 0, "e": "Product of roots = c/a = −6."}, {"q": "Solve (2x + 1)(x + 4) = 22.", "o": ["x = 3/2 or x = −6", "x = −3/2 or x = 6", "x = 3/2 or x = 6", "x = 1/2 or x = −4"], "a": 0, "e": "2x² + 9x − 18 = 0, which factorises as (2x − 3)(x + 6) = 0."}, {"q": "The graph shows y = x² − 4. What are the roots of the equation x² − 4 = 0, as shown on the graph?", "o": ["x = −2 and x = 2", "x = −4 and x = 4", "x = 0 only", "x
