k)\" text-anchor=\"middle\">1pm</text><text x=\"200\" y=\"135\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">3pm</text></svg>"}, {"q": "The bar chart shows rainfall (mm) over four months. Find the range of the rainfall values shown.", "o": ["55 mm", "80 mm", "25 mm", "30 mm"], "a": 0, "e": "Highest (80) minus lowest (25) = 55 mm.", "svg": "<svg class=\"diagram\" viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"30\" y1=\"120\" x2=\"220\" y2=\"120\" stroke=\"var(--mute)\" stroke-width=\"1.5\"/><rect x=\"45\" y=\"70\" width=\"32\" height=\"50\" fill=\"var(--accent)\"/><rect x=\"95\" y=\"40\" width=\"32\" height=\"80\" fill=\"var(--accent)\"/><rect x=\"145\" y=\"95\" width=\"32\" height=\"25\" fill=\"var(--accent)\"/><rect x=\"195\" y=\"55\" width=\"32\" height=\"65\" fill=\"var(--accent)\"/><text x=\"61\" y=\"135\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">Jan</text><text x=\"111\" y=\"135\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">Feb</text><text x=\"161\" y=\"135\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">Mar</text><text x=\"211\" y=\"135\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">Apr</text><text x=\"61\" y=\"65\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">50</text><text x=\"111\" y=\"35\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">80</text><text x=\"161\" y=\"90\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">25</text><text x=\"211\" y=\"50\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">65</text></svg>"}, {"q": "The bar chart shows books read over 4 weeks (8, 12, 4, 10). Find the mean number of books read per week.", "o": ["8.5", "34", "9.5", "6"], "a": 0, "e": "Sum = 34, and 34 ÷ 4 = 8.5.", "svg": "<svg class=\"diagram\" viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\"><line x1=\"30\" y1=\"120\" x2=\"220\" y2=\"120\" stroke=\"var(--mute)\" stroke-width=\"1.5\"/><rect x=\"45\" y=\"80\" width=\"32\" height=\"40\" fill=\"var(--accent)\"/><rect x=\"95\" y=\"60\" width=\"32\" height=\"60\" fill=\"var(--accent)\"/><rect x=\"145\" y=\"100\" width=\"32\" height=\"20\" fill=\"var(--accent)\"/><rect x=\"195\" y=\"70\" width=\"32\" height=\"50\" fill=\"var(--accent)\"/><text x=\"61\" y=\"135\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">Wk1</text><text x=\"111\" y=\"135\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">Wk2</text><text x=\"161\" y=\"135\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">Wk3</text><text x=\"211\" y=\"135\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">Wk4</text><text x=\"61\" y=\"75\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">8</text><text x=\"111\" y=\"55\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">12</text><text x=\"161\" y=\"95\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">4</text><text x=\"211\" y=\"65\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">10</text></svg>"}, {"q": "The pie chart shows a family's monthly budget split. If the total budget is $800, how much is spent on Food (35%)?", "o": ["$280", "$320", "$200", "$400"], "a": 0, "e": "35% of 800 = 280.", "svg": "<svg class=\"diagram\" viewBox=\"0 0 200 170\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"100\" cy=\"80\" r=\"55\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"1\"/><path d=\"M100,80 L100,25 A55,55 0 0,1 152,101 Z\" fill=\"var(--accent)\"/><path d=\"M100,80 L152,101 A55,55 0 0,1 83,134 Z\" fill=\"var(--river)\"/><path d=\"M100,80 L83,134 A55,55 0 0,1 100,25 Z\" fill=\"var(--ok)\"/><text x=\"100\" y=\"160\" font-size=\"10\" fill=\"var(--ink)\" text-anchor=\"middle\">Rent 40% · Food 35% · Other 25%</text></svg>"}, {"q": "In the pie chart, sector A measures 90°. What fraction of the total data does sector B represent?", "o": ["3/4", "1/4", "1/2", "2/3"], "a": 0, "e": "The full circle is 360°, so B = 360° − 90° = 270°, which is 3/4 of the circle.", "svg": "<svg class=\"diagram\" viewBox=\"0 0 200 170\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"100\" cy=\"80\" r=\"55\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"1\"/><path d=\"M100,80 L100,25 A55,55 0 0,1 155,80 Z\" fill=\"var(--accent)\"/><path d=\"M100,80 L155,80 A55,55 0 1,1 100,135 Z\" fill=\"var(--river)\"/><text x=\"125\" y=\"55\" font-size=\"11\" fill=\"var(--accent-ink,#14213D)\">A</text><text x=\"90\" y=\"110\" font-size=\"11\" fill=\"var(--ink)\">B</text><text x=\"100\" y=\"160\" font-size=\"10\" fill=\"var(--mute)\" text-anchor=\"middle\">Sector A = 90°</text></svg>"}]}, "6": {"Averages (mean, median, mode, range)": [{"q": "Find the mean of 3, 5, 7 and 9.", "o": ["5", "24", "7", "6"], "a": 3, "e": "24 ÷ 4 = 6."}, {"q": "Find the median of 2, 9, 4, 7, 3.", "o": ["7", "5", "9", "4"], "a": 3, "e": "In order: 2, 3, 4, 7, 9. The middle is 4."}, {"q": "Find the mode of 4, 6, 4, 8, 4, 9.", "o": ["6", "8", "5", "4"], "a": 3, "e": "4 appears most often."}, {"q": "Find the range of 12, 5, 20 and 9.", "o": ["8", "46", "20", "15"], "a": 3, "e": "20 − 5 = 15."}, {"q": "Find the median of 3, 5, 8 and 10.", "o": ["5", "6", "8", "6.5"], "a": 3, "e": "Halfway between 5 and 8."}, {"q": "The mean of four numbers is 7. Three of them are 5, 6 and 8. Find the fourth.", "o": ["7", "10", "8", "9"], "a": 3, "e": "Total = 28, and 5 + 6 + 8 = 19, so 28 − 19 = 9."}, {"q": "Find the mean of 4, 8, 6, 10, 2.", "o": ["5", "6", "7", "8"], "a": 1, "e": "Sum = 30, and 30 ÷ 5 = 6."}, {"q": "Find the mode of 2, 3, 3, 5, 7, 3.", "o": ["2", "3", "5", "7"], "a": 1, "e": "3 appears most often."}, {"q": "Find the median of 9, 1, 5, 3, 7.", "o": ["3", "5", "7", "9"], "a": 1, "e": "In order: 1, 3, 5, 7, 9 — the middle value is 5."}, {"q": "Find the range of 15, 4, 22, 9.", "o": ["9", "13", "18", "26"], "a": 2, "e": "22 − 4 = 18."}, {"q": "A set of 5 numbers has a mean of 8. Find their total.", "o": ["13", "40", "45", "58"], "a": 1, "e": "5 × 8 = 40."}, {"q": "Find the mean of 10, 20, 30.", "o": ["15", "20", "25", "30"], "a": 1, "e": "Sum = 60, and 60 ÷ 3 = 20."}, {"q": "Find the mode of 7, 7, 2, 9, 2, 2.", "o": ["7", "9", "2", "4"], "a": 2, "e": "2 appears most often."}, {"q": "Find the range of 3, 17, 8, 25, 1.", "o": ["24", "22", "25", "17"], "a": 0, "e": "25 − 1 = 24."}, {"q": "A set of 4 numbers has mean 10. Three of them are 8, 9, 11. Find the fourth.", "o": ["10", "11", "12", "13"], "a": 2, "e": "Total needed = 40; 8 + 9 + 11 = 28, so the fourth number is 12."}, {"q": "Find the median of 2, 8, 4, 6.", "o": ["4", "5", "6", "8"], "a": 1, "e": "In order: 2, 4, 6, 8 — the middle two average to (4+6)/2 = 5."}, {"q": "A die is rolled six times: 2, 4, 4, 6, 4, 2. Find the mode.", "o": ["4", "2", "6", "3"], "a": 0, "e": "4 appears most often."}, {"q": "Find the range of 100, 45, 78, 12.", "o": ["88", "100", "67", "45"], "a": 0, "e": "100 − 12 = 88."}, {"q": "A set of 6 numbers has a mean of 5. Find the total of all six numbers.", "o": ["30", "11", "25", "35"], "a": 0, "e": "6 × 5 = 30."}, {"q": "Find the median of 1, 2, 2, 3, 9.", "o": ["2", "3", "9", "1"], "a": 0, "e": "The numbers are already in order, so the middle value is 2."}, {"q": "Find the mean of 6, 9, 3, 12, 0.", "o": ["5", "6", "7", "8"], "a": 1, "e": "Sum = 30, and 30 ÷ 5 = 6."}, {"q": "Find the mode of 4, 4, 6, 6, 6, 2.", "o": ["4", "6", "2", "5"], "a": 1, "e": "6 appears most often."}, {"q": "Find the median of 11, 3, 7, 9, 5.", "o": ["5", "7", "9", "3"], "a": 1, "e": "In order: 3, 5, 7, 9, 11 — the middle value is 7."}, {"q": "Find the range of 50, 20, 95, 65.", "o": ["75", "45", "30", "15"], "a": 0, "e": "95 − 20 = 75."}, {"q": "A set of 3 numbers has a mean of 9. Two of them are 5 and 10. Find the third.", "o": ["11", "12", "13", "14"], "a": 1, "e": "Total needed = 27; 5 + 10 = 15, so the third number is 12."}, {"q": "Find the mean of 1, 3, 5, 7, 9.", "o": ["4", "5", "6", "7"], "a": 1, "e": "Sum = 25, and 25 ÷ 5 = 5."}, {"q": "Find the mode of 8, 1, 8, 3, 8, 5.", "o": ["8", "1", "3", "5"], "a": 0, "e": "8 appears most often."}, {"q": "Find the median of 100, 50, 75.", "o": ["50", "75", "100", "225"], "a": 1, "e": "In order: 50, 75, 100 — the middle value is 75."}, {"q": "Find the range of 6 numbers where the smallest is 3 and the largest is 29.", "o": ["26", "32", "23", "29"], "a": 0, "e": "29 − 3 = 26."}, {"q": "If the mean of 5 numbers is 12, find their total.", "o": ["17", "60", "65", "12"], "a": 1, "e": "5 × 12 = 60."}]}, "7": {"Scatter graphs and correlation": [{"q": "A scatter graph showing points trending upward from left to right shows:", "o": ["Positive correlation", "Negative correlation", "No correlation", "Zero correlation"], "a": 0, "e": "As one variable increases, so does the other."}, {"q": "A scatter graph showing points trending downward from left to right shows:", "o": ["Negative correlation", "Positive correlation", "No correlation", "Perfect correlation"], "a": 0, "e": "As one variable increases, the other decreases."}, {"q": "If points on a scatter graph are scattered with no pattern, this shows:", "o": ["No correlation", "Strong positive correlation", "Strong negative correlation", "Perfect correlation"], "a": 0, "e": "There is no clear relationship between the variables."}, {"q": "A line of best fit on a scatter graph is used to:", "o": ["Show the general trend", "Connect every point exactly", "Show the mode", "Replace the data"], "a": 0, "e": "It summarises the overall pattern without passing through every point."}, {"q": "As temperature increases, ice cream sales increase. This is an example of:", "o": ["Positive correlation", "Negative correlation", "No correlation", "Causation only"], "a": 0, "e": "Both variables rise together."}, {"q": "As a car's age increases, its value decreases. This is an example of:", "o": ["Negative correlation", "Positive correlation", "No correlation", "Zero correlation"], "a": 0, "e": "One variable rises while the other falls."}, {"q": "Which type of graph is used to show the relationship between two variables?", "o": ["Scatter graph", "Pie chart", "Bar chart", "Pictogram"], "a": 0, "e": "A scatter graph plots pairs of values to reveal relationships."}, {"q": "Correlation shown on a scatter graph does NOT necessarily imply:", "o": ["Causation", "A relationship", "A trend", "A pattern"], "a": 0, "e": "Two variables can be related without one causing the other."}, {"q": "A scatter graph shows height vs shoe size with points rising together. This shows:", "o": ["Positive correlation", "Negative correlation", "No correlation", "Causation"], "a": 0, "e": "Both variables increase together."}, {"q": "Which of these is NOT shown directly by a scatter graph?", "o": ["Exact cause and effect", "A trend", "Correlation", "Outliers"], "a": 0, "e": "Correlation does not by itself prove causation."}, {"q": "A point far from the general pattern on a scatter graph is called a(n):", "o": ["Outlier", "Median", "Mode", "Quartile"], "a": 0, "e": "An outlier lies well outside the main trend."}, {"q": "Weak correlation on a scatter graph means the points are:", "o": ["Loosely scattered around a trend", "Perfectly in a line", "Random with no trend at all", "All identical"], "a": 0, "e": "A weak trend is visible but with a lot of scatter."}, {"q": "A perfect positive correlation has correlation coefficient r equal to:", "o": ["1", "0", "−1", "0.5"], "a": 0, "e": "r = 1 means all points lie exactly on an upward line."}, {"q": "Which best describes a scatter graph with points forming a tight upward line?", "o": ["Strong positive correlation", "Strong negative correlation", "No correlation", "Weak correlation"], "a": 0, "e": "A tight upward pattern shows a strong positive relationship."}, {"q": "On a scatter graph, the independent variable is usually plotted on the:", "o": ["x-axis", "y-axis", "Both axes", "Neither axis"], "a": 0, "e": "The variable being controlled or chosen is placed on the x-axis."}, {"q": "If two variables show strong correlation, can we always conclude one causes the other?", "o": ["No, correlation does not prove causation", "Yes, always", "Only if r = 1", "Only if r is negative"], "a": 0, "e": "A third factor could explain the relationship instead."}, {"q": "A scatter graph shows age vs reaction time with points rising together. This could show:", "o": ["Positive correlation", "Negative correlation", "No correlation", "Perfect correlation only"], "a": 0, "e": "Both variables increase together."}, {"q": "Which scatter graph pattern shows the strongest correlation?", "o": ["Points tightly clustered around a line", "Points scattered randomly", "Points forming a circle", "Points forming a cluster with no trend"], "a": 0, "e": "Points close to a line show a strong relationship."}, {"q": "A negative correlation between study time and errors made would mean:", "o": ["More study time, fewer errors", "More study time, more errors", "No relationship", "Study time has no effect"], "a": 0, "e": "As one variable increases, the other decreases."}, {"q": "On a scatter graph, the dependent variable is usually plotted on the:", "o": ["y-axis", "x-axis", "Both axes", "Neither axis"], "a": 0, "e": "The variable that responds is plotted vertically."}, {"q": "Why might two variables show correlation without one causing the other?", "o": ["A third factor may influence both", "Correlation always means causation", "Scatter graphs are always wrong", "Variables can never be related"], "a": 0, "e": "A hidden factor can affect both variables independently."}, {"q": "A scatter graph of hours worked vs income typically shows:", "o": ["Positive correlation", "Negative correlation", "No correlation", "Perfect correlation"], "a": 0, "e": "More hours worked usually means more income earned."}, {"q": "Points scattered with absolutely no visible pattern suggest a correlation coefficient close to:", "o": ["0", "1", "−1", "0.5"], "a": 0, "e": "No pattern means little to no linear relationship."}, {"q": "A scatter graph is a useful tool for spotting:", "o": ["Trends and outliers", "Only the mode", "Only totals", "Only percentages"], "a": 0, "e": "It visually reveals patterns and unusual points at once."}, {"q": "If r is close to 1 or −1, the correlation is described as:", "o": ["Strong", "Weak", "Non-existent", "Unreliable"], "a": 0, "e": "Values near the extremes of the range show a strong relationship."}, {"q": "Drawing a line of best fit on a scatter graph with weak correlation is:", "o": ["Still possible but less reliable for predictions", "Impossible", "Always 100% accurate", "Not allowed under any circumstances"], "a": 0, "e": "A line can be drawn, but predictions from it are less trustworthy."}]}, "8": {"Comparing distributions": [{"q": "Class A has mean 60, Class B has mean 72. Which class performed better on average?", "o": ["Class B", "Class A", "Both equal", "Cannot tell"], "a": 0, "e": "A higher mean indicates a higher average score."}, {"q": "Class A has range 10, Class B has range 25. Which class has more consistent scores?", "o": ["Class A", "Class B", "Both equal", "Cannot tell"], "a": 0, "e": "A smaller range means less spread between the lowest and highest scores."}, {"q": "When comparing two data sets, which pair of statistics is most useful?", "o": ["A measure of average and a measure of spread", "Only the mode", "Only the maximum", "Only the total"], "a": 0, "e": "Together they describe both the centre and the variation of the data."}, {"q": "Team X has median score 15, Team Y has median score 12. Which team typically scores higher?", "o": ["Team X", "Team Y", "Both equal", "Cannot tell"], "a": 0, "e": "A higher median suggests typically higher scores."}, {"q": "If two classes have equal means but Class A has a smaller range, Class A's scores are:", "o": ["More consistent", "Less consistent", "Higher on average", "Lower on average"], "a": 0, "e": "A smaller range means less variation between scores."}, {"q": "Why might the median be preferred over the mean when comparing data with outliers?", "o": ["The median is not affected by extreme values", "The median is always larger", "The median is easier to calculate", "The median ignores all data"], "a": 0, "e": "Extreme values can distort the mean but not the median."}, {"q": "A fair comparison between two data sets should always include a measure of:", "o": ["Both average and spread", "Only the total", "Only the largest value", "Only the smallest value"], "a": 0, "e": "Average alone does not describe how varied the data is."}, {"q": "Class A: mean 50, range 5. Class B: mean 50, range 20. Which statement is true?", "o": ["Class A is more consistent", "Class B is more consistent", "Both are equally consistent", "Cannot be determined"], "a": 0, "e": "Class A's smaller range shows less variation."}, {"q": "Which statistic is most resistant to being skewed by one extreme outlier?", "o": ["Median", "Mean", "Range", "Sum"], "a": 0, "e": "The median depends only on the middle value, not the extremes."}, {"q": "Class A has mode 'Red', Class B has mode 'Blue'. This tells you about:", "o": ["The most common category in each class", "The spread of each class", "The total size of each class", "The mean of each class"], "a": 0, "e": "The mode identifies the most frequently occurring value."}, {"q": "When data is skewed, which average is typically most representative?", "o": ["Median", "Mean", "Mode", "Range"], "a": 0, "e": "The median is less distorted by skewed data than the mean."}, {"q": "Comparing two box plots, a box further to the right indicates:", "o": ["Generally higher values", "Generally lower values", "More consistent data", "Less data"], "a": 0, "e": "A box shifted right sits at higher values on the number line."}, {"q": "If Class A's box plot is narrower than Class B's, Class A has:", "o": ["Less spread in its middle 50% of data", "More spread in its middle 50% of data", "A higher median", "A lower median"], "a": 0, "e": "A narrower box means a smaller interquartile range."}, {"q": "To fairly compare 'typical' performance between two classes, you should compare their:", "o": ["Averages (e.g. means or medians)", "Class sizes only", "Teacher names", "Room numbers"], "a": 0, "e": "Averages summarise typical performance for comparison."}, {"q": "Two classes have the same median but Class A has a larger interquartile range. Class A's middle 50% is:", "o": ["More spread out", "Less spread out", "Identical to Class B", "Impossible to compare"], "a": 0, "e": "A larger IQR means more variation in the middle half of the data."}, {"q": "When comparing average performance, which measure ignores outliers best?", "o": ["Median", "Mean", "Range", "Sum"], "a": 0, "e": "The median is not pulled by extreme values."}, {"q": "If Class A's mean is higher but its range is also much larger than Class B's, what can you conclude?", "o": ["Class A scored higher on average but was less consistent", "Class A was more consistent", "Class B scored higher on average", "Nothing can be concluded"], "a": 0, "e": "A higher mean with a larger range suggests greater variability alongside the higher average."}, {"q": "A back-to-back stem and leaf diagram is used to:", "o": ["Compare two data sets side by side", "Show a single set of data only", "Replace bar charts", "Calculate the mean automatically"], "a": 0, "e": "It displays two related data sets together for easy comparison."}, {"q": "When two data sets have very different sample sizes, which statistics remain fair to compare?", "o": ["Averages and spread (not totals)", "Only totals", "Only the largest value", "Nothing can be compared"], "a": 0, "e": "Totals are affected by sample size, but averages and spread are not."}, {"q": "Which two statistics together give the fullest comparison between two data sets?", "o": ["A measure of centre and a measure of spread", "Only the maximum", "Only the mode", "Only the total"], "a": 0, "e": "Together they describe both where the data sits and how varied it is."}, {"q": "A data set that is symmetric usually has its mean and median:", "o": ["Close together or equal", "Very far apart", "Both equal to zero", "Unrelated"], "a": 0, "e": "Symmetry means the average measures agree closely."}, {"q": "Comparing interquartile ranges is useful because it:", "o": ["Shows spread while ignoring extreme outliers", "Shows the exact total", "Always equals the range", "Ignores the middle of the data"], "a": 0, "e": "The IQR focuses on the middle 50%, avoiding distortion from outliers."}, {"q": "If Class A and Class B have equal ranges but different interquartile ranges, which gives more insight into typical spread?", "o": ["The interquartile range", "The range", "Neither", "Both equally"], "a": 0, "e": "The IQR better reflects the spread of most of the data."}, {"q": "When summarising and comparing data, a measure of spread should always be reported alongside a measure of:", "o": ["Average (centre)", "Colour", "Time", "Location"], "a": 0, "e": "Centre and spread together give a complete picture."}]}, "9": {"Frequency tables and grouped data": [{"q": "A table shows scores 1, 2, 3 with frequencies 2, 3, 5. What is the total frequency?", "o": ["6", "3", "20", "10"], "a": 3, "e": "2 + 3 + 5 = 10."}, {"q": "Scores 1, 2, 3 have frequencies 2, 3, 5. Find the mean score.", "o": ["2", "1.9", "2.5", "2.3"], "a": 3, "e": "(2 + 6 + 15) ÷ 10 = 2.3."}, {"q": "Scores 1, 2, 3 have frequencies 2, 3, 5. What is the mode?", "o": ["5", "10", "2", "3"], "a": 3, "e": "Score 3 has the highest frequency."}, {"q": "A grouped frequency table has a class 10-19 with frequency 6. What is the class width?", "o": ["9", "10", "19", "6"], "a": 1, "e": "From 10 up to (but not including) 20 spans 10 units."}, {"q": "Find the midpoint of the class 20-29.", "o": ["24", "24.5", "25", "20"], "a": 1, "e": "Midpoint = (20 + 29) ÷ 2 = 24.5."}, {"q": "A frequency table shows: value 2 (freq 3), value 4 (freq 2), value 6 (freq 5). Find the total frequency.", "o": ["8", "10", "12", "3"], "a": 1, "e": "3 + 2 + 5 = 10."}, {"q": "Using the data value 1 (freq 2), value 2 (freq 3), value 3 (freq 5), find the mean.", "o": ["2.1", "2.3", "2.4", "2.5"], "a": 1, "e": "(1×2 + 2×3 + 3×5) ÷ 10 = 23 ÷ 10 = 2.3."}, {"q": "In a grouped frequency table, the modal class is:", "o": ["The class with the highest frequency", "The first class", "The last class", "The class with the smallest width"], "a": 0, "e": "The modal class has the most data values."}, {"q": "A class interval is written 10 ≤ x < 20. What is its width?", "o": ["9", "10", "19", "20"], "a": 1, "e": "The interval spans from 10 up to (not including) 20."}, {"q": "A frequency table has classes 0-9, 10-19, 20-29 with frequencies 4, 7, 9. Find the total frequency.", "o": ["18", "19", "20", "29"], "a": 2, "e": "4 + 7 + 9 = 20."}, {"q": "A grouped frequency table has classes of width 5. If the first class starts at 0, what is the first class interval?", "o": ["0-4", "0-5", "1-5", "0-10"], "a": 0, "e": "A width of 5 starting at 0 covers 0, 1, 2, 3, 4."}, {"q": "Which measure can be estimated (not calculated exactly) from grouped data?", "o": ["Mean", "Nothing", "Range only", "Mode only"], "a": 0, "e": "Grouped data loses individual values, so the mean is estimated using midpoints."}, {"q": "A frequency table shows value 10 (freq 4), value 20 (freq 6). Find the total frequency.", "o": ["10", "14", "16", "30"], "a": 1, "e": "4 + 6 = 10."}, {"q": "The frequency density of a class is calculated as:", "o": ["Frequency ÷ class width", "Frequency × class width", "Class width ÷ frequency", "Frequency − class width"], "a": 0, "e": "Frequency density accounts for unequal class widths."}, {"q": "A grouped frequency table uses class width 10, with classes starting at 0. What is the third class interval?", "o": ["20-29", "10-19", "0-9", "30-39"], "a": 0, "e": "The classes are 0-9, 10-19, 20-29 in order."}, {"q": "To estimate the mean from grouped data, you multiply each midpoint by its:", "o": ["Frequency", "Class width", "Cumulative frequency", "Range"], "a": 0, "e": "Summing midpoint × frequency gives an estimate of the total."}, {"q": "A grouped frequency distribution with uneven class widths needs ___ to draw a fair histogram.", "o": ["Frequency density", "Frequency only", "The mode", "The median"], "a": 0, "e": "Frequency density adjusts for the different widths."}, {"q": "In a grouped frequency table, why can't you find the exact mean?", "o": ["Individual data values within each class are unknown", "The frequencies are always wrong", "Grouped data has no mean", "Grouped tables never have a total"], "a": 0, "e": "Only the class and its frequency are known, not the exact values."}, {"q": "A grouped frequency table has classes 0-9, 10-19, 20-29 with frequencies 3, 8, 5. Which is the modal class?", "o": ["10-19", "0-9", "20-29", "Cannot tell"], "a": 0, "e": "10-19 has the highest frequency, 8."}, {"q": "The midpoint of class 30-39 is used to:", "o": ["Estimate the mean", "Find the exact mean", "Find the mode exactly", "Find the range exactly"], "a": 0, "e": "Midpoints give an approximate mean since exact values are unknown."}, {"q": "A frequency table has total frequency 40. If one class has frequency 10, what fraction of the data does it represent?", "o": ["1/4", "1/10", "1/40", "10"], "a": 0, "e": "10 ÷ 40 = 1/4."}, {"q": "In grouped data, the class with the highest frequency density indicates:", "o": ["Where the data is most concentrated", "Where the data is least concentrated", "The mean of the data", "The range of the data"], "a": 0, "e": "Frequency density shows how densely packed the data is within each class."}, {"q": "A class interval 40 ≤ x < 50 has a midpoint of:", "o": ["45", "40", "50", "44.5"], "a": 0, "e": "The midpoint is halfway between 40 and 50."}, {"q": "A frequency table shows class 0-4 (freq 6), class 5-9 (freq 10), class 10-14 (freq 4). Find the modal class.", "o": ["5-9", "0-4", "10-14", "Cannot tell"], "a": 0, "e": "5-9 has the highest frequency, 10."}, {"q": "Grouped data loses what compared to raw data?", "o": ["The exact individual values", "The total frequency", "The number of classes", "The class widths"], "a": 0, "e": "Once grouped, individual data values are no longer visible."}, {"q": "A class interval 15 ≤ x < 25 has what width?", "o": ["10", "15", "25", "5"], "a": 0, "e": "25 − 15 = 10."}, {"q": "To estimate the mean of grouped data, you calculate the sum of (midpoint × frequency) divided by:", "o": ["The total frequency", "The number of classes", "The largest frequency", "The class width"], "a": 0, "e": "This gives a weighted average estimate."}, {"q": "A frequency table has 5 classes each with equal width 8. If the first class starts at 0, where does the third class end (exclusive)?", "o": ["24", "16", "32", "8"], "a": 0, "e": "The classes are 0-8, 8-16, 16-24, so the third ends at 24."}]}, "10": {"Cumulative frequency and box plots": [{"q": "Cumulative frequency is found by:", "o": ["Adding each frequency to the running total", "Multiplying frequencies together", "Subtracting frequencies", "Finding the mean of frequencies"], "a": 0, "e": "Each cumulative total includes all frequencies up to that point."}, {"q": "A box plot's central line (inside the box) represents the:", "o": ["Median", "Mean", "Mode", "Range"], "a": 0, "e": "The line inside the box marks the median."}, {"q": "The 'box' in a box plot spans between the:", "o": ["Lower quartile and upper quartile", "Minimum and maximum", "Mean and median", "Mode and range"], "a": 0, "e": "The box covers the middle 50% of the data."}, {"q": "The interquartile range (IQR) is calculated as:", "o": ["Upper quartile − lower quartile", "Maximum − minimum", "Mean − median", "Upper quartile + lower quartile"], "a": 0, "e": "IQR measures the spread of the middle 50% of data."}, {"q": "Frequencies are 5, 8, 12, 6 for four classes. Find the cumulative frequency after the third class.", "o": ["12", "20", "25", "31"], "a": 2, "e": "5 + 8 + 12 = 25."}, {"q": "On a cumulative frequency graph, the median is estimated at:", "o": ["Half the total frequency", "A quarter of the total frequency", "The highest frequency", "The first value"], "a": 0, "e": "The median lies at the midpoint of the cumulative frequency scale."}, {"q": "The 'whiskers' in a box plot extend to the:", "o": ["Minimum and maximum values", "Lower and upper quartiles", "Mean and mode", "Median only"], "a": 0, "e": "Whiskers show the full range of the data beyond the box."}, {"q": "Lower quartile = 10, upper quartile = 18. Find the interquartile range.", "o": ["8", "28", "14", "4"], "a": 0, "e": "18 − 10 = 8."}, {"q": "On a cumulative frequency graph, the upper quartile is found at what fraction of the total frequency?", "o": ["3/4", "1/4", "1/2", "1"], "a": 0, "e": "The upper quartile marks the 75% point of the data."}, {"q": "A box plot shows minimum 2, lower quartile 5, median 8, upper quartile 12, maximum 15. Find the range.", "o": ["13", "10", "7", "3"], "a": 0, "e": "15 − 2 = 13."}, {"q": "Using the box plot above, find the interquartile range.", "o": ["7", "10", "13", "3"], "a": 0, "e": "12 − 5 = 7."}, {"q": "Cumulative frequency graphs are always:", "o": ["Non-decreasing (never go down)", "Always decreasing", "A straight line", "Symmetric"], "a": 0, "e": "Each cumulative total can only stay the same or increase."}, {"q": "A cumulative frequency curve is usually shaped like a(n):", "o": ["S-curve (ogive)", "Straight line", "Circle", "V-shape"], "a": 0, "e": "This characteristic shape is called an ogive."}, {"q": "The median from a cumulative frequency graph is read at the cumulative frequency value equal to:", "o": ["n/2 (half the total)", "n (the total)", "n/4", "3n/4"], "a": 0, "e": "The median sits at the halfway point of the cumulative total."}, {"q": "On a cumulative frequency graph, where do you read the lower quartile?", "o": ["At 1/4 of the total frequency", "At 1/2 of the total frequency", "At 3/4 of the total frequency", "At the total frequency"], "a": 0, "e": "The lower quartile marks the 25% point of the data."}, {"q": "A box plot is drawn using which five values?", "o": ["Minimum, lower quartile, median, upper quartile, maximum", "Mean, median, mode, range, total", "Minimum, mean, maximum, mode, range", "Only the median and range"], "a": 0, "e": "These five values form the standard box plot summary."}, {"q": "If a box plot is positively skewed, the longer whisker is on the:", "o": ["Right (upper) side", "Left (lower) side", "Both sides equally", "Neither side"], "a": 0, "e": "Positive skew stretches the data toward higher values."}, {"q": "A cumulative frequency graph is plotted using the:", "o": ["Upper class boundaries and cumulative frequencies", "Lower class boundaries only", "Midpoints only", "Frequencies only"], "a": 0, "e": "Each point uses the upper boundary of a class against its running total."}, {"q": "Lower quartile = 8, median = 15, upper quartile = 22. Find the interquartile range.", "o": ["14", "30", "7", "22"], "a": 0, "e": "22 − 8 = 14."}, {"q": "A cumulative frequency table's last value should always equal:", "o": ["The total frequency", "Zero", "The median", "The mode"], "a": 0, "e": "The running total reaches the full sample size by the end."}, {"q": "The interquartile range is a measure of:", "o": ["Spread", "Average", "Mode", "Total"], "a": 0, "e": "It describes how spread out the middle 50% of the data is."}, {"q": "On a box plot, a dot drawn separately beyond the whisker usually represents a(n):", "o": ["Outlier", "The median", "The mean", "The mode"], "a": 0, "e": "Outliers are often plotted individually rather than included in the whisker."}, {"q": "If the upper quartile is 30 and the lower quartile is 18, find the interquartile range.", "o": ["12", "48", "15", "9"], "a": 0, "e": "30 − 18 = 12."}, {"q": "A cumulative frequency graph can be used to estimate the:", "o": ["Median and quartiles", "Mode only", "Mean only", "Range only exactly"], "a": 0, "e": "These values are read directly from the curve."}]}, "11": {"Standard deviation and variance": [{"q": "Standard deviation measures:", "o": ["The spread of data around the mean", "The middle value", "The most common value", "The total of all values"], "a": 0, "e": "It shows how much the data varies from the mean."}, {"q": "A data set with a small standard deviation means the data is:", "o": ["Close to the mean", "Far from the mean", "Symmetric only", "Skewed only"], "a": 0, "e": "A small spread means values cluster near the mean."}, {"q": "Variance is calculated as:", "o": ["The square of the standard deviation", "The square root of the standard deviation", "The mean of the data", "The range of the data"], "a": 0, "e": "Variance and standard deviation are related by squaring."}, {"q": "Find the mean of 2, 4, 6, 8 (needed as a first step to calculate standard deviation).", "o": ["5", "6", "4", "8"], "a": 0, "e": "Sum = 20, and 20 ÷ 4 = 5."}, {"q": "If all values in a data set are identical, the standard deviation is:", "o": ["0", "1", "Undefined", "Equal to the mean"], "a": 0, "e": "There is no spread when every value is the same."}, {"q": "A larger standard deviation indicates:", "o": ["Greater spread of data", "Smaller spread of data", "A higher mean", "A lower mean"], "a": 0, "e": "More variation from the mean gives a larger standard deviation."}, {"q": "Standard deviation is the square root of the:", "o": ["Variance", "Mean", "Median", "Range"], "a": 0, "e": "Standard deviation = √variance."}, {"q": "Two classes have the same mean score. Class A has a smaller standard deviation than Class B. This means:", "o": ["Class A's scores are more consistent", "Class B's scores are more consistent", "Both classes are identical", "Class A has a higher mean"], "a": 0, "e": "A smaller standard deviation means less variation around the mean."}, {"q": "A data set is spread far from its mean. This means the standard deviation is:", "o": ["Large", "Small", "Zero", "Negative"], "a": 0, "e": "Greater spread gives a larger standard deviation."}, {"q": "Can standard deviation ever be negative?", "o": ["No, it is always ≥ 0", "Yes, always", "Only for small data sets", "Only if the mean is negative"], "a": 0, "e": "Standard deviation comes from a square root, so it cannot be negative."}, {"q": "Two data sets have the same range but different standard deviations. What does this tell you?", "o": ["Their spread around the mean differs", "They must have the same mean", "They are identical sets", "Nothing useful"], "a": 0, "e": "Range only looks at the extremes, while standard deviation reflects the whole spread."}, {"q": "Which is affected more by outliers: the range or the standard deviation?", "o": ["The range", "The standard deviation", "Both equally not affected", "Neither"], "a": 0, "e": "The range depends only on the two extreme values."}, {"q": "If every value in a data set is increased by 10, the standard deviation:", "o": ["Stays the same", "Increases by 10", "Doubles", "Becomes zero"], "a": 0, "e": "Shifting every value by the same amount does not change the spread."}, {"q": "If every value in a data set is doubled, the standard deviation:", "o": ["Doubles", "Stays the same", "Is halved", "Becomes zero"], "a": 0, "e": "Scaling every value scales the spread by the same factor."}, {"q": "Which formula gives the variance?", "o": ["The mean of the squared deviations from the mean", "The square root of the mean", "The range divided by 2", "The mode squared"], "a": 0, "e": "Variance is the average of the squared differences from the mean."}, {"q": "A data set with standard deviation 0 means:", "o": ["All values are identical", "The data is highly spread", "The mean is 0", "The data has no values"], "a": 0, "e": "No spread means every value equals the mean."}, {"q": "Which data set likely has the larger standard deviation: {5,5,5,5} or {1,5,9,13}?", "o": ["{1,5,9,13}", "{5,5,5,5}", "Both equal", "Cannot tell"], "a": 0, "e": "The second set has much more variation around its mean."}, {"q": "Standard deviation is useful because it:", "o": ["Uses every value in the data set", "Only uses the extremes", "Ignores most of the data", "Only works for small sets"], "a": 0, "e": "Every data point contributes to the calculation."}, {"q": "If a class has a standard deviation of 2 and another has 8, which class is more varied?", "o": ["The class with standard deviation 8", "The class with standard deviation 2", "Both equally varied", "Cannot tell"], "a": 0, "e": "A larger standard deviation means greater spread."}, {"q": "Which has a larger standard deviation: a class with scores all close to 50, or a class with scores from 0 to 100?", "o": ["The class with scores from 0 to 100", "The class with scores close to 50", "Both equal", "Cannot tell"], "a": 0, "e": "Greater spread of values gives a larger standard deviation."}, {"q": "Standard deviation is always measured in:", "o": ["The same units as the original data", "Squared units", "Percentages only", "No units"], "a": 0, "e": "Taking the square root returns it to the original units."}, {"q": "Variance is measured in:", "o": ["Squared units of the original data", "The same units as the original data", "Percentages", "No units"], "a": 0, "e": "Variance comes from squared deviations, so its units are squared too."}, {"q": "A teacher wants to know how consistent her students' test scores are. She should calculate the:", "o": ["Standard deviation", "Mode only", "Total only", "Number of students"], "a": 0, "e": "Standard deviation directly measures consistency around the mean."}, {"q": "If a data set has mean 20 and standard deviation 3, most values typically fall:", "o": ["Close to 20, roughly within a few units", "Exactly at 20", "Far from 20", "At 0"], "a": 0, "e": "A small standard deviation means values cluster near the mean."}]}, "12": {"Histograms and frequency density": [{"q": "In a histogram, the area of each bar represents:", "o": ["The frequency", "The frequency density", "The class width", "The mean"], "a": 0, "e": "Area, not height alone, shows the frequency in a histogram."}, {"q": "Frequency density is calculated as:", "o": ["Frequency ÷ class width", "Frequency × class width", "Class width ÷ frequency", "Frequency + class width"], "a": 0, "e": "This adjusts for classes of different widths."}, {"q": "Unlike a bar chart, a histogram has:", "o": ["No gaps between bars (for continuous data)", "Always equal bar widths", "Only 2 bars", "Gaps between every bar"], "a": 0, "e": "Histograms represent continuous data with touching bars."}, {"q": "A class has frequency 12 and width 4. Find its frequency density.", "o": ["3", "8", "16", "48"], "a": 0, "e": "12 ÷ 4 = 3."}, {"q": "A class has frequency density 5 and width 3. Find its frequency.", "o": ["15", "8", "2", "1.67"], "a": 0, "e": "5 × 3 = 15."}, {"q": "In a histogram, a taller bar with the same width as others means:", "o": ["A higher frequency density", "A lower frequency density", "Nothing about frequency", "A wider class"], "a": 0, "e": "Height corresponds directly to frequency density when widths are equal."}, {"q": "Why are histograms used instead of bar charts for continuous data?", "o": ["To show data on a continuous scale without gaps", "To make the data look nicer", "Because frequencies must be equal", "Because the x-axis must be categorical"], "a": 0, "e": "Continuous data flows without natural gaps between categories."}, {"q": "A class has width 10 and frequency density 2. Find its frequency.", "o": ["20", "5", "12", "8"], "a": 0, "e": "2 × 10 = 20."}, {"q": "A histogram has a class 10-30 with frequency density 4. Find the frequency.", "o": ["80", "20", "4", "120"], "a": 0, "e": "Frequency = frequency density × class width = 4 × 20 = 80."}, {"q": "A class has frequency 50 and frequency density 10. Find the class width.", "o": ["5", "10", "50", "500"], "a": 0, "e": "Width = frequency ÷ frequency density = 50 ÷ 10 = 5."}, {"q": "In a histogram, which axis shows frequency density?", "o": ["The vertical axis", "The horizontal axis", "Neither axis", "Both axes"], "a": 0, "e": "The height of each bar represents frequency density."}, {"q": "Two classes have the same frequency but different widths. Which has the greater frequency density?", "o": ["The narrower class", "The wider class", "Both equal", "Cannot tell"], "a": 0, "e": "Dividing the same frequency by a smaller width gives a larger density."}, {"q": "A histogram bar has width 5 and height (frequency density) 6. Find the area (frequency) of the bar.", "o": ["30", "11", "1.2", "25"], "a": 0, "e": "Area = width × height = 5 × 6 = 30."}, {"q": "Why can't you read frequency directly from the height of a histogram bar?", "o": ["Because height shows frequency density, not frequency, when widths differ", "Because histograms don't show frequency at all", "Because bars must always be equal width", "Because frequency is always zero"], "a": 0, "e": "Frequency is represented by area, which combines height and width."}, {"q": "A histogram has two classes: one with width 5 and frequency 20, another with width 10 and frequency 20. Which has the greater frequency density?", "o": ["The width-5 class", "The width-10 class", "Both equal", "Cannot tell"], "a": 0, "e": "20 ÷ 5 = 4, which is greater than 20 ÷ 10 = 2."}, {"q": "In a histogram, if class width doubles but frequency stays the same, frequency density:", "o": ["Is halved", "Doubles", "Stays the same", "Becomes zero"], "a": 0, "e": "Dividing the same frequency by a larger width gives a smaller density."}, {"q": "A histogram bar has area 40 and width 8. Find its frequency density.", "o": ["5", "32", "48", "320"], "a": 0, "e": "Frequency density = area ÷ width = 40 ÷ 8 = 5."}, {"q": "Why must histogram bars be drawn with areas (not heights) proportional to frequency?", "o": ["Because class widths can differ", "Because all classes always have equal width", "Because frequency density is always 1", "Because histograms never use frequency"], "a": 0, "e": "Unequal widths mean height alone would misrepresent the frequency."}, {"q": "A class has frequency density 7 and frequency 35. Find its width.", "o": ["5", "7", "35", "245"], "a": 0, "e": "Width = frequency ÷ frequency density = 35 ÷ 7 = 5."}, {"q": "A histogram shows unequal class widths. The tallest bar does NOT necessarily mean:", "o": ["The highest frequency", "The highest frequency density", "A continuous variable", "A valid histogram"], "a": 0, "e": "Height shows frequency density, which can differ from actual frequency."}, {"q": "A class has frequency 18 and width 6. Find its frequency density.", "o": ["3", "12", "24", "108"], "a": 0, "e": "18 ÷ 6 = 3."}, {"q": "If two classes have the same frequency density but different widths, the one with the greater width has:", "o": ["A greater frequency", "A smaller frequency", "The same frequency", "No frequency"], "a": 0, "e": "Frequency = density × width, so a larger width gives a larger frequency."}, {"q": "A histogram's total area under all bars represents:", "o": ["The total frequency", "Zero", "The mean", "The mode"], "a": 0, "e": "Each bar's area is a class's frequency, so the total area is the overall count."}, {"q": "A class has frequency density 4 and frequency 24. Find its class width.", "o": ["6", "4", "24", "96"], "a": 0, "e": "24 ÷ 4 = 6."}]}, "13": {"Correlation coefficient and regression": [{"q": "The product-moment correlation coefficient r ranges between:", "o": ["−1 and 1", "0 and 1", "0 and 100", "−100 and 100"], "a": 0, "e": "Correlation coefficients always fall within this range."}, {"q": "A correlation coefficient of r = 1 indicates:", "o": ["Perfect positive correlation", "Perfect negative correlation", "No correlation", "Weak correlation"], "a": 0, "e": "All points lie exactly on an upward sloping line."}, {"q": "A correlation coefficient of r = −1 indicates:", "o": ["Perfect negative correlation", "Perfect positive correlation", "No correlation", "Weak correlation"], "a": 0, "e": "All points lie exactly on a downward sloping line."}, {"q": "A correlation coefficient of r = 0 indicates:", "o": ["No linear correlation", "Perfect correlation", "Strong correlation", "Negative correlation"], "a": 0, "e": "There is no straight-line relationship between the variables."}, {"q": "The line of regression is used to:", "o": ["Predict values of one variable from another", "Show frequency only", "Replace the need for data", "Show the mode"], "a": 0, "e": "It models the relationship to make predictions."}, {"q": "If r = 0.9, the correlation is best described as:", "o": ["Strong positive", "Strong negative", "Weak positive", "No correlation"], "a": 0, "e": "A value close to 1 indicates a strong positive relationship."}, {"q": "A scatter graph with points forming a near-perfect upward line would have r close to:", "o": ["1", "0", "−1", "0.5"], "a": 0, "e": "Points lying almost exactly on an upward line give r close to 1."}, {"q": "A scatter graph with points forming a near-perfect downward line would have r close to:", "o": ["−1", "1", "0", "0.5"], "a": 0, "e": "Points lying almost exactly on a downward line give r close to −1."}, {"q": "Which value of r shows the weakest correlation?", "o": ["0.05", "0.9", "−0.95", "1"], "a": 0, "e": "A value near 0 shows almost no linear relationship."}, {"q": "If r = −0.8, the correlation is best described as:", "o": ["Strong negative", "Strong positive", "Weak negative", "No correlation"], "a": 0, "e": "A value close to −1 indicates a strong negative relationship."}, {"q": "The equation of a regression line is typically written in the form:", "o": ["y = mx + c", "y = x²", "x = y²", "y = 1/x"], "a": 0, "e": "This is the standard linear equation form."}, {"q": "Using a line of regression to predict values far outside the original data range is called:", "o": ["Extrapolation", "Interpolation", "Correlation", "Regression only"], "a": 0, "e": "Extrapolation goes beyond the known data range."}, {"q": "Using a line of regression to predict values within the original data range is called:", "o": ["Interpolation", "Extrapolation", "Causation", "Deviation"], "a": 0, "e": "Interpolation stays within the known data range."}, {"q": "A correlation coefficient of r = 0.3 suggests:", "o": ["A weak positive correlation", "A strong positive correlation", "A perfect correlation", "A negative correlation"], "a": 0, "e": "A small positive value shows only a weak relationship."}, {"q": "Why is extrapolation generally considered less reliable than interpolation?", "o": ["It predicts beyond the range of known data", "It uses too much data", "It only works with negative correlation", "It requires no data at all"], "a": 0, "e": "The relationship may not continue to hold outside the observed range."}, {"q": "If two variables have r = 0, this means there is:", "o": ["No linear relationship (though another kind might exist)", "Definitely no relationship at all", "A perfect relationship", "An inverse relationship"], "a": 0, "e": "A correlation of 0 only rules out a straight-line relationship."}, {"q": "Which value of r indicates a moderate positive correlation?", "o": ["0.5", "0.05", "−0.5", "0"], "a": 0, "e": "A mid-range positive value shows a moderate upward relationship."}, {"q": "A correlation coefficient close to 0 but not exactly 0 suggests:", "o": ["A very weak linear relationship", "A very strong relationship", "No data was collected", "An error in calculation"], "a": 0, "e": "Values near 0 show little to no straight-line pattern."}, {"q": "The regression line is sometimes called the:", "o": ["Line of best fit", "Line of worst fit", "Median line", "Mode line"], "a": 0, "e": "It is chosen to best represent the overall trend in the data."}, {"q": "If a regression line has equation y = 2x + 3, what is y when x = 4?", "o": ["11", "8", "14", "7"], "a": 0, "e": "y = 2(4) + 3 = 11."}, {"q": "A strong correlation between ice cream sales and sunburn cases is most likely explained by:", "o": ["A third factor (hot weather) affecting both", "Ice cream causing sunburn", "Sunburn causing ice cream sales", "No explanation is possible"], "a": 0, "e": "Hot weather increases both ice cream sales and sunburn risk independently."}, {"q": "A correlation coefficient of r = 0.95 suggests:", "o": ["A very strong positive correlation", "A very weak correlation", "A negative correlation", "No correlation"], "a": 0, "e": "A value close to 1 shows a very strong upward relationship."}, {"q": "A correlation coefficient of r = −0.1 suggests:", "o": ["A very weak negative correlation", "A strong negative correlation", "A strong positive correlation", "No data collected"], "a": 0, "e": "A value close to 0 shows little linear relationship."}, {"q": "Which scenario is an example of interpolation?", "o": ["Predicting a value within the range of collected data", "Predicting a value far beyond the data", "Guessing with no data", "Ignoring the regression line"], "a": 0, "e": "Interpolation stays inside the range that was actually measured."}, {"q": "If a regression line has equation y = −3x + 10, find y when x = 2.", "o": ["4", "16", "−4", "13"], "a": 0, "e": "y = −3(2) + 10 = 4."}, {"q": "A high correlation coefficient between two variables should always be checked for:", "o": ["A sensible real-world explanation (not just coincidence)", "Nothing further", "The mode", "The range only"], "a": 0, "e": "Correlation alone does not confirm a meaningful cause-and-effect link."}]}}}, {"id": "prob", "name": "Probability", "lv": {"6": {"Basic probability and the probability scale": [{"q": "A bag has 3 red and 7 blue counters. Find P(red).", "o": ["3/7", "1/3", "7/10", "3/10"], "a": 3, "e": "3 red out of 10 counters."}, {"q": "What is the probability of rolling a 4 on a fair dice?", "o": ["1/4", "1/2", "4/6", "1/6"], "a": 3, "e": "One outcome out of six."}, {"q": "P(rain) = 0.35. Find P(no rain).", "o": ["0.35", "0.55", "0.75", "0.65"], "a": 3, "e": "1 − 0.35 = 0.65."}, {"q": "Three outcomes have probabilities 0.2, 0.5 and x. Find x.", "o": ["0.7", "0.25", "0.2", "0.3"], "a": 3, "e": "Probabilities sum to 1."}, {"q": "What is the probability of an impossible event?", "o": ["1", "−1", "0.5", "0"], "a": 3, "e": "Impossible events never happen."}, {"q": "A 4 sided spinner has probabilities 0.27, 0.18, ? and 0.32 for 1 to 4. Find the missing probability.", "o": ["0.77", "0.23", "0.33", "0.13"], "a": 1, "e": "1 − 0.77 = 0.23."}, {"q": "The probability of picking a red sweet is 0.05. Find the probability of not picking a red sweet.", "o": ["0.05", "0.9", "0.95", "0.85"], "a": 2, "e": "1 − 0.05."}, {"q": "A 4 faced dice has probabilities 0.17, ?, 0.28 and 0.31 for 1 to 4. Find P(2).", "o": ["0.76", "0.24", "0.34", "0.14"], "a": 1, "e": "1 − 0.76 = 0.24."}, {"q": "The probability that it rains tomorrow is 0.47. Find the probability that it does not rain.", "o": ["0.47", "0.63", "0.43", "0.53"], "a": 3, "e": "1 − 0.47."}, {"q": "The probability that a train is late is 0.15. Find the probability that it is not late.", "o": ["0.85", "0.15", "0.75", "0.95"], "a": 0, "e": "1 − 0.15."}, {"q": "The probability that Jane wins a game is 7/10. Find the probability that she does not win.", "o": ["3/10", "7/10", "3/7", "1/10"], "a": 0, "e": "1 − 7/10."}, {"q": "Francesca spins a 4 sided spinner. P(1) = 0.18, P(2) = 0.21, P(3) = 0.37. Find P(4).", "o": ["0.76", "0.34", "0.14", "0.24"], "a": 3, "e": "1 − 0.76."}, {"q": "Cheng spins a fair 6 sided spinner numbered 1 to 6. Find the probability it lands on 4.", "o": ["1/4", "4/6", "1/2", "1/6"], "a": 3, "e": "One outcome out of six."}, {"q": "A coin is flipped. What is the probability of getting heads?", "o": ["1/4", "1/3", "1/2", "1"], "a": 2, "e": "A coin has 2 equally likely outcomes."}, {"q": "A die is rolled. What is the probability of getting a 6?", "o": ["1/6", "1/3", "1/2", "6"], "a": 0, "e": "There is 1 favourable outcome out of 6."}, {"q": "A bag has 3 red and 2 blue balls. What is the probability of picking red?", "o": ["2/5", "3/5", "1/2", "3/2"], "a": 1, "e": "3 red out of 5 balls in total."}, {"q": "Which probability means an event is certain?", "o": ["0", "1/2", "1", "2"], "a": 2, "e": "A probability of 1 means the event will definitely happen."}, {"q": "Which probability means an event is impossible?", "o": ["0", "1/2", "1", "−1"], "a": 0, "e": "A probability of 0 means the event cannot happen."}, {"q": "A spinner has 4 equal sections numbered 1–4. What is P(landing on 3)?", "o": ["1/2", "1/3", "1/4", "3/4"], "a": 2, "e": "There is 1 favourable outcome out of 4 equal sections."}, {"q": "A bag has 10 marbles, 4 are green. What is P(green)?", "o": ["2/5", "4/10", "Both A and B are correct", "1/4"], "a": 2, "e": "4/10 simplifies to 2/5, so both forms are correct."}, {"q": "If P(rain) = 0.3, what is P(no rain)?", "o": ["0.3", "0.7", "1.3", "0"], "a": 1, "e": "Probabilities of an event and its opposite add to 1: 1 − 0.3 = 0.7."}, {"q": "A die is rolled. What is P(an even number)?", "o": ["1/6", "1/3", "1/2", "2/3"], "a": 2, "e": "There are 3 even numbers (2, 4, 6) out of 6."}, {"q": "A box has 5 red and 5 blue counters. What is P(blue)?", "o": ["1/10", "1/5", "1/2", "5"], "a": 2, "e": "5 blue out of 10 counters in total."}, {"q": "The probability of picking a green pen from a box is 0.23. Find the probability of not picking a green pen.", "o": ["0.23", "0.67", "0.87", "0.77"], "a": 3, "e": "Probabilities add to 1: 1 − 0.23 = 0.77."}, {"q": "The probability that it rains tomorrow is 0.08. Find the probability that it does not rain tomorrow.", "o": ["0.08", "0.82", "0.98", "0.92"], "a": 3, "e": "1 − 0.08 = 0.92."}, {"q": "There are 15 cars in a car park and 2 are blue. One car is picked at random. Find the probability that it is not blue.", "o": ["2/15", "13/15", "13/2", "2/13"], "a": 1, "e": "13 cars are not blue out of 15."}, {"q": "A bag contains 24 beads and 8 of them are yellow. One bead is picked at random. Find the probability that it is not yellow.", "o": ["1/3", "2/3", "1/2", "3/4"], "a": 1, "e": "16 beads are not yellow: 16/24 = 2/3."}, {"q": "Seven cards show the letters B, A, N, A, N, A, S. A card is picked at random. Find the probability that it shows the letter A.", "o": ["3/7", "1/7", "3/4", "4/7"], "a": 0, "e": "Three of the 7 cards show A."}, {"q": "Seven cards show the letters B, A, N, A, N, A, S. A card is picked at random. Find the probability that it shows the letter Z.", "o": ["1/7", "1", "1/2", "0"], "a": 3, "e": "There is no Z, so the event is impossible and has probability 0."}, {"q": "The probability that a toy picked from a box is wooden is 0.7. Find the probability that it is not wooden.", "o": ["0.3", "0.7", "0.37", "0.03"], "a": 0, "e": "1 − 0.7 = 0.3."}, {"q": "A fair dice is rolled. Find the probability of getting a number greater than 4.", "o": ["1/6", "2/3", "1/2", "1/3"], "a": 3, "e": "The numbers 5 and 6 work, so 2/6 = 1/3."}]}, "7": {"Basic probability and the probability scale": [{"q": "A vase holds red, pink and white flowers. The probability that a flower is not red is 0.8 and the probability that it is not pink is 0.7. Find the probability that a flower picked at random is white.", "o": ["0.5", "0.1", "0.25", "0.3"], "a": 0, "e": "P(red) = 0.2 and P(pink) = 0.3, so P(white) = 1 − 0.2 − 0.3 = 0.5."}, {"q": "In a game you can win, lose or draw. The probability of winning is 0.4 and of losing is 0.35. Find the probability of a draw.", "o": ["0.25", "0.75", "0.05", "0.35"], "a": 0, "e": "1 − 0.4 − 0.35 = 0.25."}, {"q": "There are 40 cars in a car park and 5 are blue. A pie chart shows this information. Find the angle of the sector for the blue cars.", "o": ["5°", "45°", "40°", "90°"], "a": 1, "e": "5/40 × 360° = 45°."}, {"q": "The probability that Jacinda wins a game is 0.4. She is twice as likely to draw as to lose. Find the probability that she loses.", "o": ["0.3", "0.2", "0.6", "0.15"], "a": 1, "e": "Draw + lose = 0.6, and draw = 2 × lose, so 3 × lose = 0.6 and lose = 0.2."}]}, "8": {"Basic probability and the probability scale": [{"q": "Yasmin has 4 white, 3 red and x yellow flowers. P(white) = 1/5. Find P(yellow).", "o": ["13/20", "13", "7/20", "1/5"], "a": 0, "e": "Total = 4 × 5 = 20, so x = 13 and P = 13/20."}, {"q": "A bag has 35 counters: 6 pink, 8 blue and the rest green or yellow. P(green) = 2/7. How many yellow counters are there?", "o": ["10", "11", "21", "6"], "a": 1, "e": "Green = 10. Rest = 35 − 14 = 21, so yellow = 11."}, {"q": "A card is drawn from a standard deck of 52. What is P(a King)?", "o": ["1/13", "1/52", "4/13", "1/4"], "a": 0, "e": "There are 4 Kings out of 52 cards: 4/52 = 1/13."}, {"q": "A bag has 6 red and 4 blue balls. What is P(not blue)?", "o": ["2/5", "3/5", "4/10", "6/4"], "a": 1, "e": "6 non-blue balls out of 10 in total: 6/10 = 3/5."}, {"q": "P(A) = 0.6. Find P(not A).", "o": ["0.4", "0.6", "1.4", "0"], "a": 0, "e": "1 − 0.6 = 0.4."}, {"q": "A die is rolled twice. How many total outcomes are there?", "o": ["6", "12", "36", "72"], "a": 2, "e": "6 outcomes for each roll: 6 × 6 = 36."}, {"q": "Two coins are flipped. What is P(both heads)?", "o": ["1/2", "1/3", "1/4", "1/8"], "a": 2, "e": "There are 4 equally likely outcomes, and only 1 is HH."}], "Experimental probability and relative frequency": [{"q": "In a class of 30, 7 students are left handed. Find the expected number of left handed students in a school of 960.", "o": ["210", "224", "7", "240"], "a": 1, "e": "960 ÷ 30 × 7 = 32 × 7."}, {"q": "In a survey of 1200 people, 150 are left handed. Find the expected number of left handed people in a town of 56 000.", "o": ["7000", "6500", "8400", "1500"], "a": 0, "e": "150/1200 = 1/8, and 56 000 ÷ 8."}, {"q": "The probability that a car is faulty is 0.04. How many of 850 cars are expected to be faulty?", "o": ["40", "3.4", "34", "85"], "a": 2, "e": "0.04 × 850 = 34."}, {"q": "In a group of 650 people, 117 are left handed. Find the expected number in a group of 5000.", "o": ["585", "900", "750", "1170"], "a": 1, "e": "117/650 = 0.18, and 0.18 × 5000 = 900."}, {"q": "The relative frequency of games won is 0.1. The number lost is twice the number drawn. Find the relative frequency of games lost.", "o": ["0.6", "0.3", "0.9", "0.45"], "a": 0, "e": "Lost + drawn = 0.9, split 2 : 1, so lost = 0.6."}, {"q": "A coin is flipped 50 times and lands heads 28 times. Find the relative frequency of heads.", "o": ["0.5", "0.56", "0.28", "0.44"], "a": 1, "e": "28 ÷ 50 = 0.56."}, {"q": "A die is rolled 60 times. A 6 appears 8 times. Find the experimental probability of rolling a 6.", "o": ["2/15", "1/6", "1/8", "4/15"], "a": 0, "e": "8 ÷ 60 simplifies to 2/15."}, {"q": "A spinner is spun 100 times and lands blue 35 times. Estimate the probability of blue next spin.", "o": ["0.35", "0.5", "0.65", "0.135"], "a": 0, "e": "35 ÷ 100 = 0.35."}, {"q": "The more times an experiment is repeated, the closer the relative frequency gets to:", "o": ["Zero", "The theoretical probability", "One", "The sample size"], "a": 1, "e": "With more trials, the experimental result approaches the true probability."}, {"q": "A bag of unknown balls is sampled 40 times; red appears 10 times. Estimate P(red).", "o": ["1/4", "1/10", "1/40", "4"], "a": 0, "e": "10 ÷ 40 = 1/4."}, {"q": "A dice is suspected to be biased. It is rolled 200 times and shows a 6 fifty times. What is the experimental probability of rolling a 6?", "o": ["1/6", "1/4", "1/5", "1/2"], "a": 1, "e": "50 ÷ 200 = 0.25 = 1/4."}, {"q": "Which gives a more reliable estimate of probability?", "o": ["More trials", "Fewer trials", "Only 1 trial", "It does not matter"], "a": 0, "e": "A larger sample reduces the effect of random variation."}, {"q": "Samira picks one card at random from cards numbered 1 to 7 and replaces it. Find the probability that she picks an odd number.", "o": ["3/7", "4/7", "1/2", "2/3"], "a": 1, "e": "The odd cards are 1, 3, 5 and 7: 4 out of 7."}, {"q": "Samira picks a card at random from cards numbered 1 to 7 and replaces it. She repeats this 35 times. How many times is she expected to pick an odd number?", "o": ["18", "20", "15", "35"], "a": 1, "e": "4/7 × 35 = 20."}, {"q": "The probability that a spinner lands on C is 0.45. The spinner is spun 60 times. How many times is it expected to land on C?", "o": ["27", "45", "15", "33"], "a": 0, "e": "0.45 × 60 = 27."}, {"q": "The probability that Pryanka wins a game is 0.4. She plays 80 games. How many games is she expected to win?", "o": ["40", "48", "8", "32"], "a": 3, "e": "0.4 × 80 = 32."}, {"q": "In a survey of 60 employees, 9 cycle to work. The company has 1200 employees. How many employees are expected to cycle to work?", "o": ["180", "120", "18", "150"], "a": 0, "e": "9/60 = 3/20, and 3/20 × 1200 = 180."}, {"q": "In a survey of 50 people, 8 walk to work. A town has 2000 workers. How many are expected to walk to work?", "o": ["320", "160", "400", "250"], "a": 0, "e": "8/50 = 4/25, and 4/25 × 2000 = 320."}, {"q": "A bag contains 7 white balls and 3 black balls. A ball is picked at random and replaced. This is repeated 100 times. How many white balls are expected?", "o": ["7", "30", "10", "70"], "a": 3, "e": "7/10 × 100 = 70."}, {"q": "A box of toys is wooden, plastic or metal. The probability that a toy is wooden is 0.7. There are 9 plastic toys and 6 metal toys. How many wooden toys are there?", "o": ["35", "15", "21", "50"], "a": 0, "e": "Plastic and metal make 0.3 of the toys. 15 toys is 0.3, so there are 50 toys and 0.7 × 50 = 35 are wooden."}, {"q": "A coin is flipped 200 times and lands on heads 90 times. What is the relative frequency of heads?", "o": ["0.55", "0.9", "0.45", "0.09"], "a": 2, "e": "Relative frequency = 90 ÷ 200 = 0.45."}], "Combined events and sample spaces": [{"q": "Two coins are tossed. How many equally likely outcomes are there?", "o": ["2", "8", "3", "4"], "a": 3, "e": "HH, HT, TH, TT."}, {"q": "Two fair dice are rolled. How many outcomes are in the sample space?", "o": ["12", "18", "6", "36"], "a": 3, "e": "6 × 6 = 36."}, {"q": "Two coins are tossed. Find P(two heads).", "o": ["1/2", "2/4", "1/3", "1/4"], "a": 3, "e": "One outcome out of four."}, {"q": "A coin and a die are used together. How many possible outcomes are there?", "o": ["6", "8", "12", "18"], "a": 2, "e": "2 coin outcomes × 6 die outcomes = 12."}, {"q": "Two dice are rolled. What is P(both show a 1)?", "o": ["1/6", "1/12", "1/36", "2/6"], "a": 2, "e": "Each die has P(1) = 1/6, so 1/6 × 1/6 = 1/36."}, {"q": "A bag has 2 red and 3 blue balls. One is drawn, replaced, then another is drawn. Find P(red then blue).", "o": ["6/25", "5/25", "2/5", "3/5"], "a": 0, "e": "P(red) × P(blue) = 2/5 × 3/5 = 6/25."}, {"q": "Using a sample space diagram, how many outcomes are there for rolling two dice?", "o": ["12", "24", "36", "6"], "a": 2, "e": "Each die has 6 outcomes: 6 × 6 = 36."}, {"q": "A coin is flipped 3 times. How many possible outcomes are there?", "o": ["3", "6", "8", "9"], "a": 2, "e": "2 × 2 × 2 = 8."}, {"q": "Events A and B are mutually exclusive. What is P(A and B)?", "o": ["0", "1", "P(A) × P(B)", "P(A) + P(B)"], "a": 0, "e": "Mutually exclusive events cannot happen at the same time."}, {"q": "If two events are independent, P(A and B) = ?", "o": ["P(A) + P(B)", "P(A) − P(B)", "P(A) × P(B)", "P(A) / P(B)"], "a": 2, "e": "For independent events, multiply the individual probabilities."}, {"q": "Two fair dice are rolled. Find the probability that both show a number greater than 4.", "o": ["1/9", "1/3", "1/18", "4/9"], "a": 0, "e": "P(greater than 4) = 2/6 = 1/3 for each dice, so 1/3 × 1/3 = 1/9."}, {"q": "Sarah rolls a fair dice twice. Find the probability that she rolls a number greater than 2 both times.", "o": ["2/3", "4/9", "8/9", "1/3"], "a": 1, "e": "P(greater than 2) = 4/6 = 2/3, so 2/3 × 2/3 = 4/9."}, {"q": "Two fair dice are rolled and the scores are added. Find the probability that the total is 7.", "o": ["1/12", "1/6", "7/36", "1/7"], "a": 1, "e": "There are 6 ways to make 7 out of 36 outcomes: 1/6."}, {"q": "One number is chosen at random from 5, 10 and 15, and another from 4, 5 and 6. The two numbers are added. How many of the 9 possible totals are odd?", "o": ["4", "5", "3", "6"], "a": 1, "e": "The totals are 9, 10, 11, 14, 15, 16, 19, 20, 21. The odd ones are 9, 11, 15, 19, 21."}, {"q": "One number is chosen at random from 5, 10 and 15, and another from 4, 5 and 6. The two numbers are added. Find the probability that the total is 15.", "o": ["1/3", "2/9", "1/9", "1/6"], "a": 2, "e": "Only 10 + 5 gives 15, so 1 out of 9."}, {"q": "Three fair coins are tossed. Find the probability of exactly two heads.", "o": ["1/8", "1/2", "3/8", "3/4"], "a": 2, "e": "The outcomes HHT, HTH and THH give 3 out of 8."}]}, "9": {"Tree diagrams": [{"q": "P(rain) = 0.3 each day, independently. Find P(rain on both days).", "o": ["0.6", "0.9", "0.3", "0.09"], "a": 3, "e": "0.3 × 0.3 = 0.09."}, {"q": "A bag has 2 red and 3 blue counters. Two are taken without replacement. Find P(both red).", "o": ["4/25", "1/5", "2/5", "1/10"], "a": 3, "e": "2/5 × 1/4 = 1/10."}, {"q": "A coin is tossed twice. Find P(head then tail).", "o": ["1/2", "2/4", "1/3", "1/4"], "a": 3, "e": "1/2 × 1/2 = 1/4."}, {"q": "A box has 7 red and 8 brown counters. One is picked, replaced, then another is picked. Find P(two brown).", "o": ["8/15", "64/225", "56/210", "16/30"], "a": 1, "e": "8/15 × 8/15."}, {"q": "A bag has 5 red and 3 blue balls. A ball is taken and replaced, twice. Find P(both blue).", "o": ["3/8", "6/56", "9/64", "3/7"], "a": 2, "e": "3/8 × 3/8."}, {"q": "A bag has 3 red and 2 blue balls. One ball is drawn, not replaced, then another is drawn. Find P(both red).", "o": ["3/10", "6/20", "9/25", "3/5"], "a": 0, "e": "3/5 × 2/4 = 6/20, which simplifies to 3/10."}, {"q": "A bag has 4 yellow and 6 green balls. One is drawn, replaced, then another is drawn. Find P(both yellow).", "o": ["4/25", "2/5", "16/100", "1/4"], "a": 0, "e": "4/10 × 4/10 = 16/100, which simplifies to 4/25."}, {"q": "A spinner has 3 red and 1 blue sections and is spun twice. Find P(both blue).", "o": ["1/16", "1/8", "1/4", "1/2"], "a": 0, "e": "1/4 × 1/4 = 1/16."}, {"q": "A box has 5 pens: 2 blue, 3 black. Two are drawn without replacement. Find P(both black).", "o": ["3/10", "6/25", "3/5", "9/20"], "a": 0, "e": "3/5 × 2/4 = 6/20, which simplifies to 3/10."}, {"q": "A tree diagram for two events, each with 2 outcomes, has how many final branches?", "o": ["2", "4", "6", "8"], "a": 1, "e": "2 × 2 = 4 final branches."}, {"q": "A bag has 3 red, 2 green balls. One is drawn without replacement, then a second. Find P(one red, one green, in any order).", "o": ["12/20", "6/20", "3/20", "3/10"], "a": 0, "e": "Add both orders: (3/5 × 2/4) + (2/5 × 3/4) = 6/20 + 6/20 = 12/20."}, {"q": "A coin is flipped, then a die rolled. Find P(heads and an even number).", "o": ["1/4", "1/3", "1/2", "1/6"], "a": 0, "e": "P(heads) × P(even) = 1/2 × 1/2 = 1/4."}, {"q": "A bag has 7 balls: 4 red, 3 blue. Two balls are drawn without replacement. Find P(first red, second blue).", "o": ["2/7", "12/42", "4/21", "1/3"], "a": 0, "e": "4/7 × 3/6 = 12/42, which simplifies to 2/7."}, {"q": "A bag contains 6 red marbles, 3 green marbles and 1 blue marble. Two marbles are picked at random with replacement. Find the probability that both are green.", "o": ["9/100", "3/10", "1/15", "9/10"], "a": 0, "e": "With replacement, 3/10 × 3/10 = 9/100."}, {"q": "A bag contains 4 red counters and 2 yellow counters. Two counters are picked at random without replacement. Find the probability that at least one is yellow.", "o": ["2/5", "1/15", "3/5", "4/9"], "a": 2, "e": "P(both red) = 4/6 × 3/5 = 2/5, so P(at least one yellow) = 1 − 2/5 = 3/5."}, {"q": "On any day the probability of sun is 0.6. If it is sunny, the probability that Rohit walks is 0.8. If it is not sunny, the probability that he walks is 0.1. Find the probability that he walks on any day.", "o": ["0.52", "0.48", "0.9", "0.7"], "a": 0, "e": "Sunny and walk: 0.6 × 0.8 = 0.48. Not sunny and walk: 0.4 × 0.1 = 0.04. Total = 0.52."}, {"q": "A bag contains 3 white balls and 1 black ball. Two balls are picked at random without replacement. Find the probability that both are black.", "o": ["1/16", "0", "1/12", "1/4"], "a": 1, "e": "There is only one black ball, so two black balls cannot be picked: probability 0."}, {"q": "Bag A has 2 white and 6 black balls. Bag B has 3 white and 1 black ball. One ball is picked at random from each bag. Find the probability that the two balls are the same colour.", "o": ["5/8", "3/8", "1/2", "3/16"], "a": 1, "e": "Both white: 2/8 × 3/4 = 6/32. Both black: 6/8 × 1/4 = 6/32. Total = 12/32 = 3/8."}, {"q": "A box has 4 blue pens and 3 red pens. A pen is picked at random and replaced, then a second pen is picked. Find the probability that the two pens are the same colour.", "o": ["24/49", "1/2", "25/49", "16/49"], "a": 2, "e": "Both blue: 16/49. Both red: 9/49. Total = 25/49."}, {"q": "A bag contains 2 green, 3 white and 5 black marbles. Two marbles are picked at random without replacement. Find the probability that the first is black and the second is white.", "o": ["3/20", "2/9", "1/3", "1/6"], "a": 3, "e": "5/10 × 3/9 = 15/90 = 1/6."}, {"q": "A bag contains 2 green, 3 white and 5 black marbles. Two marbles are picked at random without replacement. Find the probability that they are different colours.", "o": ["31/45", "14/45", "1/2", "31/50"], "a": 0, "e": "P(same colour) = (2 + 6 + 20)/90 = 28/90 = 14/45. So P(different) = 1 − 14/45 = 31/45."}, {"q": "A bag contains 3 green, 3 red and 4 blue buttons. Two buttons are taken at random without replacement. Find the probability that they are different colours.", "o": ["4/15", "11/15", "2/3", "7/10"], "a": 1, "e": "P(same colour) = (6 + 6 + 12)/90 = 24/90 = 4/15. So P(different) = 11/15."}, {"q": "Seven cards show the letters B, A, N, A, N, A, S. A card is picked and replaced, then a second card is picked. Find the probability that both cards show N.", "o": ["1/21", "2/7", "4/49", "2/21"], "a": 2, "e": "With replacement: 2/7 × 2/7 = 4/49."}, {"q": "Seven cards show the letters B, A, N, A, N, A, S. Two cards are picked at random without replacement. Find the probability that one shows N and the other shows B.", "o": ["2/21", "1/21", "4/49", "1/7"], "a": 0, "e": "N then B: 2/7 × 1/6. B then N: 1/7 × 2/6. Total = 2/42 + 2/42 = 2/21."}, {"q": "Seven cards show the letters B, A, N, A, N, A, S. Two cards are picked at random without replacement. Find the probability that they show different letters.", "o": ["4/21", "3/7", "17/21", "5/7"], "a": 2, "e": "Same letter: A,A is 3/7 × 2/6 = 6/42 and N,N is 2/7 × 1/6 = 2/42, giving 8/42 = 4/21. Different = 17/21."}, {"q": "Seven cards show the letters B, A, N, A, N, A, S. Cards are picked at random without replacement until an A is picked. Find the probability that the first A appears on the third card.", "o": ["3/7", "6/35", "2/7", "4/35"], "a": 1, "e": "Not A, not A, then A: 4/7 × 3/6 × 3/5 = 36/210 = 6/35."}, {"q": "Nine packets are weighed. Four packets are heavier than 50 g and five are lighter. Two packets are chosen at random without replacement. Find the probability that one is heavier and the other is lighter.", "o": ["40/81", "5/9", "4/9", "5/18"], "a": 1, "e": "Heavy then light: 4/9 × 5/8 = 20/72. Light then heavy: the same. Total = 40/72 = 5/9."}, {"q": "A box contains 3 blue pens and 5 red pens. A pen is picked at random and replaced, then a second pen is picked. Find the probability that the two pens are the same colour.", "o": ["17/32", "15/32", "5/8", "1/2"], "a": 0, "e": "Both blue: 9/64. Both red: 25/64. Total = 34/64 = 17/32."}], "Venn diagrams and probability": [{"q": "The Venn diagram shows 33 students. 8 study only geography, 13 study both geography and history, 7 study only history and 5 study neither. One student is picked at random. Find the probability that the student studies neither subject.", "o": ["8/33", "5/33", "13/33", "7/33"], "a": 1, "e": "5 of the 33 students are outside both circles."}, {"q": "The Venn diagram shows 33 students. 8 study only geography, 13 study both geography and history, 7 study only history and 5 study neither. One student is picked at random. Find the probability that the student studies both subjects.", "o": ["13/20", "20/33", "13/33", "7/33"], "a": 2, "e": "13 of the 33 students are in the overlap."}, {"q": "60 people are asked if they have a car (C) and if they have a job (J). 12 have only a car, 18 have both, 20 have only a job and 10 have neither. One person is picked at random. Find the probability that the person has a car but no job.", "o": ["2/5", "1/5", "1/3", "3/10"], "a": 1, "e": "12 out of 60 = 1/5."}, {"q": "60 people are asked if they have a car (C) and if they have a job (J). 12 have only a car, 18 have both, 20 have only a job and 10 have neither. One person is picked at random. Find the probability that the person has neither.", "o": ["1/10", "1/3", "1/6", "5/6"], "a": 2, "e": "10 out of 60 = 1/6."}]}, "10": {"Conditional probability": [{"q": "In a class, P(plays football) = 0.5, P(plays football and basketball) = 0.2. Find P(plays basketball | plays football).", "o": ["0.2", "0.4", "0.5", "0.7"], "a": 1, "e": "0.2 ÷ 0.5 = 0.4."}, {"q": "A bag has 5 red and 3 blue balls. One is drawn and found to be red (not replaced). Find P(second draw is also red).", "o": ["4/7", "5/7", "4/8", "1/2"], "a": 0, "e": "4 red balls remain out of 7 total."}, {"q": "If P(A and B) = 0.12 and P(B) = 0.3, find P(A | B).", "o": ["0.4", "0.3", "0.12", "0.036"], "a": 0, "e": "0.12 ÷ 0.3 = 0.4."}, {"q": "Two events are independent if:", "o": ["P(A|B) = P(A)", "P(A|B) = P(B)", "P(A and B) = 0", "P(A) = P(B)"], "a": 0, "e": "Knowing B happened does not change the probability of A."}, {"q": "In a survey, P(likes tea) = 0.6, P(likes tea and coffee) = 0.3. Find P(likes coffee | likes tea).", "o": ["0.3", "0.5", "0.6", "0.9"], "a": 1, "e": "0.3 ÷ 0.6 = 0.5."}, {"q": "One number is chosen from 5, 10 and 15, and another from 4, 5 and 6. The two numbers are added. Given that the total is odd, find the probability that one of the numbers added is 15.", "o": ["2/5", "2/9", "1/3", "3/5"], "a": 0, "e": "The odd totals are 9, 11, 15, 19 and 21 (5 outcomes). Those that use 15 are 19 and 21, so 2/5."}, {"q": "One number is chosen at random from 1, 2 and 3, and another from 2, 3 and 4. The two numbers are added. Given that the total is odd, find the probability that one of the numbers is 3.", "o": ["1/3", "2/5", "3/4", "3/5"], "a": 3, "e": "Odd totals come from (1,2), (1,4), (2,3), (3,2) and (3,4): 5 outcomes. Three of them use a 3, so 3/5."}, {"q": "40 students: 24 play football, 15 play tennis and 9 play both. A student who plays football is chosen at random. Find the probability that they also play tennis.", "o": ["3/5", "9/40", "3/8", "5/8"], "a": 2, "e": "Of the 24 football players, 9 also play tennis: 9/24 = 3/8."}, {"q": "Two fair dice are rolled. Given that the total is greater than 9, find the probability that both dice show 5.", "o": ["1/36", "1/6", "1/3", "1/12"], "a": 1, "e": "Totals above 9: (4,6), (5,5), (6,4), (5,6), (6,5), (6,6), which is 6 outcomes. Only (5,5) has both dice showing 5, so 1/6."}, {"q": "A number is picked at random from 1 to 10. Given that it is even, find the probability that it is greater than 6.", "o": ["1/5", "3/10", "2/5", "1/2"], "a": 2, "e": "The even numbers are 2, 4, 6, 8, 10. Those greater than 6 are 8 and 10, so 2/5."}], "Tree diagrams": [{"q": "A box contains 3 blue pens and 5 red pens. Three pens are picked at random without replacement. Find the probability that two are blue and one is red.", "o": ["15/56", "15/28", "3/8", "5/56"], "a": 0, "e": "One order, such as BBR, has probability 3/8 × 2/7 × 5/6 = 30/336. There are 3 orders, so 90/336 = 15/56."}, {"q": "A box contains 4 blue pens and 3 red pens. Three pens are picked at random without replacement. Find the probability that two are blue and one is red.", "o": ["6/35", "3/7", "4/35", "18/35"], "a": 3, "e": "BBR has probability 4/7 × 3/6 × 3/5 = 6/35. There are 3 orders, so 3 × 6/35 = 18/35."}, {"q": "A bag contains 7 white balls and 3 black balls. Three balls are picked at random without replacement. Find the probability that two are white and one is black.", "o": ["63/1000", "3/10", "7/40", "21/40"], "a": 3, "e": "Number of ways = 21 × 3 = 63, out of 120 equally likely choices of 3 balls: 63/120 = 21/40."}, {"q": "A bag contains 7 white balls and 3 black balls. A ball is picked at random and replaced, then a second ball is picked. Find the probability that the balls are the same colour.", "o": ["21/50", "49/100", "29/50", "7/10"], "a": 2, "e": "Both white: 49/100. Both black: 9/100. Total = 58/100 = 29/50."}, {"q": "Bag A has 3 white and 5 black balls. Bag B has 3 white and 1 black ball. Jo takes a ball at random from bag A and puts it into bag B. She then picks a ball at random from bag B. Find the probability that it is black.", "o": ["13/40", "1/4", "5/8", "3/40"], "a": 0, "e": "Bag B now has 5 balls. White moved (3/8) then black: 3/8 × 1/5. Black moved (5/8) then black: 5/8 × 2/5. Total = 3/40 + 10/40 = 13/40."}], "Venn diagrams and probability": [{"q": "60 people are asked if they have a car (C) and if they have a job (J). 12 have only a car, 18 have both, 20 have only a job and 10 have neither. A person is chosen at random from those who have a car. Find the probability that this person also has a job.", "o": ["3/10", "9/19", "2/5", "3/5"], "a": 3, "e": "30 people have a car, and 18 of them have a job: 18/30 = 3/5."}, {"q": "A class of 30 students: 5 study only geography, 4 study both geography and history, 6 study only history and 15 study neither. Two students who study history are picked at random. Find the probability that one also studies geography and the other does not.", "o": ["4/15", "6/25", "2/5", "8/15"], "a": 3, "e": "10 students study history: 4 also geography and 6 not. 2 × 4/10 × 6/9 = 48/90 = 8/15."}, {"q": "A class has 40 students. 6 study only geography, 10 study both, 14 study only history and 10 study neither. Two students who study history are picked at random without replacement. Find the probability that one also studies geography and the other does not.", "o": ["35/138", "5/12", "1/2", "35/69"], "a": 3, "e": "24 students study history: 10 also geography and 14 not. 2 × 10/24 × 14/23 = 280/552 = 35/69."}], "Mutually exclusive and independent events": [{"q": "A and B are independent events with P(A) = 1/3 and P(B) = 1/4. Find P(A and B).", "o": ["1/12", "7/12", "1/7", "1/2"], "a": 0, "e": "For independent events, multiply: 1/3 × 1/4 = 1/12."}, {"q": "A and B are independent events with P(A) = 1/3 and P(B) = 1/4. Find P(A or B).", "o": ["1/2", "7/12", "1/12", "3/4"], "a": 0, "e": "P(A or B) = 1/3 + 1/4 − 1/12 = 4/12 + 3/12 − 1/12 = 6/12 = 1/2."}, {"q": "A and B are mutually exclusive events with P(A) = 0.3 and P(B) = 0.5. Find P(A or B).", "o": ["0.8", "0.15", "0.2", "0.65"], "a": 0, "e": "Mutually exclusive events cannot happen together, so add: 0.3 + 0.5 = 0.8."}, {"q": "The probability that it rains on Saturday is 0.3 and on Sunday is 0.4. The days are independent. Find the probability that it rains on both days.", "o": ["0.7", "0.34", "0.1", "0.12"], "a": 3, "e": "0.3 × 0.4 = 0.12."}, {"q": "A fair coin is tossed and a fair dice is rolled. Find the probability of a head and a 6.", "o": ["1/8", "2/3", "1/6", "1/12"], "a": 3, "e": "1/2 × 1/6 = 1/12."}, {"q": "Stephan picks a counter from bag A and Jen picks one from bag B. The probability that Stephan picks red is 2/5 and the probability that both pick red is 1/4. Find the probability that both pick blue.", "o": ["3/8", "9/40", "3/20", "7/40"], "a": 1, "e": "P(Jen red) = (1/4) ÷ (2/5) = 5/8, so P(Jen blue) = 3/8. P(Stephan blue) = 3/5. Both blue = 3/5 × 3/8 = 9/40."}, {"q": "Stephan picks a sweet from bag A and Jen picks one from bag B. The probability that Stephan picks red is 2/3 and the probability that both pick red is 1/3. Find the probability that Jen picks a red sweet.", "o": ["1/3", "2/9", "1/2", "2/3"], "a": 2, "e": "The picks are
